{{- include "repo-guardian.validateTemplatingVars" . -}}
{{- include "repo-guardian.validateBackendSecrets" . -}}
{{- include "repo-guardian.validateRemovedValues" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "repo-guardian.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "repo-guardian.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  selector:
    matchLabels:
      {{- include "repo-guardian.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "repo-guardian.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "repo-guardian.serviceAccountName" . }}
      terminationGracePeriodSeconds: 60
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.command }}
          command:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - containerPort: {{ .Values.config.port }}
              name: http
              protocol: TCP
            - containerPort: {{ .Values.config.metricsPort }}
              name: metrics
              protocol: TCP
          env:
            - name: GITHUB_APP_ID
              valueFrom:
                secretKeyRef:
                  name: {{ include "repo-guardian.secretName" . }}
                  key: app-id
            - name: GITHUB_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "repo-guardian.secretName" . }}
                  key: webhook-secret
            {{- if .Values.secrets.privateKeyAsFile }}
            - name: GITHUB_PRIVATE_KEY_PATH
              value: /etc/repo-guardian/private-key/private-key.pem
            {{- else }}
            - name: GITHUB_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "repo-guardian.secretName" . }}
                  key: private-key
            {{- end }}
            - name: LISTEN_ADDR
              value: ":{{ .Values.config.port }}"
            - name: METRICS_ADDR
              value: ":{{ .Values.config.metricsPort }}"
            - name: LOG_LEVEL
              value: {{ .Values.config.logLevel | quote }}
            - name: DRY_RUN
              value: {{ .Values.config.dryRun | quote }}
            - name: WORKER_COUNT
              value: {{ .Values.config.workerCount | quote }}
            - name: QUEUE_SIZE
              value: {{ .Values.config.queueSize | quote }}
            - name: MAX_JOB_ATTEMPTS
              value: {{ .Values.config.maxJobAttempts | quote }}
            - name: SCHEDULE_INTERVAL
              value: {{ .Values.config.scheduleInterval | quote }}
            - name: SKIP_FORKS
              value: {{ .Values.config.skipForks | quote }}
            - name: SKIP_ARCHIVED
              value: {{ .Values.config.skipArchived | quote }}
            - name: AUTO_CLOSE_PR
              value: {{ .Values.policy.autoClosePR | quote }}
            - name: ORPHAN_CLEANUP
              value: {{ .Values.policy.orphanCleanup | quote }}
            - name: TEMPLATE_DIR
              value: /etc/repo-guardian/templates
            {{- if or .Values.policy.config .Values.policy.existingConfigMap }}
            - name: GUARDIAN_CONFIG
              value: /etc/repo-guardian/policy/guardian.hcl
            {{- end }}
            {{- if .Values.templating.strict }}
            - name: STRICT_TEMPLATES
              value: "true"
            {{- end }}
            - name: STORE_BACKEND
              value: {{ .Values.store.backend | quote }}
            - name: QUEUE_BACKEND
              value: {{ .Values.queue.backend | quote }}
            - name: SCHEDULER_BACKEND
              value: {{ .Values.scheduler.backend | quote }}
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            {{- if eq .Values.store.backend "postgres" }}
            - name: STORE_POSTGRES_MAX_CONNS
              value: {{ .Values.store.postgres.maxConns | quote }}
            {{- if and (eq .Values.store.postgres.mode "baked") .Values.store.postgres.baked.existingSecret }}
            # Baked Postgres with an operator-supplied password: assemble
            # STORE_DSN at runtime from $(POSTGRES_PASSWORD) so the chart
            # never needs the password at template time (GitOps-safe).
            # POSTGRES_PASSWORD must precede STORE_DSN for $(...) expansion.
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.store.postgres.baked.existingSecret }}
                  key: {{ .Values.store.postgres.baked.existingSecretKey | default "POSTGRES_PASSWORD" }}
            - name: STORE_DSN
              value: "postgres://repoguardian:$(POSTGRES_PASSWORD)@{{ include "repo-guardian.postgresFullname" . }}.{{ .Release.Namespace }}.svc.cluster.local:5432/repoguardian?sslmode=disable"
            {{- else }}
            - name: STORE_DSN
              valueFrom:
                secretKeyRef:
                  name: {{ include "repo-guardian.storeSecretName" . }}
                  key: {{ include "repo-guardian.storeSecretKey" . }}
            {{- end }}
            - name: RECONCILE_FRESHNESS
              value: {{ .Values.staleSweep.freshness | quote }}
            - name: STALE_SWEEP_BATCH_SIZE
              value: {{ .Values.staleSweep.batchSize | quote }}
            {{- end }}
            - name: DISCOVERY_ENABLED
              value: {{ .Values.discovery.enabled | quote }}
            - name: DISCOVERY_INTERVAL
              value: {{ .Values.discovery.interval | quote }}
            - name: POSTURE_EXPORT_INTERVAL
              value: {{ .Values.posture.exportInterval | quote }}
            - name: COMPLIANCE_SNAPSHOT_INTERVAL
              value: {{ .Values.posture.snapshotInterval | quote }}
            {{- if eq .Values.queue.backend "valkey" }}
            {{- if and (eq .Values.queue.valkey.mode "baked") .Values.queue.valkey.baked.existingSecret }}
            # Baked Valkey with an operator-supplied password: assemble
            # QUEUE_VALKEY_DSN at runtime from $(VALKEY_PASSWORD).
            - name: VALKEY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.queue.valkey.baked.existingSecret }}
                  key: {{ .Values.queue.valkey.baked.existingSecretKey | default "VALKEY_PASSWORD" }}
            - name: QUEUE_VALKEY_DSN
              value: "redis://:$(VALKEY_PASSWORD)@{{ include "repo-guardian.valkeyFullname" . }}.{{ .Release.Namespace }}.svc.cluster.local:6379/0"
            {{- else }}
            - name: QUEUE_VALKEY_DSN
              valueFrom:
                secretKeyRef:
                  name: {{ include "repo-guardian.queueSecretName" . }}
                  key: {{ include "repo-guardian.queueSecretKey" . }}
            {{- end }}
            - name: JOB_ACK_TIMEOUT
              value: {{ .Values.queue.valkey.jobAckTimeout | quote }}
            - name: REAPER_INTERVAL
              value: {{ .Values.queue.valkey.reaperInterval | quote }}
            {{- end }}
            {{- range $k, $v := .Values.templating.vars }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          volumeMounts:
            {{- if .Values.secrets.privateKeyAsFile }}
            - name: github-private-key
              mountPath: /etc/repo-guardian/private-key
              readOnly: true
            {{- end }}
            - name: templates
              mountPath: /etc/repo-guardian/templates
              readOnly: true
            {{- if or .Values.policy.config .Values.policy.existingConfigMap }}
            - name: policy
              mountPath: /etc/repo-guardian/policy
              readOnly: true
            {{- end }}
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        {{- if .Values.secrets.privateKeyAsFile }}
        - name: github-private-key
          secret:
            secretName: {{ include "repo-guardian.secretName" . }}
            items:
              - key: private-key
                path: private-key.pem
        {{- end }}
        - name: templates
          configMap:
            name: {{ .Values.templates.existingConfigMap | default (printf "%s-templates" (include "repo-guardian.fullname" .)) }}
        {{- if or .Values.policy.config .Values.policy.existingConfigMap }}
        - name: policy
          configMap:
            name: {{ .Values.policy.existingConfigMap | default (printf "%s-policy" (include "repo-guardian.fullname" .)) }}
        {{- end }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
