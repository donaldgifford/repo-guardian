---
# $schema=https://goreleaser.com/static/schema.json
version: 2

builds:
  - id: repo-guardian
    binary: repo-guardian
    # The package DIRECTORY, never a file path. A file path compiles as
    # the synthetic `command-line-arguments` package containing only
    # that one file, so sibling files in cmd/repo-guardian/ (monitoring.go,
    # report.go) are silently excluded — which broke the build the moment
    # package main grew a second file (IMPL-0023, PR #179).
    main: ./cmd/repo-guardian
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    env:
      - CGO_ENABLED=0

archives:
  - id: default
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    formats: ["tar.gz"]
    files:
      - none*

# One SPDX JSON SBOM per archive, generated by syft (pinned in mise.toml)
# and named <archive>.sbom.json beside it; checksums.txt covers them, so
# the GPG signature over it covers them too.
sboms:
  - artifacts: archive

checksum:
  name_template: 'checksums.txt'

signs:
  - artifacts: checksum
    args:
      - "--batch"
      - "--local-user"
      - "{{ .Env.GPG_FINGERPRINT }}"
      - "--output"
      - "${signature}"
      - "--detach-sign"
      - "${artifact}"

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - Merge pull request
      - Merge branch
  groups:
    - title: Features
      regexp: "^feat:"
      order: 0
    - title: Bug Fixes
      regexp: "^fix:"
      order: 1
    - title: Others
      order: 999

release:
  github:
    owner: donaldgifford
    name: repo-guardian
  draft: false
  prerelease: auto
  mode: prepend
  # The API contract ships with every release (IMPL-0025 22.5), so a
  # client can pin the spec for the version it targets.
  extra_files:
    - glob: ./api/openapi.yaml
  header: |
    ## Release {{ .Tag }} ({{ .Date }})
    {{ if eq .Version "2.0.0" }}
    **Read the [2.0.0 release notes](https://github.com/donaldgifford/repo-guardian/blob/{{ .Tag }}/docs/releases/2.0.0.md) first: 2.0.0 is a fresh install and `latest` now points at it.**
    {{ end }}
    Verify what you download: [Verifying releases](https://github.com/donaldgifford/repo-guardian/blob/{{ .Tag }}/docs/operations/verifying-releases.md).

    ### Installation

    #### Linux/macOS (Manual)
    ```bash
    # Download the appropriate binary for your system
    # Extract and move to your PATH
    tar -xzf repo-guardian_*.tar.gz
    ```

  footer: |
    ---
    **Full Changelog**: https://github.com/donaldgifford/repo-guardian/compare/{{ .PreviousTag }}...{{ .Tag }}

snapshot:
  version_template: "{{ .Tag }}-dev"
