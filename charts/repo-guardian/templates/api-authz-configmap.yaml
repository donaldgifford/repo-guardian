{{- if and .Values.api.enabled .Values.api.auth.enabled }}
# API_AUTHZ_CONFIG (DESIGN-0027 § Authorization). Read once at startup;
# the checksum/authz pod annotation rolls the API on change (OQ26).
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "repo-guardian.fullname" . }}-authz
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "repo-guardian.labels" . | nindent 4 }}
data:
  authz.yaml: |
    groups:
      {{- range $g, $orgs := .Values.api.authz.groups }}
      {{ $g | quote }}: {{ $orgs | toJson }}
      {{- else }} {}
      {{- end }}
    defaultOrgs: {{ .Values.api.authz.defaultOrgs | default list | toJson }}
    clients:
      {{- range $c, $groups := .Values.api.authz.clients }}
      {{ $c | quote }}: {{ $groups | toJson }}
      {{- else }} {}
      {{- end }}
{{- end }}
