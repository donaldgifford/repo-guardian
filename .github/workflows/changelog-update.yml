---
# $schema=https://www.schemastore.org/github-action.json
name: Changelog Update

# Prepends a GA release's section to the root CHANGELOG.md and opens a
# PR with the diff. The section spans the previous GA tag to this one,
# with rc tags ignored, so a major covers its whole pre-release line
# (`--latest` would start at the last rc). Prepending keeps the older
# sections byte for byte, so the PR shows one new section. The PR goes
# through normal review and respects branch protection.
#
# NOTE: release.yml's bump-version pushes the tag with GITHUB_TOKEN, and
# GitHub starts no workflow from a GITHUB_TOKEN push, so the tag trigger
# below only fires for a hand-pushed tag. After a labelled release, the
# maintainer dispatches this with the tag. Opening the PR also needs
# "Allow GitHub Actions to create and approve pull requests"
# (Settings → Actions → General); without it the branch is pushed and
# the PR can be opened from it by hand.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: GA tag to write the section for (vX.Y.Z)
        required: true

permissions:
  contents: write
  pull-requests: write

jobs:
  update-changelog:
    name: Regenerate root CHANGELOG and open PR
    runs-on: ubuntu-latest
    # Pre-release tags (vX.Y.Z-rc.N) are cut by hand (prerelease.yml);
    # a changelog PR for each would be noise. The GA section covers them.
    if: github.event_name != 'push' || !contains(github.ref_name, '-')
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: main

      - name: Resolve the tag range
        id: tag
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if [[ ! "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::not a GA tag: ${TAG}"
            exit 1
          fi
          prev="$(git describe --tags --abbrev=0 --exclude '*-*' "${TAG}^")"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "range=${prev}..${TAG}" >> "$GITHUB_OUTPUT"

      - uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          # No --strip: git-cliff swaps cliff.toml's header out of the
          # file and writes it back above the new section.
          args: --ignore-tags '.*-.*' --prepend CHANGELOG.md ${{ steps.tag.outputs.range }}

      - name: Open changelog PR
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: chore/changelog-${{ steps.tag.outputs.tag }}
          title: "docs(changelog): update root CHANGELOG for ${{ steps.tag.outputs.tag }}"
          commit-message: "docs(changelog): update root CHANGELOG for ${{ steps.tag.outputs.tag }}"
          body: |
            Automated CHANGELOG regeneration triggered by tag
            `${{ steps.tag.outputs.tag }}`.

            Generated with `git-cliff --ignore-tags '.*-.*' --prepend CHANGELOG.md ${{ steps.tag.outputs.range }}`.
            Review the diff and merge to keep the root CHANGELOG current.
          labels: |
            chore
            dont-release
          delete-branch: true
          add-paths: |-
            CHANGELOG.md
