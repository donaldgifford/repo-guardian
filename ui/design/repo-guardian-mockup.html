<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Repo Guardian · UI mockup (DESIGN-0036)</title>
<!--
  Single-file mockup of the v2 business UI as DESIGN-0036 proposes it.

  Every panel is fed from an in-page `api` object whose shapes mirror
  api/openapi.yaml (Summary, RuleCompliance, RuleDetail, OrgSummary,
  OrgDetail, Finding, FindingPR, Evidence, Repository, RepositoryDetail,
  Event, Check, HistoryPoint, Policy, Status, Me). Nothing is drawn that
  today's API cannot back; the "Deferred" footnotes name what is missing.

  The real app bundles IBM Plex Sans and JetBrains Mono (the CSP forbids
  remote fonts). This mockup loads them from Google Fonts for convenience.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#17191d; --panel:#1f2227; --panel2:#262a30; --line:#31363d;
  --fg:#e8eaed; --muted:#9aa1ab; --accent:#5fa8f5;
  --ok:#3fb950; --warn:#d9a020; --bad:#f2554d; --info:#7aa7ff; --avatar:#3a4c6d;
  --r:3px;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 var(--sans);-webkit-font-smoothing:antialiased}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
code,.mono{font-family:var(--mono)}
.muted{color:var(--muted)}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* shell */
.shell{display:grid;grid-template-rows:40px 1fr;height:100vh}
.topbar{display:flex;align-items:center;gap:12px;padding:0 14px;background:var(--panel);border-bottom:1px solid var(--line);font-size:13px}
.brand{display:flex;align-items:center;gap:8px;font-weight:600;color:var(--fg)}
.brand svg{width:16px;height:16px;color:var(--accent)}
.brand small{font-weight:400;color:var(--muted)}
.topbar .sp{flex:1}
.tb-btn{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 8px;border:1px solid var(--line);border-radius:var(--r);color:var(--muted);font-size:12px}
.tb-btn:hover{background:var(--panel2);color:var(--fg)}
.tb-btn kbd{font:11px var(--mono);background:var(--panel2);padding:1px 4px;border-radius:2px}
.avatar{width:20px;height:20px;border-radius:var(--r);background:var(--avatar);color:#fff;font:600 10px/20px var(--sans);text-align:center}
.body{display:grid;grid-template-columns:220px 1fr;min-height:0}
.side{display:flex;flex-direction:column;background:var(--panel);border-right:1px solid var(--line);padding:10px 8px;font-size:13px;overflow:auto}
.side .g{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:12px 10px 4px}
.side a.nav{display:flex;align-items:center;gap:10px;padding:6px 10px;border-radius:var(--r);color:var(--muted);border-left:2px solid transparent}
.side a.nav svg{width:15px;height:15px;flex:none}
.side a.nav em{font:11px var(--mono);margin-left:auto;color:var(--muted)}
.side a.nav:hover{background:var(--panel2);color:var(--fg);text-decoration:none}
.side a.nav.cur{background:var(--panel2);color:var(--fg);border-left-color:var(--accent)}
.side .foot{margin-top:auto;padding:12px 10px 6px;font:11px var(--mono);color:var(--muted);border-top:1px solid var(--line)}
.side .foot a{color:var(--muted)}
.main{overflow:auto;padding:14px 24px 40px;min-width:0}

/* page anatomy */
.crumbs{font-size:12px;color:var(--muted);margin-bottom:8px}
.crumbs b{color:var(--fg);font-weight:500}
.crumbs span{margin:0 6px;opacity:.6}
.page-h{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:14px;flex-wrap:wrap}
.page-h h1{margin:0;font-size:20px;font-weight:600;display:flex;align-items:center;gap:10px}
.page-h p{margin:3px 0 0;color:var(--muted);font-size:13px}
.controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;font-size:12px}
.seg button{padding:5px 10px;color:var(--muted)}
.seg button:hover{color:var(--fg)}
.seg button.cur{background:var(--panel2);color:var(--fg)}
.btn{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border:1px solid var(--line);border-radius:var(--r);font-size:12px;color:var(--fg);background:var(--panel)}
.btn:hover{background:var(--panel2)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--fg);background:var(--panel2)}
.btn.sm{height:22px;padding:0 7px;font-size:11px}
.scope{min-width:150px;justify-content:space-between}

/* grid + cards */
.grid{display:grid;gap:12px}
.cols-2{grid-template-columns:1fr 1fr}
.cols-3{grid-template-columns:2fr 1fr}
.cols-3b{grid-template-columns:1fr 1fr 1fr}
.cols-4{grid-template-columns:repeat(4,1fr)}
.span-2{grid-column:span 2}
.mt{margin-top:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);min-width:0;position:relative}
.card-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:10px 14px 0}
.card-h b{display:block;font-size:13px;font-weight:600}
.card-h span.s{display:block;font-size:12px;color:var(--muted);margin-top:1px}
.card-h .right{flex:none;display:flex;gap:6px;align-items:center}
.card-b{padding:8px 14px 12px}
.strip{display:flex;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-top:10px}
.strip .cell{flex:1;padding:8px 14px;border-right:1px solid var(--line);min-width:0}
.strip .cell:last-child{border-right:0}
.strip .l{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.strip .v{font-size:18px;font-weight:600;margin-top:2px;white-space:nowrap}
.strip .v small{font-size:12px;font-weight:400;color:var(--muted)}
.strip .s{font-size:12px;color:var(--muted);margin-top:1px;line-height:1.35}
.card-b{overflow-x:auto}
@media (min-width:1600px){.layout.open .col-since,.layout.open .col-age{display:none}}
.tbl-wrap{overflow-x:auto;max-width:100%}
.layout.open .tbl td,.layout.open .tbl th{padding-left:8px;padding-right:8px}
.sb{display:grid;gap:9px;margin-top:4px}
.sb .r{display:grid;grid-template-columns:var(--lc,150px) 1fr 64px;gap:10px;align-items:center;font-size:12.5px}
.sb .r .lb{font-family:var(--mono);font-size:12.5px;text-align:right;overflow:hidden;text-overflow:ellipsis}
.sb .bar{display:flex;gap:2px;height:10px}
.sb .bar i{display:block;height:100%;min-width:0;transition:opacity .1s}
.sb .bar i:hover{opacity:.75}
.sb .r .tot{text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
.sb.single .r{grid-template-columns:1fr 64px}
.kpi{padding:10px 14px}
.kpi .l{font-size:12px;color:var(--muted)}
.kpi .v{font-size:22px;font-weight:600;line-height:1.2;margin-top:2px}
.kpi .s{font-size:12px;color:var(--muted);margin-top:2px}
.up{color:color-mix(in srgb,var(--ok) 75%,white)}.down{color:color-mix(in srgb,var(--bad) 75%,white)}
.pills{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 2px}
.pill{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:var(--r);padding:4px 9px;font-size:12px;color:var(--muted)}
.pill i{width:8px;height:8px;border-radius:2px;background:var(--line);display:inline-block}
.pill b{color:var(--fg);font-weight:500}
.pill[aria-pressed="true"]{background:var(--panel2);color:var(--fg);border-color:color-mix(in srgb,var(--accent) 50%,var(--line))}
.badge{display:inline-block;font:500 12px/1 var(--mono);padding:5px 7px;white-space:nowrap;vertical-align:middle}
.b-ok{background:color-mix(in srgb,var(--ok) 18%,transparent);color:color-mix(in srgb,var(--ok) 65%,white)}
.b-bad{background:color-mix(in srgb,var(--bad) 18%,transparent);color:color-mix(in srgb,var(--bad) 65%,white)}
.b-warn{background:color-mix(in srgb,var(--warn) 18%,transparent);color:color-mix(in srgb,var(--warn) 65%,white)}
.b-info{background:color-mix(in srgb,var(--info) 18%,transparent);color:color-mix(in srgb,var(--info) 65%,white)}
.b-mute{background:color-mix(in srgb,var(--muted) 18%,transparent);color:color-mix(in srgb,var(--muted) 65%,white)}
.b-outline{background:transparent;border:1px solid var(--line);color:var(--muted);padding:4px 6px}

/* tables */
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;font-weight:500;color:var(--muted);padding:7px 10px;border-bottom:1px solid var(--line);font-size:11.5px;white-space:nowrap}
.tbl td{padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;font-variant-numeric:tabular-nums;vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl .num{text-align:right}
.tbl td.m,.tbl .m{font-family:var(--mono);font-size:12.5px}
.tbl tr.link{cursor:pointer}
.tbl tr.link:hover td{background:var(--panel2)}
.tbl tr.sel td{background:color-mix(in srgb,var(--accent) 12%,transparent)}
.tbl .sub{display:block;font-size:11px;color:var(--muted);font-family:var(--sans)}
.tbl.dense td{padding:5px 8px}
.meter{height:5px;background:color-mix(in srgb,var(--m,var(--accent)) 20%,transparent);border-radius:2px;overflow:hidden;min-width:80px}
.meter i{display:block;height:100%;width:var(--w);background:var(--m,var(--accent));border-radius:2px}
.row-meter{display:flex;align-items:center;gap:10px}
.row-meter .meter{flex:1}
.row-meter b{font-weight:500;width:52px;text-align:right;font-variant-numeric:tabular-nums}
.trend{font-size:11px}

/* bar list */
.bl{display:grid;gap:8px;margin-top:4px}
.bl .r{display:grid;grid-template-columns:1fr auto;gap:4px 10px;font-size:12.5px;align-items:center}
.bl .r .t{display:flex;justify-content:space-between;align-items:baseline;grid-column:1/-1}
.bl .r .t em{font-style:normal;color:var(--muted);font-size:11px;margin-left:6px}
.bl .r .t b{font-weight:500;font-variant-numeric:tabular-nums}
.bl .bar{grid-column:1/-1;height:8px;background:transparent}
.bl .bar i{display:block;height:100%;width:var(--w);background:var(--accent);border-radius:0 4px 4px 0;min-width:2px}

/* chips + filters */
.filters{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 14px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:var(--r);padding:4px 8px;font:11.5px var(--mono);color:var(--muted)}
.chip b{color:var(--fg);font-weight:500}
.chip:hover{background:var(--panel2)}
.chip.add{border-style:dashed}
.filters .count{margin-left:auto;font-size:12px;color:var(--muted)}

/* drawer */
.layout{display:grid;grid-template-columns:1fr;gap:12px;align-items:start}
.layout.open{grid-template-columns:minmax(0,1fr) 470px}
.drawer{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;position:sticky;top:0;max-height:100vh;overflow-y:auto}
.drawer-scrim{display:none}
@media (max-width:1599px){.layout.open{grid-template-columns:minmax(0,1fr)}.drawer-scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:25}.drawer{position:fixed;top:0;right:0;bottom:0;width:470px;max-width:92vw;border-radius:0;border-width:0 0 0 1px;z-index:30;box-shadow:-12px 0 32px rgba(0,0,0,.45)}}
.drawer h3{margin:0;font-size:15px;font-weight:600;display:flex;justify-content:space-between;align-items:center;gap:8px}
.drawer .sub{font:12px var(--mono);color:var(--muted);margin:3px 0 14px}
.kv{display:grid;grid-template-columns:110px 1fr;gap:9px 10px;font-size:13px;align-items:center;margin-bottom:14px}
.kv span{color:var(--muted);font-size:12px}
.ev{font:12px/1.55 var(--mono);background:var(--bg);border:1px solid var(--line);padding:10px 12px;margin-bottom:14px;white-space:pre-wrap;word-break:break-word}
.ev .bad{color:color-mix(in srgb,var(--bad) 75%,white)}
.ev .k{color:var(--muted)}
.hist{border-left:2px solid var(--line);margin:4px 0 0 6px;padding-left:16px;display:grid;gap:2px}
.hist div{position:relative;padding:5px 0;font-size:12.5px}
.hist div::before{content:"";position:absolute;left:-23px;top:11px;width:8px;height:8px;background:var(--muted)}
.hist div.now::before{background:var(--accent)}
.hist .d{font:11.5px var(--mono);color:var(--muted);display:block}
.drawer .actions{display:flex;justify-content:space-between;align-items:center;margin-top:16px;padding-top:12px;border-top:1px solid var(--line);font-size:12px}

/* group grid */
.gg{width:100%;border-collapse:collapse;font-size:13px}
.gg th{text-align:left;font-weight:500;color:var(--muted);padding:7px 10px;border-bottom:1px solid var(--line);font-size:11.5px}
.gg td{padding:7px 10px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums;white-space:nowrap}
.gg .num{text-align:right}
.gg tr.grp td{font-weight:600;cursor:pointer}
.gg tr.grp:hover td{background:var(--panel2)}
.gg tr.grp td .meta{font-weight:400;color:var(--muted);font-size:12px;margin-left:8px}
.gg tr.child td:first-child{padding-left:38px;font-weight:400}
.gg .tog{display:inline-grid;place-items:center;width:18px;height:18px;border:1px solid var(--line);border-radius:var(--r);font:11px var(--mono);color:var(--muted);margin-right:8px}
.gg .heat{position:relative}
.gg .heat small{color:var(--muted);margin-left:8px;font-size:11px}
.gg tr.total td{border-top:2px solid var(--line);font-weight:600;color:var(--muted)}
.gg td .rk{font:11px var(--mono);color:var(--muted);margin-right:8px;border:1px solid var(--line);padding:1px 4px;border-radius:2px}

/* charts */
.chart-wrap{position:relative}
.chart{display:block;width:100%;height:auto}
.chart text{font:11px var(--mono);fill:var(--muted)}
.chart .grid line{stroke:var(--line);stroke-width:1}
.chart .ax{stroke:var(--line)}
.chart .ln{fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.chart .xh{stroke:var(--muted);stroke-width:1;opacity:0}
.chart .dot{stroke:var(--panel);stroke-width:2}
.chart .hit{fill:transparent}
.chart rect.bar{transition:opacity .1s}
.chart rect.bar:hover,.chart .seg:hover{opacity:.8}
.chart .lbl{fill:var(--fg)}
.tip{position:fixed;z-index:50;pointer-events:none;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:6px 9px;font-size:12px;box-shadow:0 8px 24px rgba(0,0,0,.4);display:none;min-width:120px}
.tip .t{font:11px var(--mono);color:var(--muted);margin-bottom:3px}
.tip .r{display:flex;justify-content:space-between;gap:14px}
.tip .r i{display:inline-block;width:10px;height:2px;vertical-align:middle;margin-right:6px}
.tip .r b{font-weight:600}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.tv{display:none}
.card.table-view .chart-wrap,.card.table-view .legend,.card.table-view .pills{display:none}
.card.table-view .tv{display:block}
.defer{margin-top:16px;font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:10px}
.defer code{font-size:11.5px}

/* popovers, palette */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.35)}
.pop{position:fixed;z-index:45;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:0 12px 36px rgba(0,0,0,.45);min-width:200px;padding:6px;font-size:13px}
.pop .it{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:6px 8px;border-radius:var(--r);color:var(--fg);width:100%;text-align:left}
.pop .it:hover,.pop .it.cur{background:var(--panel2)}
.pop .it small{color:var(--muted);font-family:var(--mono);font-size:11px}
.pop .hd{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:8px 8px 4px}
.pop hr{border:0;border-top:1px solid var(--line);margin:4px 0}
.pal{position:fixed;z-index:46;left:50%;top:14vh;transform:translateX(-50%);width:560px;max-width:92vw;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:0 24px 60px rgba(0,0,0,.5)}
.pal input{width:100%;background:transparent;border:0;border-bottom:1px solid var(--line);color:var(--fg);font:14px var(--sans);padding:12px 14px;outline:0}
.pal .res{max-height:50vh;overflow:auto;padding:6px}
.pal .empty{padding:14px;color:var(--muted);font-size:13px}

/* status page */
.status-page{max-width:760px;margin:40px auto;padding:0 16px}
.status-page .hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.banner{display:flex;align-items:center;gap:14px;padding:14px 16px}
.banner .dot{width:10px;height:10px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 0 color-mix(in srgb,var(--ok) 50%,transparent);animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--ok) 45%,transparent)}70%{box-shadow:0 0 0 8px transparent}100%{box-shadow:0 0 0 0 transparent}}
@media (prefers-reduced-motion:reduce){.banner .dot{animation:none}}
.banner b{display:block;font-size:15px}
.banner span{color:var(--muted);font-size:13px}
.comp{display:grid;gap:0}
.comp .row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px}
.comp .row:last-child{border-bottom:0}
.comp .row i{width:8px;height:8px;border-radius:50%;flex:none}
.comp .row .n{font-family:var(--mono);font-size:12.5px;width:118px;flex:none}
.comp .row .d{color:var(--muted);flex:1;font-size:12.5px}
.hero{font-size:44px;font-weight:600;line-height:1.1}
.status-page .ft{text-align:center;font:11px var(--mono);color:var(--muted);margin-top:18px}
</style>
</head>
<body>
<div id="app"></div>
<div class="tip" id="tip" role="tooltip"></div>
<script>
(function(){
'use strict';

/* ------------------------------------------------------------------ */
/* tokens, formatting                                                  */
/* ------------------------------------------------------------------ */
const C={accent:'#5fa8f5',info:'#7aa7ff',ok:'#3fb950',warn:'#d9a020',bad:'#f2554d',muted:'#9aa1ab',panel:'#1f2227',bg:'#17191d',line:'#31363d'};
const NOW=new Date('2026-10-15T14:20:00Z');
const DAY=864e5;
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtN=n=>n==null?'—':Number(n).toLocaleString('en-US');
const pct=(c)=>{const d=c.compliant+c.non_compliant;return d===0?null:Math.floor(c.compliant*1000/d)/10};
const fmtP=p=>p==null?'unmeasured':p.toFixed(1)+'%';
const daysAgo=d=>new Date(NOW-d*DAY);
const iso=d=>new Date(d).toISOString().replace(/\.\d{3}Z$/,'Z');
const tz=()=>localStorage.getItem('rg.tz')||'local';
function fmtTime(d,opts){d=new Date(d);const utc=tz()==='utc';const p=n=>String(n).padStart(2,'0');const Y=utc?d.getUTCFullYear():d.getFullYear(),M=utc?d.getUTCMonth():d.getMonth(),D=utc?d.getUTCDate():d.getDate(),h=utc?d.getUTCHours():d.getHours(),m=utc?d.getUTCMinutes():d.getMinutes();const dateOnly=opts&&opts.hour===undefined&&'hour' in opts;return `${Y}-${p(M+1)}-${p(D)}`+(dateOnly?'':` ${p(h)}:${p(m)}`)+(utc&&!dateOnly?' UTC':'')}

const CH={};let chartSeq=0;
const nice=(v,down)=>{const s=10;return down?Math.floor(v/s)*s:Math.ceil(v/s)*s};
function areaChart(series,o){
  o=Object.assign({h:230,unit:'%',color:C.accent,label:'compliance %',id:'ch'+(++chartSeq),fill:true},o||{});
  const W=o.w||720,H=o.h,L=44,R=14,T=12,B=26;const vals=series.map(p=>p.v).filter(v=>v!=null);
  let min=o.min!=null?o.min:nice(Math.min(...vals)-2,true),max=o.max!=null?o.max:nice(Math.max(...vals)+2);if(o.unit==='%'){max=Math.min(100,max);min=Math.max(0,min)}if(max===min)max=min+10;
  const n=series.length;const x=i=>L+(n===1?0:i*(W-L-R)/(n-1));const y=v=>T+(max-v)*(H-T-B)/(max-min);
  let d='',area='';series.forEach((p,i)=>{if(p.v==null)return;d+=(d?'L':'M')+x(i).toFixed(1)+' '+y(p.v).toFixed(1)+' '});
  if(d)area=d+'L'+x(n-1).toFixed(1)+' '+y(min)+' L'+x(0)+' '+y(min)+' Z';
  const ticks=[];const step=(max-min)/4;for(let g=0;g<=4;g++)ticks.push(+(min+g*step).toFixed(1));
  const grid=ticks.map(g=>`<line x1="${L}" x2="${W-R}" y1="${y(g)}" y2="${y(g)}"/><text x="${L-8}" y="${y(g)+4}" text-anchor="end">${o.unit==='%'?g+'%':fmtN(g)}</text>`).join('');
  const xt=[];const want=Math.min(o.xticks||7,n);for(let k=0;k<want;k++){const i=Math.round(k*(n-1)/Math.max(1,want-1));xt.push(`<text x="${x(i)}" y="${H-7}" text-anchor="${i===0?'start':i===n-1?'end':'middle'}">${fmtDate(series[i].t)}</text>`)}
  const last=series[n-1];
  CH[o.id]={type:'area',series,x:Array.from({length:n},(_,i)=>x(i)),y,W,unit:o.unit,label:o.label,color:o.color};
  const svg=`<div class="chart-wrap"><svg class="chart" viewBox="0 0 ${W} ${H}" data-chart="${o.id}" role="img" aria-label="${esc(o.aria||o.label)}"><g class="grid">${grid}</g>${xt.join('')}${o.fill?`<path d="${area}" fill="${o.color}" opacity=".10"/>`:''}<path class="ln" d="${d}" stroke="${o.color}"/><line class="xh" x1="0" x2="0" y1="${T}" y2="${H-B}"/><circle class="dot" cx="${x(n-1)}" cy="${last.v==null?-99:y(last.v)}" r="4.5" fill="${o.color}"/><text class="lbl" x="${x(n-1)-10}" y="${(last.v==null?0:y(last.v))-10}" text-anchor="end" font-weight="600">${last.v==null?'':(o.unit==='%'?last.v.toFixed(1)+'%':fmtN(last.v))}</text><circle class="dot hv" r="4.5" fill="${o.color}" style="opacity:0"/><rect class="hit" x="${L}" y="0" width="${W-L-R}" height="${H}"/></svg></div>`;
  const tv=`<div class="tv"><table class="tbl dense"><thead><tr><th>Snapshot</th><th class="num">${esc(o.label)}</th></tr></thead><tbody>${series.slice().reverse().slice(0,30).map(p=>`<tr><td class="m">${fmtDate(p.t)}</td><td class="num">${p.v==null?'—':(o.unit==='%'?p.v.toFixed(1)+'%':fmtN(p.v))}</td></tr>`).join('')}</tbody></table>${n>30?`<div class="muted" style="font-size:12px;padding:6px 8px">latest 30 of ${n} snapshots</div>`:''}</div>`;
  return svg+tv;
}
function barChart(cats,vals,o){
  o=Object.assign({h:200,color:C.accent,id:'ch'+(++chartSeq),label:'count'},o||{});
  const W=360,H=o.h,L=34,R=10,T=18,B=26;const max=nice(Math.max(1,...vals)*1.1);const n=cats.length;const slot=(W-L-R)/n;const bw=Math.min(24,slot*.6);
  const y=v=>T+(max-v)*(H-T-B)/max;const ticks=[0,.25,.5,.75,1].map(f=>Math.round(max*f));
  const grid=ticks.map(g=>`<line x1="${L}" x2="${W-R}" y1="${y(g)}" y2="${y(g)}"/><text x="${L-8}" y="${y(g)+4}" text-anchor="end">${fmtN(g)}</text>`).join('');
  const bars=cats.map((c,i)=>{const cx=L+slot*i+slot/2;const top=y(vals[i]);const h=Math.max(0,y(0)-top);const r=Math.min(4,h);
    const p=`M${cx-bw/2} ${y(0)} V${top+r} a${r} ${r} 0 0 1 ${r} -${r} H${cx+bw/2-r} a${r} ${r} 0 0 1 ${r} ${r} V${y(0)} Z`;
    return `<g class="bar" data-i="${i}"><path d="${p}" fill="${o.color}"/><text class="lbl" x="${cx}" y="${top-6}" text-anchor="middle">${fmtN(vals[i])}</text><text x="${cx}" y="${H-7}" text-anchor="middle">${esc(c)}</text><rect class="hit" x="${cx-slot/2}" y="0" width="${slot}" height="${H}"/></g>`}).join('');

function stackedBars(rows,segs,o){

  return `<div class="chart-wrap"><div class="sb ${single?'single':''}" data-chart="${o.id}" role="img" aria-label="${esc(o.aria||'status counts per rule')}">${body}</div></div>${legend}${tv}`;
}
function sparkline(vals,o){o=Object.assign({w:84,h:22,color:C.accent},o||{});const v=vals.filter(x=>x!=null);if(v.length<2)return '<span class="muted">—</span>';const min=Math.min(...v),max=Math.max(...v);const n=vals.length;const x=i=>2+i*(o.w-4)/(n-1);const y=val=>max===min?o.h/2:2+(max-val)*(o.h-4)/(max-min);let d='';vals.forEach((val,i)=>{if(val==null)return;d+=(d?'L':'M')+x(i).toFixed(1)+' '+y(val).toFixed(1)+' '});const last=vals[n-1];return `<svg width="${o.w}" height="${o.h}" viewBox="0 0 ${o.w} ${o.h}" aria-hidden="true"><path d="${d}" fill="none" stroke="${o.color}" stroke-width="1.5"/><circle cx="${x(n-1)}" cy="${y(last)}" r="2.5" fill="${o.color}"/></svg>`}

const tip=document.getElementById('tip');
function showTip(x,y,title,rows){tip.replaceChildren();const t=document.createElement('div');t.className='t';t.textContent=title;tip.appendChild(t);for(const r of rows){const d=document.createElement('div');d.className='r';const l=document.createElement('span');if(r.color){const i=document.createElement('i');i.style.background=r.color;l.appendChild(i)}l.appendChild(document.createTextNode(r.label));const b=document.createElement('b');b.textContent=r.value;d.append(l,b);tip.appendChild(d)}tip.style.display='block';const w=tip.offsetWidth,h=tip.offsetHeight;tip.style.left=Math.min(window.innerWidth-w-8,x+14)+'px';tip.style.top=Math.max(8,y-h-12)+'px'}

function wireCharts(root){
  root.querySelectorAll('[data-chart]').forEach(svg=>{const ch=CH[svg.dataset.chart];if(!ch)return;
    if(ch.type==='area'){const xh=svg.querySelector('.xh'),hv=svg.querySelector('.dot.hv');
      svg.addEventListener('pointermove',e=>{const r=svg.getBoundingClientRect();const px=(e.clientX-r.left)*ch.W/r.width;let best=0,bd=1e9;ch.x.forEach((x,i)=>{const d=Math.abs(x-px);if(d<bd){bd=d;best=i}});const p=ch.series[best];const cx=ch.x[best];xh.setAttribute('x1',cx);xh.setAttribute('x2',cx);xh.style.opacity=1;if(p.v!=null){hv.setAttribute('cx',cx);hv.setAttribute('cy',ch.y(p.v));hv.style.opacity=1}else hv.style.opacity=0;
        const rows=[{label:ch.label,value:p.v==null?'unmeasured':(ch.unit==='%'?p.v.toFixed(1)+'%':fmtN(p.v)),color:ch.color}];if(p.extra)rows.push(...p.extra);showTip(e.clientX,e.clientY,fmtTime(p.t,{hour:undefined,minute:undefined}),rows)});
      svg.addEventListener('pointerleave',()=>{xh.style.opacity=0;hv.style.opacity=0;hideTip()});}
    if(ch.type==='bar'){svg.querySelectorAll('g.bar').forEach(g=>{const i=+g.dataset.i;g.addEventListener('pointermove',e=>showTip(e.clientX,e.clientY,ch.cats[i],[{label:ch.label,value:fmtN(ch.vals[i]),color:ch.color}]));g.addEventListener('pointerleave',hideTip)})}
    if(ch.type==='stack'){svg.querySelectorAll('i[data-r]').forEach(el=>{const r=ch.rows[+el.dataset.r];el.addEventListener('pointermove',e=>showTip(e.clientX,e.clientY,r.label,ch.segs.map(s=>({label:s.label,value:fmtN(r.counts[s.key]||0),color:s.color}))));el.addEventListener('pointerleave',hideTip)})}
  });
}

const FILTERS=[['status',['compliant','non_compliant','not_applicable','unknown']],['reason',['file_missing','assertion_failed','content_differs','forbidden_present','setting_mismatch','ruleset_missing','ruleset_mismatch','out_of_scope_policy','out_of_scope_rule','ignored_global','ignored_rule','gate_closed','branch_missing','empty_repository','gate_error','foreign_pr_open','migrated_from_v1']],['remediation',['none','pr_open','foreign_pr','applied','dry_run','disabled']],['kind',['file','setting','branch_protection']],['rule',RULES.map(r=>r.name)],['org',ORGS.map(o=>o.org)],['pr_stale',['true']]];
function evidenceText(f){const e=f.evidence||{};const k=s=>`<span class="k">${esc(s)}</span>`;const bad=s=>`<span class="bad">✗</span> ${esc(s)}`;
  switch(f.reason){
    case 'file_missing':return `${k('none of the checked paths exist')}\n${(e.paths_checked||[]).map(p=>'  '+esc(p)).join('\n')}`;
    case 'assertion_failed':return `${esc(e.path)}\n${bad(e.message)}`;
    case 'content_differs':return `${esc(e.path)}\n${bad('differs from the template')} ${k('('+esc(e.comparison)+' comparison)')}`;
    case 'forbidden_present':return `${esc(e.path)}\n${bad('exists and is forbidden')}`;
    case 'setting_mismatch':return `${esc(e.property)}\n${k('expected')} ${esc(e.expected)}\n${k('found')}    ${esc(e.actual)}`;
    case 'ruleset_missing':return `${k('no ruleset protects')} ${esc(e.branch)}`;
    case 'ruleset_mismatch':return `${esc(e.branch)} ${k('· ruleset '+e.ruleset_id)}\n${(e.mismatches||[]).map(m=>bad(m)).join('\n')}`;
    case 'out_of_scope_policy':case 'out_of_scope_rule':return k('rule not in scope for this org');
    case 'ignored_global':case 'ignored_rule':return `${k('ignored by pattern')} ${esc(e.pattern)}`;
    case 'gate_closed':return `${k('gate closed:')} ${esc(e.referee)} ${k('is not satisfied')}`;
    case 'branch_missing':return `${k('branch')} ${esc(e.branch)} ${k('does not exist')}`;
    case 'gate_error':return `${k('gate')} ${esc(e.referee)}\n${bad(e.error)}`;
    case 'foreign_pr_open':return `${k('another open PR touches')} ${esc(f.pr&&f.pr.matched_term)}`;
    case 'migrated_from_v1':return `${k('migrated from v1 · actionable since')} ${esc(fmtTime(e.v1_actionable_since))}`;
    default:return f.reason?esc(f.reason):k('compliant');
  }}
const prLink=f=>f.pr?`<a href="${esc(f.pr.url)}" target="_blank" rel="noopener noreferrer" class="m">#${f.pr.number}</a>`:'<span class="muted">—</span>';
function describeEvent(ev){if(ev.source==='repository'){const d=ev.detail||{};switch(ev.kind){case 'discovered':return 'discovered via installation';case 'renamed':return `renamed ${d.from} → ${d.to}`;case 'transferred':return `transferred from ${d.from}`;case 'parked':return `parked · ${d.reason}`;case 'unparked':return 'un-parked by discovery';case 'removed':return 'removed';default:return ev.kind}}return `became <b>${esc(ev.to_status)}</b>${ev.to_reason?' · '+esc(ev.to_reason):''}${ev.to_remediation&&ev.to_remediation!=='none'?' · '+esc(ev.to_remediation):''}`}
function timeline(repoId,f){const ev=api.events(repoId).items.filter(e=>e.source==='repository'?['parked','unparked','renamed','transferred'].includes(e.kind):(!f||(e.rule_kind===f.rule_kind&&e.rule_name===f.rule_name)));
  let checks=api.checks(repoId).items.filter(c=>!f||c.started_at>=f.status_since);
  if(f){const latest=checks.slice(0,2);checks=checks.filter(c=>c.outcome!=='success'||latest.includes(c))}
  const newest=checks[0];
  const items=[...ev.map(e=>({t:e.occurred_at,html:describeEvent(e)})),...checks.map(c=>({t:c.started_at,html:`re-checked · ${c.outcome==='success'?(f&&f.status==='non_compliant'?'still '+esc(f.status):'ok'):esc(c.outcome)}${c===newest&&f&&f.pr&&f.pr.created_at&&c.started_at>f.pr.created_at&&f.remediation==='pr_open'?` · PR #${f.pr.number} still open (${Math.floor((c.started_at-f.pr.created_at)/DAY)}d)`:''}${c.error?` · <span class="muted">${esc(c.error)}</span>`:''}`}))];
  if(f&&f.pr&&f.pr.created_at)items.push({t:f.pr.created_at,html:`PR #${f.pr.number} opened · <span class="m">${esc(f.pr.head)}</span>`});
  items.sort((a,b)=>a.t-b.t);const show=items.slice(-20);
  return `<div class="hist">${show.map((i,k)=>`<div class="${k===show.length-1?'now':''}"><span class="d">${timeAttr(i.t)}${fmtTime(i.t)}</time></span>${i.html}</div>`).join('')}</div>`}

V.findings=()=>{const {q}=route();const f=Object.assign({},q);delete f.range;if(!('status' in q)&&!q.reason&&!q.remediation&&!q.pr_stale)f.status='non_compliant';
  const res=api.findings(f);const s=api.summary(q.org||'');const open=q.open?q.open.split('/'):null;const sel=open?res.items.find(x=>String(x.repository_id)===open[0]&&x.rule_kind===open[1]&&x.rule_name===open[2])||FINDINGS.find(x=>String(x.repository_id)===open[0]&&x.rule_kind===open[1]&&x.rule_name===open[2]):null;
  const active=FILTERS.filter(([k])=>f[k]);const chips=active.map(([k])=>`<button class="chip" data-act="pop" data-pop="filter:${k}">${k} = <b>${esc(f[k])}</b></button>`).join('')+`<button class="chip add" data-act="pop" data-pop="filter:">+ filter</button>`;
  const table=`<table class="tbl"><thead><tr><th>Repository</th><th>Rule</th><th>Status</th><th>Reason</th><th>Remediation</th><th>PR</th><th class="num col-age">Age</th><th class="col-since">Since</th></tr></thead><tbody>${res.items.map(x=>{const isSel=sel&&sel.repository_id===x.repository_id&&sel.rule_kind===x.rule_kind&&sel.rule_name===x.rule_name;return `<tr class="link ${isSel?'sel':''}" data-act="open" data-open="${x.repository_id}/${x.rule_kind}/${x.rule_name}" tabindex="0"><td class="m" style="color:var(--fg)">${esc(x.org)}/${esc(x.repository)}</td><td class="m">${esc(x.rule_name)}</td><td>${statusBadge(x.status)}</td><td class="m muted">${x.reason?esc(x.reason):'—'}</td><td>${remBadge(x.remediation)}</td><td>${prLink(x)}</td><td class="num m col-age">${x.pr&&x.pr.created_at?ageDays(x.pr.created_at)+'d'+(x.pr_stale?' <span class="badge b-warn" style="padding:3px 5px;font-size:10.5px">stale</span>':''):'—'}</td><td class="muted col-since">${timeAttr(x.status_since)}${rel(x.status_since)}</time></td></tr>`}).join('')||`<tr><td colspan="8" class="muted" style="text-align:center;padding:28px">No findings match.</td></tr>`}</tbody></table>`;
  const drawer=sel?`<div class="drawer-scrim" data-act="open" data-open="" aria-hidden="true"></div><aside class="drawer" role="dialog" aria-label="Finding detail">
    <h3><a href="https://github.com/${esc(sel.org)}/${esc(sel.repository)}" target="_blank" rel="noopener noreferrer">${esc(sel.org)}/${esc(sel.repository)} ${ICON.ext}</a><button class="btn ghost sm" data-act="open" data-open="" aria-label="Close">✕</button></h3>
    <div class="sub">rule ${esc(sel.rule_name)} (${esc(sel.rule_kind)}) · since ${esc(fmtTime(sel.status_since,{hour:undefined,minute:undefined}))}</div>
    <div class="kv"><span>Status</span><div>${statusBadge(sel.status)}</div><span>Reason</span><div>${sel.reason?reasonBadge(sel.reason,sel.status):'<span class="muted">—</span>'}</div><span>Remediation</span><div>${remBadge(sel.remediation)} ${sel.pr?`${prLink(sel)}${sel.pr.head?` <span class="m muted" style="font-size:12px">· ${esc(sel.pr.head)}</span>`:''}${sel.pr.matched_term?` <span class="m muted" style="font-size:12px">· matched ${esc(sel.pr.matched_term)}</span>`:''}`:''}</div><span>Last evaluated</span><div class="muted" style="font-size:12.5px">${timeAttr(sel.last_evaluated_at)}${fmtTime(sel.last_evaluated_at)}</time></div></div>
    <div class="ev">${evidenceText(sel)}</div>
    ${timeline(sel.repository_id,sel)}
    <div class="actions"><span class="muted">actions slot (IMPL-0029 re-evaluate)</span><a href="#/repos/${sel.repository_id}">Open repository →</a></div></aside>`:'';
  return pageHeader('Findings','Every rule outcome, with its reason and what was done about it. Filters map 1:1 to <code>/findings</code> query parameters.',{actions:`<button class="btn" data-act="toast">Export CSV</button>`})
    +`<div class="layout ${sel?'open':''}"><div>${card(null,null,'').replace(/<div class="card-h">[\s\S]*?<\/div><\/div>/,'').replace('<div class="card-b"></div>',`<div class="filters">${chips}<span class="count">${res.items.length} loaded${f.status==='non_compliant'&&!f.reason&&!f.rule&&!f.kind&&!f.remediation&&!f.pr_stale?` of ${fmtN(s.findings.non_compliant)} non-compliant`:''}</span></div>`)}<div class="card mt"><div class="tbl-wrap">${table}</div></div>${res.items.length>=50?'<div style="text-align:center;margin-top:10px"><button class="btn">Load more</button></div>':''}</div>${drawer}</div>`
    +deferred(['sort = pr_age chip (GET /findings?sort=, OQ5)']);
};

V.repo=(id)=>{const d=api.repository(id);if(!d)return notFound();const r=d.repository;const ev=api.events(id).items;const checks=api.checks(id).items;
  return pageHeader(`${esc(r.org)}/${esc(r.name)} ${r.active?badge('active','ok'):badge('parked · '+r.park_reason,'warn')}`,`checked ${rel(r.last_checked_at)} · installation ${esc(d.installation.account)} (#${d.installation.id}) · next check ${until(r.next_due_at)}`,{scope:false,actions:`<a class="btn" href="https://github.com/${esc(r.org)}/${esc(r.name)}" target="_blank" rel="noopener noreferrer">Open on GitHub ${ICON.ext}</a>`})
    +`<div class="grid cols-3"><div class="grid" style="align-content:start">
      ${card('Findings','Each rule\'s status, reason and evidence. Evidence is rendered as text only.',`<table class="tbl"><thead><tr><th>Rule</th><th>Status</th><th>Reason / evidence</th><th>Remediation</th><th>Since</th></tr></thead><tbody>${d.findings.map(f=>`<tr class="link" data-go="findings?open=${f.repository_id}/${f.rule_kind}/${f.rule_name}&status="><td class="m">${esc(f.rule_name)} <span class="sub">${esc(f.rule_kind)}</span></td><td>${statusBadge(f.status)}</td><td style="white-space:normal;max-width:360px">${f.reason?`<span class="m muted">${esc(f.reason)}</span><div class="m" style="font-size:12px;margin-top:2px;color:var(--muted)">${evidenceText(f).split('\n')[1]||evidenceText(f).split('\n')[0]}</div>`:'<span class="muted">—</span>'}</td><td>${remBadge(f.remediation)} ${f.pr?prLink(f):''}</td><td class="muted">${rel(f.status_since)}</td></tr>`).join('')}</tbody></table>`)}
      ${card('Recent checks','Trigger, outcome, duration, error.',`<table class="tbl"><thead><tr><th>Started</th><th>Trigger</th><th>Outcome</th><th class="num">Duration</th><th>Error</th></tr></thead><tbody>${checks.map(c=>`<tr><td class="m muted">${timeAttr(c.started_at)}${fmtTime(c.started_at)}</time></td><td>${kindBadge(c.trigger)}</td><td>${badge(c.outcome,c.outcome==='success'?'ok':c.outcome==='error'?'bad':'mute')}</td><td class="num">${c.duration_seconds}s</td><td class="muted" style="white-space:normal;max-width:320px;font-size:12px">${c.error?esc(c.error):'—'}</td></tr>`).join('')}</tbody></table>`)}
    </div><div class="grid" style="align-content:start">
      ${card('Repository',null,`<div class="kv" style="margin:0"><span>Provider id</span><div class="m">${r.provider_repo_id}</div><span>Discovered</span><div>${timeAttr(r.discovered_at)}${fmtTime(r.discovered_at,{hour:undefined,minute:undefined})}</time></div><span>Park state</span><div>${r.park_reason?badge(r.park_reason,'warn')+` <span class="muted">${rel(r.parked_at)}</span>`:'<span class="muted">—</span>'}</div><span>Last outcome</span><div>${badge(r.last_check_outcome,r.last_check_outcome==='success'?'ok':'bad')}</div><span>Policy version</span><div class="m">${esc(r.policy_version)}</div><span>API budget</span><div>${meter(100*d.installation.rate_remaining/d.installation.rate_limit,'accent').replace(fmtP(100*d.installation.rate_remaining/d.installation.rate_limit),fmtN(d.installation.rate_remaining)+' left')}</div></div>`)}
      ${card('Timeline','Merged <code>finding_events</code>, <code>repository_events</code> and checks.',timeline(id,null))}
    </div></div>`;
};

V.history=()=>{const {q}=route();const rule=q.rule||'';const range=q.range||'90d';const from=daysAgo(rangeDays[range]);const rules=api.rules().items;const r=rules.find(x=>x.name===rule);
  const tabs=`<select class="btn" data-act="rule-pick">${['',...rules.map(x=>x.name)].map(n=>`<option value="${n}" ${rule===n?'selected':''}>${n||'All rules'}</option>`).join('')}</select>`;
  return pageHeader('History','Compliance series per org from <code>/compliance/history</code>; one small chart per org so every series keeps its own axis.',{range:true,actions:tabs})
    +`<div class="grid cols-3b">${api.orgs(q.org||'').items.map(o=>{const ser=complianceSeries(api.history({org:o.org,kind:r&&r.kind,rule,from}).items);return card(esc(o.org),rule?`rule ${esc(rule)}`:'all rules',areaChart(ser.map(p=>({t:p.t,v:p.percent})),{w:420,h:170,xticks:4,label:'compliance %',aria:`${o.org} compliance`}),{right:tableBtn('c-h-'+o.org),id:'c-h-'+o.org})}).join('')}</div>`;
};

V.policy=()=>{const p=api.policy();return pageHeader('Policy','The active policy version and its rules, read-only. Changes go through git.',{scope:false})
  +`<div class="grid cols-4">${kpi('Version',`<span class="m" style="font-size:16px">${esc(p.version)}</span>`)}${kpi('First seen',fmtTime(p.first_seen_at,{hour:undefined,minute:undefined}),rel(p.first_seen_at))}${kpi('Rollout',badge(p.rollout_state,p.rollout_state==='complete'?'ok':'info'),p.rollout_completed_at?'completed '+rel(p.rollout_completed_at):'in progress')}${kpi('Rules',p.rules.length,[...new Set(p.rules.map(r=>r.kind))].join(' · '))}</div>`
  +`<div class="mt">${card('Rules',null,`<table class="tbl"><thead><tr><th>Rule</th><th>Kind</th><th>Check</th><th>Description</th><th>Scope</th><th>Ignore</th></tr></thead><tbody>${p.rules.map(r=>`<tr class="link" data-go="rules/${r.kind}/${r.name}"><td class="m">${esc(r.name)}</td><td>${kindBadge(r.kind)}</td><td class="m muted">${esc(r.check_mode)}</td><td style="white-space:normal">${esc(r.description)}</td><td class="m muted">${esc(r.scope.join(', '))}</td><td class="m muted">${r.ignore.length?esc(r.ignore.join(', ')):'—'}</td></tr>`).join('')}</tbody></table>`)}</div>`};

V.status=()=>{const s=api.status();const head={operational:'All systems operational',degraded:'Degraded performance',down:'Service disruption',unknown:'Status not yet available'}[s.state]||s.state;const tone=TONE.component[s.state]||'mute';
  return `<div class="status-page">
    <div class="hd"><div class="brand" style="font-size:15px">${ICON.shield}<span>Repo Guardian status</span></div><span class="muted" style="font-size:12px">updated ${rel(s.updated_at)} · refreshes every 30s</span></div>
    <div class="card banner" style="border-color:color-mix(in srgb,var(--${tone}) 50%,var(--line))"><span class="dot" style="background:var(--${tone})"></span><div style="flex:1"><b>${head}</b><span>Public, aggregate-only. No org, repository or rule names appear on this page.</span></div>${stateBadge(s.state)}</div>
    <div class="grid mt" style="grid-template-columns:3fr 2fr">
      ${card('Components',null,`<div class="comp">${s.components.map(c=>`<div class="row"><i style="background:var(--${TONE.component[c.state]||'mute'})"></i><span class="n">${esc(c.name)}</span><span class="d">${esc(c.detail||'')}</span>${stateBadge(c.state)}</div>`).join('')}</div>`)}
      ${card('Fleet compliance','Measured across all tracked repositories.',`<div class="hero">${s.compliance.measured?fmtP(s.compliance.percent):'unmeasured'}</div><div class="meter" style="--m:var(--ok);--w:${s.compliance.percent||0}%;height:10px;margin-top:12px"><i></i></div><div class="muted" style="font-size:12px;margin-top:8px">measured: ${s.compliance.measured} · compliant ÷ (compliant + non_compliant)</div>`)}
    </div>
    ${deferred(['30-day sparkline and operations strip (Status.compliance.history, Status.operations, OQ10)'])}
    <div class="ft">GET /api/v1/status · served from an in-process cache, never from Prometheus · <a href="#/">sign in</a></div>
  </div>`};

const notFound=()=>`<div class="card" style="padding:40px;text-align:center" role="alert"><b>Not found</b><div class="muted">That page or object is outside your scope or does not exist.</div></div>`;

/* ------------------------------------------------------------------ */
/* render + interactions                                               */
/* ------------------------------------------------------------------ */
const app=document.getElementById('app');
function render(){const {parts,q}=route();let html,crumb;
  if(parts[0]==='status'){app.innerHTML=V.status();return}
  if(!parts[0]){html=V.fleet();crumb=[{l:'Repo Guardian',p:''},'Fleet']}
  else if(parts[0]==='rules'&&parts[1]){html=V.rule(parts[1],parts[2]);crumb=[{l:'Repo Guardian',p:''},{l:'Rules',p:'rules'},parts[2]]}
  else if(parts[0]==='rules'){html=V.rules();crumb=[{l:'Repo Guardian',p:''},'Rules']}
  else if(parts[0]==='orgs'&&parts[1]){html=V.org(parts[1]);crumb=[{l:'Repo Guardian',p:''},{l:'Orgs',p:'orgs'},parts[1]]}
  else if(parts[0]==='orgs'){html=V.orgs();crumb=[{l:'Repo Guardian',p:''},'Orgs']}
  else if(parts[0]==='findings'){html=V.findings();const o=q.open?q.open.split('/'):null;const r=o&&REPOS.find(x=>String(x.id)===o[0]);crumb=r?[{l:'Repo Guardian',p:''},{l:'Findings',p:'findings'},r.org+'/'+r.name]:[{l:'Repo Guardian',p:''},'Findings']}
  else if(parts[0]==='repos'&&parts[1]){html=V.repo(parts[1]);const r=REPOS.find(x=>String(x.id)===parts[1]);crumb=[{l:'Repo Guardian',p:''},'Repository',r?r.org+'/'+r.name:parts[1]]}
  else if(parts[0]==='history'){html=V.history();crumb=[{l:'Repo Guardian',p:''},'History']}
  else if(parts[0]==='policy'){html=V.policy();crumb=[{l:'Repo Guardian',p:''},'Policy']}
  else{html=notFound();crumb=[{l:'Repo Guardian',p:''},'Not found']}
  app.innerHTML=shell(crumb,html);wireCharts(app);closePop();
}
function toast(msg){const t=document.createElement('div');t.className='pop';t.style.cssText='left:50%;bottom:24px;transform:translateX(-50%);padding:8px 12px';t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),1800)}
function closePop(){document.querySelectorAll('.scrim,.pop.live,.pal').forEach(e=>e.remove());state.pop=null}
function openPop(anchor,kind){closePop();const scrim=document.createElement('div');scrim.className='scrim';scrim.style.background='transparent';scrim.addEventListener('click',closePop);document.body.appendChild(scrim);
  const pop=document.createElement('div');pop.className='pop live';const {q}=route();
  if(kind==='org'){const n=api.orgs().items;pop.innerHTML=`<div class="hd">Scope</div><button class="it ${!q.org?'cur':''}" data-org="">All orgs <small>${n.length}</small></button>${n.map(o=>`<button class="it ${q.org===o.org?'cur':''}" data-org="${esc(o.org)}">${esc(o.org)} <small>${fmtN(o.tracked)}</small></button>`).join('')}`;pop.addEventListener('click',e=>{const b=e.target.closest('[data-org]');if(!b)return;const {parts,q}=route();const nq=Object.assign({},q,{org:b.dataset.org});if(parts[0]==='orgs'&&parts[1])go('orgs',nq);else go(parts.join('/'),nq)})}
  else if(kind==='user'){const me=api.me();pop.innerHTML=`<div class="it" style="flex-direction:column;align-items:flex-start;gap:2px"><span>${esc(me.name)}</span><small>${esc(me.subject)}</small></div><hr><a class="it" href="${api.uiConfig().docs_url}" target="_blank" rel="noopener noreferrer">Documentation</a><form method="post" action="/auth/logout"><button class="it" type="button" data-act="toast">Sign out</button></form>`}
  else if(kind.startsWith('filter:')){const key=kind.slice(7);if(!key){pop.innerHTML=`<div class="hd">Add filter</div>${FILTERS.map(([k])=>`<button class="it" data-filter="${k}">${k}</button>`).join('')}`;pop.addEventListener('click',e=>{const b=e.target.closest('[data-filter]');if(b)openPop(anchor,'filter:'+b.dataset.filter)})}
    else{const [,vals]=FILTERS.find(([k])=>k===key);pop.innerHTML=`<div class="hd">${esc(key)}</div><button class="it" data-val="">any</button>${vals.map(v=>`<button class="it ${q[key]===v?'cur':''}" data-val="${esc(v)}">${esc(v)}</button>`).join('')}`;pop.addEventListener('click',e=>{const b=e.target.closest('[data-val]');if(!b)return;const nq=Object.assign({},route().q);if(b.dataset.val)nq[key]=b.dataset.val;else{delete nq[key];if(key==='status')nq.status=''}delete nq.open;go('findings',nq)})}}
  document.body.appendChild(pop);const r=anchor.getBoundingClientRect();pop.style.top=(r.bottom+6)+'px';pop.style.left=Math.min(window.innerWidth-pop.offsetWidth-8,r.left)+'px';state.pop=kind;
}
function openPalette(){closePop();const scrim=document.createElement('div');scrim.className='scrim';scrim.addEventListener('click',closePop);document.body.appendChild(scrim);
  const pal=document.createElement('div');pal.className='pal';pal.setAttribute('role','dialog');pal.innerHTML=`<input placeholder="Search repositories, rules, orgs…" aria-label="Search"><div class="res"></div>`;document.body.appendChild(pal);const inp=pal.querySelector('input'),res=pal.querySelector('.res');let cur=0,items=[];
  const draw=()=>{const qv=inp.value.trim().toLowerCase();items=[];const {q}=route();
    const repos=api.repositories({q:qv,org:q.org}).items.slice(0,8).map(r=>({g:'Repositories',l:r.org+'/'+r.name,s:r.active?'active':'parked · '+r.park_reason,p:'repos/'+r.id}));
    const rules=qv?api.rules().items.filter(r=>r.name.includes(qv)).map(r=>({g:'Rules',l:r.name,s:r.kind,p:`rules/${r.kind}/${r.name}`})):[];
    const orgs=qv?api.orgs().items.filter(o=>o.org.includes(qv)).map(o=>({g:'Orgs',l:o.org,s:fmtN(o.tracked)+' tracked',p:'orgs/'+o.org})):[];
    items=[...repos,...rules,...orgs];cur=0;let g='';res.innerHTML=items.length?items.map((it,i)=>`${it.g!==g?`<div class="hd">${(g=it.g)}</div>`:''}<button class="it ${i===cur?'cur':''}" data-i="${i}"><span>${esc(it.l)}</span><small>${esc(it.s)}</small></button>`).join(''):`<div class="empty">No matches.</div>`};
  inp.addEventListener('input',draw);inp.addEventListener('keydown',e=>{if(e.key==='ArrowDown'){cur=Math.min(items.length-1,cur+1)}else if(e.key==='ArrowUp'){cur=Math.max(0,cur-1)}else if(e.key==='Enter'){if(items[cur]){go(items[cur].p);closePop()}return}else if(e.key==='Escape'){closePop();return}else return;res.querySelectorAll('.it').forEach((b,i)=>b.classList.toggle('cur',i===cur));e.preventDefault()});
  res.addEventListener('click',e=>{const b=e.target.closest('[data-i]');if(b){go(items[+b.dataset.i].p);closePop()}});draw();inp.focus();
}
document.addEventListener('click',e=>{
  const row=e.target.closest('[data-go]');if(row&&!e.target.closest('a,button')){const [p,qs]=row.dataset.go.split('?');go(p,Object.fromEntries(new URLSearchParams(qs||'')));return}
  const b=e.target.closest('[data-act]');if(!b)return;const act=b.dataset.act;const {parts,q}=route();
  if(act==='range')go(parts.join('/'),Object.assign({},q,{range:b.dataset.range}));
  else if(act==='series')go(parts.join('/'),Object.assign({},q,{series:b.dataset.series}));
  else if(act==='kind')go('rules',Object.assign({},q,{kind:b.dataset.kind}));
  else if(act==='tab')go('orgs',Object.assign({},q,{tab:b.dataset.tab}));
  else if(act==='parked')go('orgs',Object.assign({},q,{parked:b.dataset.parked}));
  else if(act==='gg'){state.gg[b.dataset.org]=state.gg[b.dataset.org]===false;render()}
  else if(act==='ggall'){const collapse=!Object.values(state.gg).some(v=>v===false);ORGS.forEach(o=>state.gg[o.org]=!collapse);render()}
  else if(act==='open')go('findings',Object.assign({},q,{open:b.dataset.open}));
  else if(act==='table'){const c=document.getElementById(b.dataset.target);c.classList.toggle('table-view');b.setAttribute('aria-pressed',c.classList.contains('table-view'))}
  else if(act==='pop')openPop(b,b.dataset.pop);
  else if(act==='palette')openPalette();
  else if(act==='tz'){localStorage.setItem('rg.tz',tz()==='utc'?'local':'utc');render()}
  else if(act==='toast')toast('Mockup: this action is not wired.');
});
document.addEventListener('change',e=>{const s=e.target.closest('[data-act="rule-pick"]');if(s){const {q}=route();go('history',Object.assign({},q,{rule:s.value}))}});
document.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openPalette()}else if(e.key==='Escape'){if(state.pop||document.querySelector('.pal'))closePop();else if(route().q.open)go('findings',Object.assign({},route().q,{open:''}))}else if(e.key==='Enter'&&e.target.matches('tr[data-act="open"]'))e.target.click()});
render();
})();
</script>
</body>
