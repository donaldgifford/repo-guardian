suite: deployment-templating
templates:
  - templates/deployment.yaml
set:
  config:
    appId: "12345"
  secrets:
    webhookSecret: "test-secret"
    privateKey: "test-key"
tests:
  - it: emits templating.vars entries onto the container env list
    set:
      templating:
        vars:
          JIRA_PROJECT: "PLAT"
          OWNING_TEAM: "platform"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: JIRA_PROJECT
            value: "PLAT"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: OWNING_TEAM
            value: "platform"

  - it: rejects templating.vars keys that collide with chart-managed env vars
    set:
      templating:
        vars:
          GITHUB_APP_ID: "anything"
    asserts:
      - failedTemplate:
          errorMessage: "templating.vars keys collide with chart-managed env vars: GITHUB_APP_ID"

  - it: emits STRICT_TEMPLATES=true when templating.strict is enabled
    set:
      templating:
        strict: true
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: STRICT_TEMPLATES
            value: "true"

  - it: omits STRICT_TEMPLATES env when templating.strict is unset
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: STRICT_TEMPLATES
            value: "true"

  - it: mounts the chart-rendered templates ConfigMap by default
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: templates
            configMap:
              name: RELEASE-NAME-repo-guardian-templates

  - it: mounts templates.existingConfigMap when set
    set:
      templates:
        existingConfigMap: my-shared-templates
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: templates
            configMap:
              name: my-shared-templates

  - it: emits ORPHAN_CLEANUP=true by default (INV-0014)
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: ORPHAN_CLEANUP
            value: "true"

  # The false case is asserted explicitly: a bool rendered through sprig
  # `default` collapses false to the default, and this kill switch is
  # worthless if setting it to false silently renders "true".
  - it: respects policy.orphanCleanup=false override (INV-0014 kill switch)
    set:
      policy:
        orphanCleanup: false
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: ORPHAN_CLEANUP
            value: "false"

  - it: emits AUTO_CLOSE_PR=true by default (IMPL-0013 Phase 5)
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: AUTO_CLOSE_PR
            value: "true"

  - it: respects policy.autoClosePR=false override
    set:
      policy:
        autoClosePR: false
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: AUTO_CLOSE_PR
            value: "false"

  - it: emits IMPL-0015 Phase 1 discovery env vars with defaults
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DISCOVERY_ENABLED
            value: "true"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DISCOVERY_INTERVAL
            value: "1h"

  # IMPL-0023 task 2.5. The default is asserted as well as the
  # override: the binary defaults POSTURE_EXPORT_INTERVAL on its own,
  # so a chart that stopped emitting the var would keep working and
  # the drift would only surface when an operator set the value and
  # nothing happened.
  - it: emits the posture export interval with its default
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: POSTURE_EXPORT_INTERVAL
            value: "60s"

  - it: respects posture.exportInterval override
    set:
      posture:
        exportInterval: 5m
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: POSTURE_EXPORT_INTERVAL
            value: "5m"

  # IMPL-0023 task 7.3. Same reasoning as the export interval above,
  # with one addition: the compliance-history rows are permanent, so an
  # operator who sets this expecting a slower cadence and silently gets
  # the 24h default is accruing rows they did not ask for.
  - it: emits the compliance snapshot interval with its default
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: COMPLIANCE_SNAPSHOT_INTERVAL
            value: "24h"

  - it: respects posture.snapshotInterval override
    set:
      posture:
        snapshotInterval: 168h
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: COMPLIANCE_SNAPSHOT_INTERVAL
            value: "168h"

  # IMPL-0022 Phase 7: the attempt cap. Schema enforces >= 1, so the
  # binary's own MAX_JOB_ATTEMPTS < 1 startup error is a second line
  # of defence for operators bypassing the chart.
  - it: renders MAX_JOB_ATTEMPTS from config.maxJobAttempts
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: MAX_JOB_ATTEMPTS
            value: "10"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: MAX_JOB_ATTEMPTS
          any: true

  - it: honours a maxJobAttempts override
    set:
      config:
        maxJobAttempts: 3
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: MAX_JOB_ATTEMPTS
            value: "3"

  # IMPL-0022 Phase 6: the BudgetTracker and the sweep reserve gate
  # are gone — one throttle mechanism (delayed requeue) replaced
  # three. These env vars must not come back with the values removed.
  - it: does not render the removed reserve knobs
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: RATE_LIMIT_RESERVE
          any: true
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: DISCOVERY_RESERVE_FRACTION
          any: true
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: DISCOVERY_ESTIMATED_COST_PER_REPO
          any: true

  - it: respects discovery.enabled=false override
    set:
      discovery:
        enabled: false
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DISCOVERY_ENABLED
            value: "false"
