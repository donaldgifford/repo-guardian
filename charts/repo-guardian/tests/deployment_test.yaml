suite: deployment
templates:
  - templates/deployment.yaml
set:
  # One Deployment (topology: all) keeps these single-document; the
  # split shape is covered by topology_test.yaml.
  topology: all
  temporal:
    address: temporal:7233
  policy:
    files:
      enterprise.hcl: "enterprise {}"

tests:
  - it: should set replica count
    set:
      replicaCount: 3
    asserts:
      - equal:
          path: spec.replicas
          value: 3

  - it: should default revisionHistoryLimit to 3
    asserts:
      - equal:
          path: spec.revisionHistoryLimit
          value: 3

  - it: should override revisionHistoryLimit from values
    set:
      revisionHistoryLimit: 10
    asserts:
      - equal:
          path: spec.revisionHistoryLimit
          value: 10

  - it: should use default image tag from appVersion
    # Pinned here, not read from Chart.yaml, so a release bump never
    # breaks the test.
    chart:
      appVersion: 9.9.9-test
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: ghcr.io/donaldgifford/repo-guardian:9.9.9-test

  - it: should use custom image tag when set
    set:
      image:
        tag: "v1.0.0"
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: "ghcr.io/donaldgifford/repo-guardian:v1.0.0"

  - it: should set environment variables from config
    set:
      github:
        eval: {appId: "11", existingSecret: eval-app}
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LOG_LEVEL
            value: "info"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: EVAL_INTERVAL
            value: "24h"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: GUARDIAN_CONFIG
            value: /etc/repo-guardian/policy

  # IMPL-0029 7.9: the rule engine's and the single-App worker's env
  # never render.
  - it: renders no removed env var
    set:
      github:
        eval: {appId: "11", existingSecret: eval-app}
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: DRY_RUN
          any: true
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: CHECK_INTERVAL
          any: true
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: GITHUB_APP_ID
          any: true
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: TEMPLATE_DIR
          any: true
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: WORKER_ACTIVITY_CONCURRENCY
          any: true
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: PR_STALE_AFTER
          any: true

  - it: should run exactly one container (ingress is operator-owned, IMPL-0024)
    asserts:
      - lengthEqual:
          path: spec.template.spec.containers
          count: 1

  - it: should set liveness and readiness probes
    asserts:
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.httpGet.path
          value: /healthz
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet.path
          value: /readyz

  - it: should set security context
    asserts:
      - equal:
          path: spec.template.spec.containers[0].securityContext.runAsNonRoot
          value: true
      - equal:
          path: spec.template.spec.containers[0].securityContext.runAsUser
          value: 65534

  - it: should set resource limits
    asserts:
      - equal:
          path: spec.template.spec.containers[0].resources.requests.cpu
          value: 100m
      - equal:
          path: spec.template.spec.containers[0].resources.limits.memory
          value: 256Mi

  - it: should support extraEnv
    set:
      extraEnv:
        - name: CUSTOM_VAR
          value: custom-value
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: CUSTOM_VAR
            value: custom-value

  - it: should support extraVolumes and extraVolumeMounts
    set:
      extraVolumes:
        - name: extra-vol
          emptyDir: {}
      extraVolumeMounts:
        - name: extra-vol
          mountPath: /extra
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: extra-vol
            emptyDir: {}
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: extra-vol
            mountPath: /extra

  - it: should support nodeSelector
    set:
      nodeSelector:
        kubernetes.io/arch: amd64
    asserts:
      - equal:
          path: spec.template.spec.nodeSelector
          value:
            kubernetes.io/arch: amd64
