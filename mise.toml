[tools]

# Go
go = "1.25.4"
golines = "latest"
"go:github.com/spf13/cobra-cli" = "latest"
"go:golang.org/x/tools/cmd/goimports" = "latest"
"go:github.com/vektra/mockery/v2" = "latest"
"go:golang.org/x/tools/cmd/godoc" = "latest"
"go:github.com/goreleaser/chglog/cmd/chglog" = "latest"


# Repo utilities
# Formatters and linters
markdownlint-cli2 = "0.18.1"
yamlfmt = "0.20.0"
yamllint = "1.37.1"
prettier = "3.7.4"
"github:donaldgifford/makefmt" = "latest"
checkmake = "latest"

# tools
yq = "4.48.1"
jq = "latest"
"github:donaldgifford/docz" = "0.0.6"


# Release tools
golangci-lint = "2.8.0"

# Security
trivy = "latest"
syft = "latest"
"go:golang.org/x/vuln/cmd/govulncheck" = "latest"

# Compliance
"go:github.com/google/go-licenses" = "latest"

# helm
helm = "3.19.0"
helm-cr = "latest"
helm-ct = "latest"
helm-diff = "latest"
helm-docs = "latest"
