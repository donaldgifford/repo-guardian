---
# Mockery v3 configuration.
#
# Run: make mocks
#
# Covers the v2 store's Writer and Reader, github.Client, and the
# controls client surface (control.Reader, PRObserver, Writer; IMPL-0028
# task 2.8). The v1
# Store, Queue and Scheduler went with the v1 runtime (IMPL-0028
# Phase 1). The Client mock is not driven by expectations in any
# test — the checker/reconciler packages keep hand-written
# stateful fakes and embed MockClient only so that adding a method to
# github.Client stops breaking their test files at once. See CLAUDE.md
# "Mock generation policy" and IMPL-0021 Phase 7.
#
# Pinned to mockery v3 in mise.toml: v2's final release (2.53.6) is
# built against go1.25 and cannot load this module at all
# ("package requires newer Go version go1.26"), so `make mocks` was
# silently broken until the upgrade.
structname: "Mock{{ .InterfaceName }}"
filename: "{{ .InterfaceName | snakecase }}_mock.go"
pkgname: mocks
template: testify
template-data:
  unroll-variadic: true
packages:
  github.com/donaldgifford/repo-guardian/internal/store:
    config:
      dir: internal/store/mocks
    interfaces:
      Writer: {}
      Reader: {}
  github.com/donaldgifford/repo-guardian/internal/github:
    config:
      dir: internal/github/mocks
    interfaces:
      Client: {}
  github.com/donaldgifford/repo-guardian/internal/control:
    config:
      dir: internal/control/mocks
    interfaces:
      Reader: {}
      PRObserver: {}
      Writer: {}
