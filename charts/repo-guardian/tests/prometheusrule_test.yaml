suite: prometheusrule
templates:
  - templates/prometheusrule.yaml
tests:
  - it: should not create prometheusrule by default
    asserts:
      - hasDocuments:
          count: 0

  - it: should create prometheusrule when enabled
    set:
      prometheusRule:
        enabled: true
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: kind
          value: PrometheusRule

  # The chart mirrors the generated catalogue (IMPL-0029 6.6) by hand.
  # These lock the expressions, not just the names: an alert whose
  # selector drifts renders, passes promtool, and never fires.
  - it: renders the eight controls alerts in the first group
    set:
      prometheusRule:
        enabled: true
    asserts:
      - equal:
          path: spec.groups[0].name
          value: repo-guardian.rules
      - lengthEqual:
          path: spec.groups[0].rules
          count: 8

  # The `> 0` on the denominator leaves an idle evaluator with no result
  # rather than a division by zero.
  - it: should render EvaluationErrorRate over the error outcome
    set:
      prometheusRule:
        enabled: true
    asserts:
      - contains:
          path: spec.groups[0].rules
          content:
            alert: RepoGuardianEvaluationErrorRate
            expr: (sum(rate(repo_guardian_evaluations_total{outcome="error"}[15m])) / (sum(rate(repo_guardian_evaluations_total[15m])) > 0)) > 0.1
            for: 10m
            labels:
              severity: warning
          any: true

  # increase() cannot see a counter's first increment — the series does
  # not exist until it is incremented, so its first sample is 1 with
  # nothing earlier to subtract. A control that errors from the moment it
  # is assigned is exactly that case. Locking the string, because a
  # "tidy-up" that drops the second disjunct looks correct and never
  # fires.
  - it: should render ControlEvaluationErrors with the first-increment guard
    set:
      prometheusRule:
        enabled: true
    asserts:
      - contains:
          path: spec.groups[0].rules
          content:
            alert: RepoGuardianControlEvaluationErrors
            expr: |
              increase(repo_guardian_evaluation_errors_total[1h]) > 0
              or
              (repo_guardian_evaluation_errors_total
                unless repo_guardian_evaluation_errors_total offset 1h) > 0
            for: 15m
            labels:
              severity: warning
          any: true

  # The reason selector is load-bearing: results_discarded_total is
  # keyed by reason, and only a moved assignment epoch is this alert.
  - it: should render StaleEpochDiscards filtered to reason=stale_epoch
    set:
      prometheusRule:
        enabled: true
    asserts:
      - contains:
          path: spec.groups[0].rules
          content:
            alert: RepoGuardianStaleEpochDiscards
            expr: sum(increase(repo_guardian_results_discarded_total{reason="stale_epoch"}[2h])) > 100
            for: 1h
            labels:
              severity: warning
          any: true

  - it: should render EvaluationFreshness at twice the default interval
    set:
      prometheusRule:
        enabled: true
    asserts:
      - contains:
          path: spec.groups[0].rules
          content:
            alert: RepoGuardianEvaluationFreshness
            expr: histogram_quantile(0.95, sum by (le) (rate(repo_guardian_evaluation_freshness_seconds_bucket[6h]))) > 172800
            for: 1h
            labels:
              severity: warning
          any: true

  - it: should render StoreErrors over the error outcome
    set:
      prometheusRule:
        enabled: true
    asserts:
      - contains:
          path: spec.groups[0].rules
          content:
            alert: RepoGuardianStoreErrors
            expr: sum(rate(repo_guardian_store_query_seconds_count{outcome="error"}[10m])) / (sum(rate(repo_guardian_store_query_seconds_count[10m])) > 0) > 0.1
          any: true

  - it: tunes a controls alert's threshold, for and severity
    set:
      prometheusRule:
        enabled: true
        alerts:
          StaleEpochDiscards:
            threshold: 500
            for: 2h
            severity: critical
    asserts:
      - contains:
          path: spec.groups[0].rules
          content:
            alert: RepoGuardianStaleEpochDiscards
            expr: sum(increase(repo_guardian_results_discarded_total{reason="stale_epoch"}[2h])) > 500
            for: 2h
            labels:
              severity: critical
          any: true

  - it: disables a controls alert
    set:
      prometheusRule:
        enabled: true
        alerts:
          ControlEvaluationErrors:
            enabled: false
    asserts:
      - lengthEqual:
          path: spec.groups[0].rules
          count: 7
      - notContains:
          path: spec.groups[0].rules
          content:
            alert: RepoGuardianControlEvaluationErrors
          any: true

  # No alert over a series the switch-over deletes may survive.
  - it: carries no rc-era alert
    set:
      prometheusRule:
        enabled: true
    asserts:
      - notMatchRegex:
          path: spec.groups[0].rules[*].expr
          pattern: 'repos_checked_total|queue_|scheduler_is_leader|posture_export|open_prs_by_rule|custom_property_missing_schema'

  - it: renders the seven Temporal worker-health alerts in their own group
    set:
      prometheusRule:
        enabled: true
    asserts:
      - equal:
          path: spec.groups[1].name
          value: repo-guardian.temporal
      - lengthEqual:
          path: spec.groups[1].rules
          count: 7
      - equal:
          path: spec.groups[1].rules[3].alert
          value: RepoGuardianTemporalWorkflowTaskLatency
      - matchRegex:
          path: spec.groups[1].rules[3].expr
          pattern: 'temporal_workflow_task_schedule_to_start_latency_seconds_bucket\[15m\]\)\)\) > 0\.2$'
      - contains:
          path: spec.groups[1].rules
          content:
            alert: RepoGuardianTemporalNoWorkerPollers
            expr: max by (task_queue, poller_type) (temporal_num_pollers{poller_type=~"workflow_task|activity_task"}) == 0
            for: 10m
            labels:
              severity: critical
          any: true
      - contains:
          path: spec.groups[1].rules
          content:
            alert: RepoGuardianTemporalUnreachable
            expr: sum(rate(temporal_long_request_failure[10m])) / (sum(rate(temporal_long_request[10m])) > 0) > 0.5
          any: true

  - it: tunes and disables a Temporal alert like any other
    set:
      prometheusRule:
        enabled: true
        alerts:
          TemporalActivityBacklog:
            threshold: 120
          TemporalStickyCacheEvictions:
            enabled: false
    asserts:
      - lengthEqual:
          path: spec.groups[1].rules
          count: 6
      - matchRegex:
          path: spec.groups[1].rules[0].expr
          pattern: '> 120$'
      - notContains:
          path: spec.groups[1].rules
          content:
            alert: RepoGuardianTemporalStickyCacheEvictions
          any: true

  # IMPL-0030 OQ11: the remediation holds group. The first-increment
  # guard and the reason selectors are locked: pr_cap, stale_branch and
  # cooldown are routine and must never page.
  - it: should render the remediation holds group
    set:
      prometheusRule:
        enabled: true
    asserts:
      - equal:
          path: spec.groups[2].name
          value: repo-guardian.remediation
      - lengthEqual:
          path: spec.groups[2].rules
          count: 3
      - contains:
          path: spec.groups[2].rules
          content:
            alert: RepoGuardianRemediationBlocked
            expr: |
              increase(repo_guardian_remediation_blocked_total{reason=~"foreign_branch|permission"}[1h]) > 0
              or
              (repo_guardian_remediation_blocked_total{reason=~"foreign_branch|permission"}
                unless repo_guardian_remediation_blocked_total{reason=~"foreign_branch|permission"} offset 1h) > 0
            labels:
              severity: warning
          any: true
      - matchRegex:
          path: spec.groups[2].rules[0].expr
          pattern: 'reason=~"remediation_app_no_access\|remediation_app_suspended"'
      - equal:
          path: spec.groups[2].rules[2].expr
          value: max by (org) (repo_guardian_remediation_holds{reason="conflict",age_bucket=~"7-30d|30d[+]"}) > 0
      - notMatchRegex:
          path: spec.groups[2].rules[*].expr
          pattern: 'pr_cap|stale_branch|cooldown'
