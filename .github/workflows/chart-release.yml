---
name: Chart Release

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  chart-release:
    name: Release Chart to GitHub Pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Run chart-releaser
        uses: helm/chart-releaser-action@v1
        with:
          charts_dir: charts
          skip_existing: true
        env:
          CR_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  helm-oci-push:
    name: Push to OCI Registry
    needs: chart-release
    if: vars.HELM_OCI_REGISTRY != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - uses: azure/setup-helm@v4

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Login to ECR
        run: |
          aws ecr get-login-password | \
            helm registry login --username AWS --password-stdin "${{ vars.HELM_OCI_REGISTRY }}"

      - name: Package and push
        run: |
          helm package charts/repo-guardian
          helm push repo-guardian-*.tgz "oci://${{ vars.HELM_OCI_REGISTRY }}"
