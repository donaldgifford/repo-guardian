# Tailscale authentication secret.
#
# Create this secret before deploying:
#
#   kubectl create secret generic tailscale-auth \
#     --namespace=platform-tools \
#     --from-literal=authkey='tskey-auth-XXXXX'
#
# Generate an auth key at: https://login.tailscale.com/admin/settings/keys
# Use a reusable key so the pod can re-authenticate on restart.
# For long-lived deployments, use OAuth client credentials instead.
#
apiVersion: v1
kind: Secret
metadata:
  name: tailscale-auth
type: Opaque
stringData:
  authkey: "CHANGEME"
