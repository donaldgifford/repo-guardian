apiVersion: apps/v1
kind: Deployment
metadata:
  name: repo-guardian
spec:
  template:
    spec:
      containers:
        - name: repo-guardian
          env:
            - name: DRY_RUN
              value: "true"
            - name: LOG_LEVEL
              value: debug
            - name: SCHEDULE_INTERVAL
              value: 24h
        - name: tailscale
          image: ghcr.io/tailscale/tailscale:latest
          env:
            - name: TS_AUTHKEY
              valueFrom:
                secretKeyRef:
                  name: tailscale-auth
                  key: authkey
            - name: TS_HOSTNAME
              value: repo-guardian
            - name: TS_STATE_DIR
              value: /var/lib/tailscale
            - name: TS_USERSPACE
              value: "true"
            - name: TS_SERVE_CONFIG
              value: /config/serve-config.json
          volumeMounts:
            - name: tailscale-state
              mountPath: /var/lib/tailscale
            - name: tailscale-serve-config
              mountPath: /config
              readOnly: true
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
      volumes:
        - name: tailscale-state
          emptyDir: {}
        - name: tailscale-serve-config
          configMap:
            name: tailscale-serve-config
