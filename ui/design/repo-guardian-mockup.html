<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Repo Guardian · UI mockup (DESIGN-0036, DESIGN-0037)</title>
<!--
  Single-file mockup of the v2 UI on the controls line: DESIGN-0036's
  design language with the pages DESIGN-0037 specifies (findings over
  results, the org tree, the fleet panels, CSV export, the status
  changelog, the Remediations view and remediation-gated panels) and the
  INV-0023 fixes (rule
  tone, name crumbs, next due, remediable wording).

  This file is part of the design: it is updated in the design's pull
  request and accepted with it, and implementation builds to it.

  Every panel is fed from an in-page `api` object whose shapes mirror
  api/openapi.yaml (Summary, Posture, ControlSummary, ControlDetail,
  OrgSummary, OrgDetail, Repository, RepositoryControl, RuleResult,
  Evaluation, Event, HistoryPoint, Policies, Status) plus the additions
  DESIGN-0037 names (GET /results, Repository.compliance,
  Summary.parked_by_reason/finding_age/controls_failing,
  /compliance/history?aggregate=, and the IMPL-0030 remediation fields).
  The "remediation" button in the top bar is a mockup-only switch that
  previews the gated panels with a Remediation App installed.

  The real app bundles IBM Plex Sans and JetBrains Mono (the CSP forbids
  remote fonts). This mockup loads them from Google Fonts for convenience.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#17191d; --panel:#1f2227; --panel2:#262a30; --line:#31363d;
  --fg:#e8eaed; --muted:#9aa1ab; --accent:#5fa8f5;
  --ok:#3fb950; --warn:#d9a020; --bad:#f2554d; --info:#7aa7ff; --avatar:#3a4c6d;
  --r:3px;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 var(--sans);-webkit-font-smoothing:antialiased}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
code,.mono{font-family:var(--mono)}
.muted{color:var(--muted)}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* shell */
.shell{display:grid;grid-template-rows:40px 1fr;height:100vh}
.topbar{display:flex;align-items:center;gap:12px;padding:0 14px;background:var(--panel);border-bottom:1px solid var(--line);font-size:13px}
.brand{display:flex;align-items:center;gap:8px;font-weight:600;color:var(--fg)}
.brand svg{width:16px;height:16px;color:var(--accent)}
.brand small{font-weight:400;color:var(--muted)}
.topbar .sp{flex:1}
.tb-btn{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 8px;border:1px solid var(--line);border-radius:var(--r);color:var(--muted);font-size:12px}
.tb-btn:hover{background:var(--panel2);color:var(--fg)}
.tb-btn kbd{font:11px var(--mono);background:var(--panel2);padding:1px 4px;border-radius:2px}
.avatar{width:20px;height:20px;border-radius:var(--r);background:var(--avatar);color:#fff;font:600 10px/20px var(--sans);text-align:center}
.body{display:grid;grid-template-columns:220px 1fr;min-height:0}
.side{display:flex;flex-direction:column;background:var(--panel);border-right:1px solid var(--line);padding:10px 8px;font-size:13px;overflow:auto}
.side .g{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:12px 10px 4px}
.side a.nav{display:flex;align-items:center;gap:10px;padding:6px 10px;border-radius:var(--r);color:var(--muted);border-left:2px solid transparent}
.side a.nav svg{width:15px;height:15px;flex:none}
.side a.nav em{font:11px var(--mono);margin-left:auto;color:var(--muted)}
.side a.nav:hover{background:var(--panel2);color:var(--fg);text-decoration:none}
.side a.nav.cur{background:var(--panel2);color:var(--fg);border-left-color:var(--accent)}
.side .foot{margin-top:auto;padding:12px 10px 6px;font:11px var(--mono);color:var(--muted);border-top:1px solid var(--line)}
.side .foot a{color:var(--muted)}
.main{overflow:auto;padding:14px 24px 40px;min-width:0}

/* page anatomy */
.crumbs{font-size:12px;color:var(--muted);margin-bottom:8px}
.crumbs b{color:var(--fg);font-weight:500}
.crumbs span{margin:0 6px;opacity:.6}
.page-h{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:14px;flex-wrap:wrap}
.page-h h1{margin:0;font-size:20px;font-weight:600;display:flex;align-items:center;gap:10px}
.page-h p{margin:3px 0 0;color:var(--muted);font-size:13px}
.controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;font-size:12px}
.seg button{padding:5px 10px;color:var(--muted)}
.seg button:hover{color:var(--fg)}
.seg button.cur{background:var(--panel2);color:var(--fg)}
.btn{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border:1px solid var(--line);border-radius:var(--r);font-size:12px;color:var(--fg);background:var(--panel)}
.btn:hover{background:var(--panel2)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--fg);background:var(--panel2)}
.btn.sm{height:22px;padding:0 7px;font-size:11px}
.scope{min-width:150px;justify-content:space-between}

/* grid + cards */
.grid{display:grid;gap:12px}
.cols-2{grid-template-columns:1fr 1fr}
.cols-3{grid-template-columns:2fr 1fr}
.cols-3b{grid-template-columns:1fr 1fr 1fr}
.cols-4{grid-template-columns:repeat(4,1fr)}
.span-2{grid-column:span 2}
.mt{margin-top:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);min-width:0;position:relative}
.card-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:10px 14px 0}
.card-h b{display:block;font-size:13px;font-weight:600}
.card-h span.s{display:block;font-size:12px;color:var(--muted);margin-top:1px}
.card-h .right{flex:none;display:flex;gap:6px;align-items:center}
.card-b{padding:8px 14px 12px}
.strip{display:flex;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-top:10px}
.strip .cell{flex:1;padding:8px 14px;border-right:1px solid var(--line);min-width:0}
.strip .cell:last-child{border-right:0}
.strip .l{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.strip .v{font-size:18px;font-weight:600;margin-top:2px;white-space:nowrap}
.strip .v small{font-size:12px;font-weight:400;color:var(--muted)}
.strip .s{font-size:12px;color:var(--muted);margin-top:1px;line-height:1.35}
.card-b{overflow-x:auto}
@media (min-width:1600px){.layout.open .col-since,.layout.open .col-age{display:none}}
.tbl-wrap{overflow-x:auto;max-width:100%}
.layout.open .tbl td,.layout.open .tbl th{padding-left:8px;padding-right:8px}
.sb{display:grid;gap:9px;margin-top:4px}
.sb .r{display:grid;grid-template-columns:var(--lc,150px) 1fr 64px;gap:10px;align-items:center;font-size:12.5px}
.sb .r .lb{font-family:var(--mono);font-size:12.5px;text-align:right;overflow:hidden;text-overflow:ellipsis}
.sb .bar{display:flex;gap:2px;height:10px}
.sb .bar i{display:block;height:100%;min-width:0;transition:opacity .1s}
.sb .bar i:hover{opacity:.75}
.sb .r .tot{text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
.sb.single .r{grid-template-columns:1fr 64px}
.kpi{padding:10px 14px}
.kpi .l{font-size:12px;color:var(--muted)}
.kpi .v{font-size:22px;font-weight:600;line-height:1.2;margin-top:2px}
.kpi .s{font-size:12px;color:var(--muted);margin-top:2px}
.up{color:color-mix(in srgb,var(--ok) 75%,white)}.down{color:color-mix(in srgb,var(--bad) 75%,white)}
.pills{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 2px}
.pill{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:var(--r);padding:4px 9px;font-size:12px;color:var(--muted)}
.pill i{width:8px;height:8px;border-radius:2px;background:var(--line);display:inline-block}
.pill b{color:var(--fg);font-weight:500}
.pill[aria-pressed="true"]{background:var(--panel2);color:var(--fg);border-color:color-mix(in srgb,var(--accent) 50%,var(--line))}
.badge{display:inline-block;font:500 12px/1 var(--mono);padding:5px 7px;white-space:nowrap;vertical-align:middle}
.b-ok{background:color-mix(in srgb,var(--ok) 18%,transparent);color:color-mix(in srgb,var(--ok) 65%,white)}
.b-bad{background:color-mix(in srgb,var(--bad) 18%,transparent);color:color-mix(in srgb,var(--bad) 65%,white)}
.b-warn{background:color-mix(in srgb,var(--warn) 18%,transparent);color:color-mix(in srgb,var(--warn) 65%,white)}
.b-info{background:color-mix(in srgb,var(--info) 18%,transparent);color:color-mix(in srgb,var(--info) 65%,white)}
.b-mute{background:color-mix(in srgb,var(--muted) 18%,transparent);color:color-mix(in srgb,var(--muted) 65%,white)}
.b-outline{background:transparent;border:1px solid var(--line);color:var(--muted);padding:4px 6px}

/* tables */
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;font-weight:500;color:var(--muted);padding:7px 10px;border-bottom:1px solid var(--line);font-size:11.5px;white-space:nowrap}
.tbl td{padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;font-variant-numeric:tabular-nums;vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl .num{text-align:right}
.tbl td.m,.tbl .m{font-family:var(--mono);font-size:12.5px}
.tbl tr.link{cursor:pointer}
.tbl tr.link:hover td{background:var(--panel2)}
.tbl tr.sel td{background:color-mix(in srgb,var(--accent) 12%,transparent)}
.tbl .sub{display:block;font-size:11px;color:var(--muted);font-family:var(--sans)}
.tbl.dense td{padding:5px 8px}
.meter{height:5px;background:color-mix(in srgb,var(--m,var(--accent)) 20%,transparent);border-radius:2px;overflow:hidden;min-width:80px}
.meter i{display:block;height:100%;width:var(--w);background:var(--m,var(--accent));border-radius:2px}
.row-meter{display:flex;align-items:center;gap:10px}
.row-meter .meter{flex:1}
.row-meter b{font-weight:500;width:52px;text-align:right;font-variant-numeric:tabular-nums}
.trend{font-size:11px}

/* bar list */
.bl{display:grid;gap:8px;margin-top:4px}
.bl .r{display:grid;grid-template-columns:1fr auto;gap:4px 10px;font-size:12.5px;align-items:center}
.bl .r .t{display:flex;justify-content:space-between;align-items:baseline;grid-column:1/-1}
.bl .r .t em{font-style:normal;color:var(--muted);font-size:11px;margin-left:6px}
.bl .r .t b{font-weight:500;font-variant-numeric:tabular-nums}
.bl .bar{grid-column:1/-1;height:8px;background:transparent}
.bl .bar i{display:block;height:100%;width:var(--w);background:var(--accent);border-radius:0 4px 4px 0;min-width:2px}

/* chips + filters */
.filters{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 14px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:var(--r);padding:4px 8px;font:11.5px var(--mono);color:var(--muted)}
.chip b{color:var(--fg);font-weight:500}
.chip:hover{background:var(--panel2)}
.chip.add{border-style:dashed}
.filters .count{margin-left:auto;font-size:12px;color:var(--muted)}

/* drawer */
.layout{display:grid;grid-template-columns:1fr;gap:12px;align-items:start}
.layout.open{grid-template-columns:minmax(0,1fr) 470px}
.drawer{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;position:sticky;top:0;max-height:100vh;overflow-y:auto}
.drawer-scrim{display:none}
@media (max-width:1599px){.layout.open{grid-template-columns:minmax(0,1fr)}.drawer-scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:25}.drawer{position:fixed;top:0;right:0;bottom:0;width:470px;max-width:92vw;border-radius:0;border-width:0 0 0 1px;z-index:30;box-shadow:-12px 0 32px rgba(0,0,0,.45)}}
.drawer h3{margin:0;font-size:15px;font-weight:600;display:flex;justify-content:space-between;align-items:center;gap:8px}
.drawer .sub{font:12px var(--mono);color:var(--muted);margin:3px 0 14px}
.kv{display:grid;grid-template-columns:110px 1fr;gap:9px 10px;font-size:13px;align-items:center;margin-bottom:14px}
.kv span{color:var(--muted);font-size:12px}
.ev{font:12px/1.55 var(--mono);background:var(--bg);border:1px solid var(--line);padding:10px 12px;margin-bottom:14px;white-space:pre-wrap;word-break:break-word}
.ev .bad{color:color-mix(in srgb,var(--bad) 75%,white)}
.ev .k{color:var(--muted)}
.hist{border-left:2px solid var(--line);margin:4px 0 0 6px;padding-left:16px;display:grid;gap:2px}
.hist div{position:relative;padding:5px 0;font-size:12.5px}
.hist div::before{content:"";position:absolute;left:-23px;top:11px;width:8px;height:8px;background:var(--muted)}
.hist div.now::before{background:var(--accent)}
.hist .d{font:11.5px var(--mono);color:var(--muted);display:block}
.drawer .actions{display:flex;justify-content:space-between;align-items:center;margin-top:16px;padding-top:12px;border-top:1px solid var(--line);font-size:12px}

/* group grid */
.gg{width:100%;border-collapse:collapse;font-size:13px}
.gg th{text-align:left;font-weight:500;color:var(--muted);padding:7px 10px;border-bottom:1px solid var(--line);font-size:11.5px}
.gg td{padding:7px 10px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums;white-space:nowrap}
.gg .num{text-align:right}
.gg tr.grp td{font-weight:600;cursor:pointer}
.gg tr.grp:hover td{background:var(--panel2)}
.gg tr.grp td .meta{font-weight:400;color:var(--muted);font-size:12px;margin-left:8px}
.gg tr.child td:first-child{padding-left:38px;font-weight:400}
.gg .tog{display:inline-grid;place-items:center;width:18px;height:18px;border:1px solid var(--line);border-radius:var(--r);font:11px var(--mono);color:var(--muted);margin-right:8px}
.gg .bad-t{color:var(--bad)}
.gg tr.total td{border-top:2px solid var(--line);font-weight:600;color:var(--muted)}
.gg td .rk{font:11px var(--mono);color:var(--muted);margin-right:8px;border:1px solid var(--line);padding:1px 4px;border-radius:2px}

/* charts */
.chart-wrap{position:relative}
.chart{display:block;width:100%;height:auto}
.chart text{font:11px var(--mono);fill:var(--muted)}
.chart .grid line{stroke:var(--line);stroke-width:1}
.chart .ax{stroke:var(--line)}
.chart .ln{fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.chart .xh{stroke:var(--muted);stroke-width:1;opacity:0}
.chart .dot{stroke:var(--panel);stroke-width:2}
.chart .hit{fill:transparent}
.chart rect.bar{transition:opacity .1s}
.chart rect.bar:hover,.chart .seg:hover{opacity:.8}
.chart .lbl{fill:var(--fg)}
.tip{position:fixed;z-index:50;pointer-events:none;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:6px 9px;font-size:12px;box-shadow:0 8px 24px rgba(0,0,0,.4);display:none;min-width:120px}
.tip .t{font:11px var(--mono);color:var(--muted);margin-bottom:3px}
.tip .r{display:flex;justify-content:space-between;gap:14px}
.tip .r i{display:inline-block;width:10px;height:2px;vertical-align:middle;margin-right:6px}
.tip .r b{font-weight:600}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.tv{display:none}
.card.table-view .chart-wrap,.card.table-view .legend,.card.table-view .pills{display:none}
.card.table-view .tv{display:block}
.defer{margin-top:16px;font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:10px}
.defer code{font-size:11.5px}

/* popovers, palette */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.35)}
.pop{position:fixed;z-index:45;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:0 12px 36px rgba(0,0,0,.45);min-width:200px;padding:6px;font-size:13px}
.pop .it{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:6px 8px;border-radius:var(--r);color:var(--fg);width:100%;text-align:left}
.pop .it:hover,.pop .it.cur{background:var(--panel2)}
.pop .it small{color:var(--muted);font-family:var(--mono);font-size:11px}
.pop .hd{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:8px 8px 4px}
.pop hr{border:0;border-top:1px solid var(--line);margin:4px 0}
.pal{position:fixed;z-index:46;left:50%;top:14vh;transform:translateX(-50%);width:560px;max-width:92vw;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:0 24px 60px rgba(0,0,0,.5)}
.pal input{width:100%;background:transparent;border:0;border-bottom:1px solid var(--line);color:var(--fg);font:14px var(--sans);padding:12px 14px;outline:0}
.pal .res{max-height:50vh;overflow:auto;padding:6px}
.pal .empty{padding:14px;color:var(--muted);font-size:13px}

/* status page */
.status-page{max-width:760px;margin:40px auto;padding:0 16px}
.status-page .hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.banner{display:flex;align-items:center;gap:14px;padding:14px 16px}
.banner .dot{width:10px;height:10px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 0 color-mix(in srgb,var(--ok) 50%,transparent);animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--ok) 45%,transparent)}70%{box-shadow:0 0 0 8px transparent}100%{box-shadow:0 0 0 0 transparent}}
@media (prefers-reduced-motion:reduce){.banner .dot{animation:none}}
.banner b{display:block;font-size:15px}
.banner span{color:var(--muted);font-size:13px}
.comp{display:grid;gap:0}
.comp .row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px}
.comp .row:last-child{border-bottom:0}
.comp .row i{width:8px;height:8px;border-radius:50%;flex:none}
.comp .row .n{font-family:var(--mono);font-size:12.5px;width:118px;flex:none}
.comp .row .d{color:var(--muted);flex:1;font-size:12.5px}
.hero{font-size:44px;font-weight:600;line-height:1.1}
.status-page .ft{text-align:center;font:11px var(--mono);color:var(--muted);margin-top:18px}
</style>
<style>
/* DESIGN-0037 additions */
.pal .it{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:6px 8px;border-radius:var(--r);color:var(--fg);width:100%;text-align:left}
.pal .it:hover,.pal .it.cur{background:var(--panel2)}
.pal .it small{color:var(--muted);font-family:var(--mono);font-size:11px}
.pal .hd{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:8px 8px 4px}
.agebar{display:flex;gap:2px;height:14px;margin:6px 0 10px}
.agebar i{display:block;height:100%;min-width:2px}
.agebar i:hover{opacity:.8}
.age-legend{display:grid;grid-template-columns:repeat(3,1fr);gap:6px 12px;font-size:12px}
.age-legend>span{display:flex;justify-content:space-between;gap:8px;color:var(--muted)}
.age-legend>span b{color:var(--fg);font-weight:500;font-variant-numeric:tabular-nums}
.age-legend i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px}
.gated{display:grid;place-items:center;text-align:center;min-height:150px;border:1px dashed var(--line);border-radius:var(--r);color:var(--muted);font-size:12.5px;padding:16px}
.gated b{display:block;color:var(--fg);font-weight:500;font-size:13px;margin-bottom:4px}
.cl{display:grid;gap:0}
.cl .e{padding:10px 0;border-bottom:1px solid var(--line)}
.cl .e:last-child{border-bottom:0}

<script>
(function(){
'use strict';

/* ------------------------------------------------------------------ */
/* tokens, formatting                                                  */
/* ------------------------------------------------------------------ */
const C={accent:'#5fa8f5',info:'#7aa7ff',ok:'#3fb950',warn:'#d9a020',bad:'#f2554d',muted:'#9aa1ab',panel:'#1f2227',bg:'#17191d',line:'#31363d'};

function fmtTime(d,opts){d=new Date(d);const utc=tz()==='utc';const p=n=>String(n).padStart(2,'0');const Y=utc?d.getUTCFullYear():d.getFullYear(),M=utc?d.getUTCMonth():d.getMonth(),D=utc?d.getUTCDate():d.getDate(),h=utc?d.getUTCHours():d.getHours(),m=utc?d.getUTCMinutes():d.getMinutes();const dateOnly=opts&&opts.hour===undefined&&'hour' in opts;return `${Y}-${p(M+1)}-${p(D)}`+(dateOnly?'':` ${p(h)}:${p(m)}`)+(utc&&!dateOnly?' UTC':'')}

/* ------------------------------------------------------------------ */

  const pct=clamp(c.base+o.off+noise(2.2),30,99.6);

  const hist=[];
  for(let i=0;i<90;i++){const back=1-i/89;const pi=i===89?pct:clamp(pct-c.drift*Math.pow(back,1.15)+noise(.45),20,99.8);const cc=Math.round(measured*pi/100);

const CURATED=[

  R('acme-web','cms','main-ruleset','non_compliant',62,{ruleset_present:['fail',ev('branch_ruleset.present',{branch:'main',reason:'no_ruleset'})],requires_review:['not_applicable',ev('branch_ruleset.rule',{reason:'no_ruleset'})],required_checks:['not_applicable',ev('branch_ruleset.rule',{reason:'no_ruleset'})]}),

  R('acme-platform','argo-apps','codeowners','unknown',1,{present:['error',ev('framework',{reason:'read_error',error:'GET contents: 502 after 3 attempts'})],default_owner_team:['unknown',ev('framework',{reason:'missing_result'})]}),
  R('acme-data','feature-store','renovate-strict','non_compliant',14,{schedule_set:['fail',ev('dependency_updates.schedule',{path:'renovate.json',expected:'every weekend',found:'none'})]},{pr:{number:57,age:14}}),

const passEv=(c,rule)=>ev(c.type+'.'+rule,{result:'ok'});

const HOLD_TEXT={pr_cap:'the repository is at max_open_prs; waits for a slot',foreign_branch:'a repo-guardian/ branch exists that the bot did not create; rename or delete it to resume',stale_branch:'branch left from a closed PR; delete it to resume',conflict:'the PR branch conflicts with the default branch and could not be updated',permission:'the Remediation App lacks permission for this change'};

function eventsFor(repo){
  const out=[];let id=9000+repo.id*20;
  out.push({source:'repository',id:++id,occurred_at:repo.discovered_at,kind:'discovered',detail:{}});
  if(repo.name==='widgets')out.push({source:'repository',id:++id,occurred_at:daysAgo(96),kind:'renamed',detail:{from:'widget-service',to:'widgets'}});

/* evidence is text only (lib/evidence.ts): head by reason for framework evidence, else by
   evidence_kind; then the flat scalar fields as sorted key: value lines; nested values skipped */
function evidenceLines(e){e=e||{};const head=e.evidence_kind==='framework'?(e.reason||'framework'):(e.reason?e.evidence_kind+' · '+e.reason:e.evidence_kind);
  const lines=Object.keys(e).filter(k=>!['evidence_kind','evidence_version','reason'].includes(k)).sort().map(k=>{const v=e[k];if(Array.isArray(v))return `${k}: ${v.join(', ')}`;if(v!==null&&typeof v==='object')return null;return `${k}: ${v}`}).filter(Boolean);
  return {head,lines}}

const evidenceHeadline=e=>{const {head,lines}=evidenceLines(e);const f=lines.find(l=>/^(found|actual|missing|paths_checked|error):/.test(l));return f?`${head} · ${f}`:head};

const CH={};let chartSeq=0;

function areaChart(series,o){
  o=Object.assign({h:230,unit:'%',color:C.accent,label:'compliance %',id:'ch'+(++chartSeq),fill:true},o||{});
  const W=o.w||720,H=o.h,L=44,R=14,T=12,B=26;const vals=series.map(p=>p.v).filter(v=>v!=null);
  if(!vals.length)return '<div class="muted" style="padding:30px;text-align:center">no data</div>';
  let min=o.min!=null?o.min:nice(Math.min(...vals)-2,true),max=o.max!=null?o.max:nice(Math.max(...vals)+2);if(o.unit==='%'){max=Math.min(100,max);min=Math.max(0,min)}if(max===min)max=min+10;
  const n=series.length;const x=i=>L+(n===1?0:i*(W-L-R)/(n-1));const y=v=>T+(max-v)*(H-T-B)/(max-min);
  let d='',area='';series.forEach((p,i)=>{if(p.v==null)return;d+=(d?'L':'M')+x(i).toFixed(1)+' '+y(p.v).toFixed(1)+' '});
  if(d)area=d+'L'+x(n-1).toFixed(1)+' '+y(min)+' L'+x(0)+' '+y(min)+' Z';
  const ticks=[];const step=(max-min)/4;for(let g=0;g<=4;g++)ticks.push(+(min+g*step).toFixed(1));

  const xt=[];const want=Math.min(o.xticks||7,n);for(let k=0;k<want;k++){const i=Math.round(k*(n-1)/Math.max(1,want-1));xt.push(`<text x="${x(i)}" y="${H-7}" text-anchor="${i===0?'start':i===n-1?'end':'middle'}">${fmtDate(series[i].t)}</text>`)}

  const svg=`<div class="chart-wrap"><svg class="chart" viewBox="0 0 ${W} ${H}" data-chart="${o.id}" role="img" aria-label="${esc(o.aria||o.label)}"><g class="grid">${grid}</g>${xt.join('')}${o.fill?`<path d="${area}" fill="${o.color}" opacity=".10"/>`:''}<path class="ln" d="${d}" stroke="${o.color}"/><line class="xh" x1="0" x2="0" y1="${T}" y2="${H-B}"/><circle class="dot" cx="${x(n-1)}" cy="${last.v==null?-99:y(last.v)}" r="4.5" fill="${o.color}"/><text class="lbl" x="${x(n-1)-10}" y="${(last.v==null?0:y(last.v))-10}" text-anchor="end" font-weight="600">${last.v==null?'':(o.unit==='%'?last.v.toFixed(1)+'%':fmtN(last.v))}</text><circle class="dot hv" r="4.5" fill="${o.color}" style="opacity:0"/><rect class="hit" x="${L}" y="0" width="${W-L-R}" height="${H}"/></svg></div>`;
  const tv=`<div class="tv"><table class="tbl dense"><thead><tr><th>Snapshot</th><th class="num">${esc(o.label)}</th></tr></thead><tbody>${series.slice().reverse().slice(0,30).map(p=>`<tr><td class="m">${fmtDate(p.t)}</td><td class="num">${p.v==null?'—':(o.unit==='%'?p.v.toFixed(1)+'%':fmtN(p.v))}</td></tr>`).join('')}</tbody></table>${n>30?`<div class="muted" style="font-size:12px;padding:6px 8px">latest 30 of ${n} snapshots</div>`:''}</div>`;

function barChart(cats,vals,o){
  o=Object.assign({h:200,color:C.accent,id:'ch'+(++chartSeq),label:'count'},o||{});
  const W=360,H=o.h,L=34,R=10,T=18,B=26;const max=nice(Math.max(1,...vals)*1.1);const n=cats.length;const slot=(W-L-R)/n;const bw=Math.min(24,slot*.6);
  const y=v=>T+(max-v)*(H-T-B)/max;const ticks=[0,.25,.5,.75,1].map(f=>Math.round(max*f));
  const grid=ticks.map(g=>`<line x1="${L}" x2="${W-R}" y1="${y(g)}" y2="${y(g)}"/><text x="${L-8}" y="${y(g)+4}" text-anchor="end">${fmtN(g)}</text>`).join('');
  const bars=cats.map((c,i)=>{const cx=L+slot*i+slot/2;const top=y(vals[i]);const h=Math.max(0,y(0)-top);const r=Math.min(4,h);
    const p=`M${cx-bw/2} ${y(0)} V${top+r} a${r} ${r} 0 0 1 ${r} -${r} H${cx+bw/2-r} a${r} ${r} 0 0 1 ${r} ${r} V${y(0)} Z`;

  CH[o.id]={type:'bar',cats,vals,label:o.label,color:o.color};
  return `<div class="chart-wrap"><svg class="chart" viewBox="0 0 ${W} ${H}" data-chart="${o.id}" role="img" aria-label="${esc(o.aria||o.label)}"><g class="grid">${grid}</g>${bars}</svg></div><div class="tv"><table class="tbl dense"><thead><tr><th>Bucket</th><th class="num">${esc(o.label)}</th></tr></thead><tbody>${cats.map((c,i)=>`<tr><td class="m">${esc(c)}</td><td class="num">${fmtN(vals[i])}</td></tr>`).join('')}</tbody></table></div>`;

/* two bars per day: opened vs closed (PR throughput) */
function pairBars(days,a,b,o){
  o=Object.assign({h:200,id:'ch'+(++chartSeq)},o||{});const W=720,H=o.h,L=34,R=10,T=14,B=26;const max=nice(Math.max(1,...a,...b)*1.1);const n=days.length;const slot=(W-L-R)/n;const bw=Math.min(10,slot*.35);
  const y=v=>T+(max-v)*(H-T-B)/max;const ticks=[0,.5,1].map(f=>Math.round(max*f));
  const grid=ticks.map(g=>`<line x1="${L}" x2="${W-R}" y1="${y(g)}" y2="${y(g)}"/><text x="${L-8}" y="${y(g)+4}" text-anchor="end">${fmtN(g)}</text>`).join('');
  const bars=days.map((d,i)=>{const cx=L+slot*i+slot/2;return `<g class="bar" data-i="${i}"><rect x="${cx-bw-1}" y="${y(a[i])}" width="${bw}" height="${y(0)-y(a[i])}" fill="${C.accent}"/><rect x="${cx+1}" y="${y(b[i])}" width="${bw}" height="${y(0)-y(b[i])}" fill="${C.ok}"/>${i%2===0?`<text x="${cx}" y="${H-7}" text-anchor="middle">${fmtDate(d)}</text>`:''}<rect class="hit" x="${cx-slot/2}" y="0" width="${slot}" height="${H}"/></g>`}).join('');
  CH[o.id]={type:'pair',days,a,b};
  return `<div class="chart-wrap"><svg class="chart" viewBox="0 0 ${W} ${H}" data-chart="${o.id}" role="img" aria-label="pull requests opened and closed per day"><g class="grid">${grid}</g>${bars}</svg></div><div class="legend"><span><i style="background:${C.accent}"></i>opened</span><span><i style="background:${C.ok}"></i>closed</span></div>`;
}
function stackedBars(rows,segs,o){
  o=Object.assign({id:'ch'+(++chartSeq)},o||{});const single=rows.length===1&&!o.labels;
  const max=Math.max(1,...rows.map(r=>segs.reduce((a,s)=>a+(r.counts[s.key]||0),0)));
  CH[o.id]={type:'stack',rows,segs};
  const body=rows.map((r,ri)=>{const tot=segs.reduce((a,s)=>a+(r.counts[s.key]||0),0);
    const parts=segs.map((s,si)=>{const v=r.counts[s.key]||0;if(!v)return '';return `<i data-r="${ri}" data-s="${si}" style="flex:${v} ${v} 0;background:${s.color}" aria-label="${esc(s.label)} ${fmtN(v)}"></i>`}).join('');
    return `<div class="r">${single?'':`<span class="lb">${esc(r.label)}</span>`}<div class="bar" style="width:${100*tot/max}%">${parts}</div><span class="tot">${fmtN(tot)}</span></div>`}).join('');
  const used=segs.filter(s=>rows.some(r=>r.counts[s.key]));
  const legend=`<div class="legend">${used.map(s=>`<span><i style="background:${s.color}"></i>${esc(s.label)}</span>`).join('')}</div>`;
  const tv=`<div class="tv"><table class="tbl dense"><thead><tr>${single?'':'<th>Control</th>'}${used.map(s=>`<th class="num">${esc(s.label)}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${single?'':`<td class="m">${esc(r.label)}</td>`}${used.map(s=>`<td class="num">${fmtN(r.counts[s.key]||0)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
  return `<div class="chart-wrap"><div class="sb ${single?'single':''}" data-chart="${o.id}" role="img" aria-label="${esc(o.aria||'assignments by bucket')}">${body}</div></div>${legend}${tv}`;
}
const bucketSegs=BUCKETS.map(b=>({key:b,label:BUCKET_LABEL[b],color:BUCKET_COLOR[b]}));
function sparkline(vals,o){o=Object.assign({w:84,h:22,color:C.accent},o||{});const v=vals.filter(x=>x!=null);if(v.length<2)return '<span class="muted">—</span>';const min=Math.min(...v),max=Math.max(...v);const n=vals.length;const x=i=>2+i*(o.w-4)/(n-1);const y=val=>max===min?o.h/2:2+(max-val)*(o.h-4)/(max-min);let d='';vals.forEach((val,i)=>{if(val==null)return;d+=(d?'L':'M')+x(i).toFixed(1)+' '+y(val).toFixed(1)+' '});const last=vals[n-1];return `<svg width="${o.w}" height="${o.h}" viewBox="0 0 ${o.w} ${o.h}" aria-hidden="true"><path d="${d}" fill="none" stroke="${o.color}" stroke-width="1.5"/><circle cx="${x(n-1)}" cy="${y(last)}" r="2.5" fill="${o.color}"/></svg>`}

/* hover layer */
const tip=document.getElementById('tip');
function showTip(x,y,title,rows){tip.replaceChildren();const t=document.createElement('div');t.className='t';t.textContent=title;tip.appendChild(t);for(const r of rows){const d=document.createElement('div');d.className='r';const l=document.createElement('span');if(r.color){const i=document.createElement('i');i.style.background=r.color;l.appendChild(i)}l.appendChild(document.createTextNode(r.label));const b=document.createElement('b');b.textContent=r.value;d.append(l,b);tip.appendChild(d)}tip.style.display='block';const w=tip.offsetWidth,h=tip.offsetHeight;tip.style.left=Math.min(window.innerWidth-w-8,x+14)+'px';tip.style.top=Math.max(8,y-h-12)+'px'}

function wireCharts(root){
  root.querySelectorAll('[data-chart]').forEach(svg=>{const ch=CH[svg.dataset.chart];if(!ch)return;
    if(ch.type==='area'){const xh=svg.querySelector('.xh'),hv=svg.querySelector('.dot.hv');
      svg.addEventListener('pointermove',e=>{const r=svg.getBoundingClientRect();const px=(e.clientX-r.left)*ch.W/r.width;let best=0,bd=1e9;ch.x.forEach((x,i)=>{const d=Math.abs(x-px);if(d<bd){bd=d;best=i}});const p=ch.series[best];const cx=ch.x[best];xh.setAttribute('x1',cx);xh.setAttribute('x2',cx);xh.style.opacity=1;if(p.v!=null){hv.setAttribute('cx',cx);hv.setAttribute('cy',ch.y(p.v));hv.style.opacity=1}else hv.style.opacity=0;
        showTip(e.clientX,e.clientY,fmtTime(p.t,dateOnly),[{label:ch.label,value:p.v==null?'no data':(ch.unit==='%'?p.v.toFixed(1)+'%':fmtN(p.v)),color:ch.color}])});
      svg.addEventListener('pointerleave',()=>{xh.style.opacity=0;hv.style.opacity=0;hideTip()});}
    if(ch.type==='bar'){svg.querySelectorAll('g.bar').forEach(g=>{const i=+g.dataset.i;g.addEventListener('pointermove',e=>showTip(e.clientX,e.clientY,ch.cats[i],[{label:ch.label,value:fmtN(ch.vals[i]),color:ch.color}]));g.addEventListener('pointerleave',hideTip)})}
    if(ch.type==='pair'){svg.querySelectorAll('g.bar').forEach(g=>{const i=+g.dataset.i;g.addEventListener('pointermove',e=>showTip(e.clientX,e.clientY,fmtTime(ch.days[i],dateOnly),[{label:'opened',value:fmtN(ch.a[i]),color:C.accent},{label:'closed',value:fmtN(ch.b[i]),color:C.ok}]));g.addEventListener('pointerleave',hideTip)})}
    if(ch.type==='stack'){svg.querySelectorAll('i[data-r]').forEach(el=>{const r=ch.rows[+el.dataset.r];el.addEventListener('pointermove',e=>showTip(e.clientX,e.clientY,r.label,ch.segs.filter(s=>r.counts[s.key]).map(s=>({label:s.label,value:fmtN(r.counts[s.key]||0),color:s.color}))));el.addEventListener('pointerleave',hideTip)})}

const firstLast=s=>s.length>1?[s[0],s[s.length-1]]:[null,null];

V.fleet=()=>{const {q}=route();const org=q.org||'';const d=days();

  const compliance=card(`Compliance (${d}d)`,`<code>/compliance/history?aggregate=fleet</code>: compliant ÷ (compliant + non_compliant), summed per day in SQL.`,pills+areaChart(pts,{label:SER[sel].label,unit:SER[sel].unit,color:SER[sel].color,min:sel==='percent'?undefined:0,aria:`${SER[sel].label} over the last ${d} days`}),{strip,right:`<a class="btn ghost sm" href="#/history">full history</a>${tableBtn('c-comp')}`,id:'c-comp'});
  const totAge=s.finding_age.reduce((a,b)=>a+b.count,0);const under30=s.finding_age.slice(0,3).reduce((a,b)=>a+b.count,0);
  const age=card('Finding age','How long non-compliant results have been failing (<code>now − last_changed_at</code>).',`<div style="margin:2px 0 4px">${badge(`${totAge?Math.round(100*under30/totAge):0}% under 30d`,'info')}</div><div class="agebar" role="img" aria-label="finding age distribution">${s.finding_age.map((b,i)=>b.count?`<i style="flex:${b.count} ${b.count} 0;background:${AGE_COLOR[i]}" title="${esc(b.bucket)}: ${fmtN(b.count)}"></i>`:'').join('')}</div><div class="age-legend">${s.finding_age.map((b,i)=>`<span><span><i style="background:${AGE_COLOR[i]}"></i>${esc(b.bucket)}</span><b>${fmtN(b.count)}</b></span>`).join('')}</div><div class="muted" style="font-size:12.5px;margin-top:12px"><a href="#/findings?sort=since_asc${org?'&org='+org:''}">oldest findings first →</a></div>`);
  const ctlDelta=id=>{const ps=byCtl.filter(p=>p.control_id===id);const [a,b]=firstLast(ps);return delta(b&&b.compliance.percent,a&&a.compliance.percent,'',true)};
  const worst=card('Worst controls','Lowest measured compliance; delta over the range.',`<div class="bl">${controls.filter(c=>c.compliance.percent!=null).sort((a,b)=>a.compliance.percent-b.compliance.percent).slice(0,5).map(c=>`<div class="r"><div class="t"><span><a href="#/controls/${c.id}">${esc(c.id)}</a><em>${esc(c.type)}</em></span><b>${fmtP(c.compliance.percent)} <span class="trend">${ctlDelta(c.id)}</span></b></div>${meter(c.compliance.percent).replace('<b>'+fmtP(c.compliance.percent)+'</b>','')}</div>`).join('')}</div>`);
  const parked=card('Parked by reason','Repositories out of measurement (<code>Summary.parked_by_reason</code>).',barList(s.parked_by_reason.map(p=>({label:human(p.reason),value:p.count})),{pct:true}));
  const assignments=card('Assignments','Every assignment lands in exactly one bucket.',stackedBars([{label:'all controls',counts:s.compliance}],bucketSegs,{aria:'fleet assignments by bucket'}),{right:tableBtn('c-asg'),id:'c-asg'});
  state.exports['by-control']={name:'controls'+(org?'-'+org:''),header:['control','type','compliant','non_compliant','not_applicable','percent'],rows:controls.map(c=>[c.id,c.type,c.compliance.compliant,c.compliance.non_compliant,c.compliance.not_applicable,c.compliance.percent])};
  const byControl=card('Compliance by control','From <code>/controls</code>; sparkline from <code>aggregate=control</code> over the range.',`<table class="tbl"><thead><tr><th>Control</th><th>Results</th><th class="num">%</th><th>Trend</th></tr></thead><tbody>${controls.map(c=>`<tr class="link" data-go="controls/${c.id}"><td class="m">${esc(c.id)}</td><td>${badge(`✓ ${fmtN(c.compliance.compliant)}`,c.compliance.compliant?'ok':'mute')} ${badge(`✗ ${fmtN(c.compliance.non_compliant)}`,c.compliance.non_compliant?'bad':'mute')}</td><td class="num" style="font-weight:600;font-size:14px">${fmtP(c.compliance.percent)}</td><td>${sparkline(byCtl.filter(p=>p.control_id===c.id).map(p=>p.compliance.percent))}</td></tr>`).join('')}</tbody></table>`,{right:exportBtn('by-control')});
  let byOrg;

    byOrg=card('Exclusions by reason','What the policy leaves out in this org, and why (<code>OrgDetail.exclusions</code>).',ex.length?barList(ex.map(e=>({label:e.reason,value:e.repository?1:CELLS.find(c=>c.org===org)?.compliance.assigned||0,sub:e.repository||e.control_id}))):'<div class="muted" style="font-size:13px">Nothing excluded in this org.</div>',{right:exportBtn('org-side')})}
  else{state.exports['org-side']={name:'orgs',header:['org','tracked','non_compliant','parked','percent'],rows:orgs.map(o=>[o.org,o.tracked,o.compliance.non_compliant,o.parked,o.compliance.percent])};
    byOrg=card('Orgs','From <code>/orgs</code>: tracked, non-compliant and parked per org you can see.',`<table class="tbl"><thead><tr><th>Org</th><th class="num">Tracked</th><th class="num">Non-compliant</th><th class="num">Parked</th><th style="width:38%">Compliance</th></tr></thead><tbody>${orgs.slice().sort((a,b)=>b.tracked-a.tracked).map(o=>`<tr class="link" data-go="orgs/${o.org}"><td style="font-weight:500">${esc(o.org)}</td><td class="num">${fmtN(o.tracked)}</td><td class="num">${fmtN(o.compliance.non_compliant)}</td><td class="num muted">${fmtN(o.parked)}</td><td>${meter(o.compliance.percent,'accent')}</td></tr>`).join('')}</tbody></table>`,{right:exportBtn('org-side')})}
  const on=remediationOn();
  const prs=card('Open PRs by age','Open pull-request remediations by <code>created_at</code>; 30d+ is stale.',on?barChart(s.open_prs_by_age.map(b=>b.bucket),s.open_prs_by_age.map(b=>b.count),{label:'open PRs',aria:'open pull requests by age'})+`<div class="muted" style="font-size:12.5px;margin-top:8px">${fmtN(s.open_prs_by_age[3].count)} over threshold → <a href="#/findings?pr_stale=true${org?'&org='+org:''}">findings?pr_stale=true</a></div>`:gated('No remediation yet',NO_REMEDIATION),{right:on?tableBtn('c-prs'):'',id:'c-prs'});
  const tdays=Array.from({length:14},(_,i)=>daysAgo(13-i));
  const thr=card('PR throughput (14d)','Pull-request remediations opened vs closed per day (<code>/remediations/activity</code>).',on?pairBars(tdays,tdays.map((_,i)=>18+Math.round(10*Math.sin(i/2)+rnd()*8)),tdays.map((_,i)=>14+Math.round(9*Math.cos(i/3)+rnd()*8))):gated('No remediation yet',NO_REMEDIATION));
  return pageHeader('Fleet','Compliance across every org you can see.',{range:true})
    +`<div class="grid cols-3">${compliance}${age}</div>`
    +`<div class="grid cols-3b mt">${worst}${parked}${assignments}</div>`

};

};

V.control=(id)=>{const {q}=route();const org=q.org||'';const c=api.control(id,org);if(!c)return notFound();const def=ctrl(id);
  const hist=api.history({aggregate:'control',control:id,org,days:days()}).items;const [a,b]=firstLast(hist);
  const res=api.results({status:'non_compliant',control:id,org,sort:'since_asc'});

  return pageHeader(`<span class="m">${esc(id)}</span> ${kindBadge(c.type)}`,`${esc(c.title)} · v${def.version}`,{range:true,actions:`<a class="btn" href="#/findings?control=${id}${org?'&org='+org:''}">Findings for this control</a>`})

    +`<div class="grid cols-3 mt"><div>${card(`Compliance (${days()}d)`,'<code>aggregate=control</code> over the orgs in scope.',areaChart(hist.map(p=>({t:p.snapshot_at,v:p.compliance.percent})),{h:180,label:'compliance %',aria:`${id} compliance over time`}),{right:tableBtn('c-ch'),id:'c-ch'})}
      <div class="mt">${card('By org','Each org, its decision and the versions it carries.',`<table class="tbl"><thead><tr><th>Org</th><th>Decision</th><th>Versions</th><th class="num">Non-compliant</th><th style="width:36%">Compliance</th></tr></thead><tbody>${c.orgs.map(o=>`<tr class="link" data-go="orgs/${o.org}"><td style="font-weight:500">${esc(o.org)}</td><td>${decisionBadge(o.decision)}</td><td class="m muted">${o.versions.map(v=>`v${v.version} · ${fmtN(v.repositories)}`).join(', ')}</td><td class="num">${fmtN(o.compliance.non_compliant)}</td><td>${meter(o.compliance.percent,'accent')}</td></tr>`).join('')}</tbody></table>`)}</div>

      ${card('Oldest findings','Longest failing first; a row opens the finding.',oldest.length?`<table class="tbl dense"><tbody>${oldest.map(f=>`<tr class="link" data-go="findings?control=${id}&open=${f.repository_id}/${id}"><td class="m">${esc(f.org)}/${esc(f.repository)}<span class="sub">${esc(f.failing_rules.join(', '))}</span></td><td class="num muted">${ageDays(f.last_changed_at)}d</td></tr>`).join('')}</tbody></table>`:'<div class="muted" style="font-size:13px">No findings in scope.</div>')}</div></div>`;
};

V.orgs=()=>{const {q}=route();const scope=q.org||'';const tab=q.tab||'compliance';const term=(q.q||'').toLowerCase();const on=remediationOn();
  const orgs=api.orgs(scope).items;const T=addPosture(orgs.map(o=>o.compliance));const Tt=orgs.reduce((a,o)=>a+o.tracked,0),Tp=orgs.reduce((a,o)=>a+o.parked,0),To=orgs.reduce((a,o)=>a+o.open_prs,0);
  // One figure per column: counts (zero muted, non-compliant in the bad tone) and compliance as a meter.
  const cnt=(v,bad)=>`<td class="num${v?(bad?' bad-t':''):' muted'}">${fmtN(v)}</td>`;
  const comp=p=>`<td>${p.compliant+p.non_compliant?meter(p.percent):'<span class="muted">no data</span>'}</td>`;
  const cells=p=>cnt(p.compliant)+cnt(p.non_compliant,true)+comp(p);
  let head,rows,total;
  if(tab==='parked'){
    head=`<tr><th>Org / repository</th><th>Reason</th><th>Parked</th></tr>`;
    rows=orgs.map(o=>{const d=api.org(o.org);const isOpen=state.gg[o.org]!==false;const repos=REPOS.filter(r=>r.org===o.org&&!r.active&&(!term||r.name.includes(term)));
      return `<tr class="grp" data-act="gg" data-org="${esc(o.org)}"><td><span class="tog">${isOpen?'−':'+'}</span>${esc(o.org)}<span class="meta">${fmtN(o.parked)} parked</span></td><td class="muted" style="font-weight:400">${d.parked.map(p=>`${human(p.reason)} ${p.count}`).join(' · ')}</td><td></td></tr>`
        +(isOpen?repos.map(r=>`<tr class="child link" data-go="repositories/${r.id}"><td class="m">${esc(r.name)}</td><td>${badge(human(r.park_reason),'warn')}</td><td class="muted">${timeAttr(r.parked_at)}${rel(r.parked_at)}</time></td></tr>`).join('')+(o.parked>repos.length?`<tr class="child loadmore"><td colspan="3">showing ${repos.length} of ${fmtN(o.parked)} · <button class="btn sm">Load more</button></td></tr>`:''):'')}).join('');
    total=`<tr class="total"><td>${orgs.length} orgs</td><td>${fmtN(Tp)} parked</td><td></td></tr>`;
  }else{
    head=`<tr><th>Org / repository</th><th class="num">Assigned</th><th class="num">Compliant</th><th class="num">Non-compliant</th><th>Compliance</th><th class="num">Open PRs</th><th class="num">Parked</th></tr>`;
    rows=orgs.map(o=>{const isOpen=state.gg[o.org]!==false;const repos=api.repositories({org:o.org,active:'true',q:term}).items;
      const grp=`<tr class="grp" data-act="gg" data-org="${esc(o.org)}"><td><span class="tog">${isOpen?'−':'+'}</span>${esc(o.org)}<span class="meta">${fmtN(o.tracked)} repositories · ${fmtN(o.parked)} parked</span></td><td class="num">${fmtN(o.compliance.assigned)}</td>${cells(o.compliance)}<td class="num ${on?'':'muted'}">${on?fmtN(o.open_prs):'—'}</td><td class="num muted">${fmtN(o.parked)}</td></tr>`;
      const kids=isOpen?repos.map(r=>{const p=r.compliance;return `<tr class="child link" data-go="repositories/${r.id}"><td class="m">${esc(r.name)}</td><td class="num">${fmtN(p.assigned)}</td>${cells(p)}<td class="num muted">${on?fmtN(ALL_RESULTS.filter(x=>x.repository_id===r.id&&remediationOf(x)&&remediationOf(x).kind==='pull_request').length):'—'}</td><td class="num muted"></td></tr>`}).join('')+(o.tracked>repos.length&&!term?`<tr class="child loadmore"><td colspan="7">showing ${repos.length} of ${fmtN(o.tracked)} · <button class="btn sm">Load more</button></td></tr>`:''):'';
      return grp+kids}).join('');
    total=`<tr class="total"><td>${orgs.length} orgs</td><td class="num">${fmtN(T.assigned)}</td>${cells(T)}<td class="num">${on?fmtN(To):'—'}</td><td class="num">${fmtN(Tp)}</td></tr>`;
  }
  const tabs=[['compliance','Compliance'],['parked','Parked'],['pr','PR activity']];
  const prTab=tab==='pr'?(on?`<table class="gg"><thead><tr><th>Org</th><th class="num">Open PRs</th><th class="num">Stale (30d+)</th><th class="num">Opened 14d</th><th class="num">Merged 14d</th></tr></thead><tbody>${orgs.map(o=>`<tr class="link" data-go="findings?org=${o.org}&pr_stale=true"><td style="font-weight:500">${esc(o.org)}</td><td class="num">${fmtN(o.open_prs)}</td><td class="num">${fmtN(Math.round(o.open_prs*.08))}</td><td class="num">${fmtN(Math.round(o.open_prs*.9))}</td><td class="num">${fmtN(Math.round(o.open_prs*.7))}</td></tr>`).join('')}</tbody></table>`:gated('No pull requests yet',NO_REMEDIATION)):null;
  const toolbar=`<div class="filters" style="padding:0 0 10px"><span class="muted" style="font-size:12px">Repositories</span>${badge(fmtN(Tt),'mute')}<span class="muted" style="font-size:12px">Non-compliant</span>${badge(fmtN(T.non_compliant),'bad')}<span class="muted" style="font-size:12px">Parked</span>${badge(fmtN(Tp),'warn')}<span class="sp" style="flex:1"></span><input class="search" data-act="org-search" placeholder="Filter repositories…" value="${esc(q.q||'')}" aria-label="Filter repositories"><div class="seg" role="tablist">${tabs.map(([k,l])=>`<button role="tab" class="${tab===k?'cur':''}" data-act="tab" data-tab="${k}">${l}</button>`).join('')}</div><button class="btn sm" data-act="ggall">${Object.values(state.gg).some(v=>v===false)?'Expand all':'Collapse all'}</button></div>`;
  state.exports.orgs={name:'orgs'+(scope?'-'+scope:''),header:['org','tracked','compliant','non_compliant','percent','parked'],rows:orgs.map(o=>[o.org,o.tracked,o.compliance.compliant,o.compliance.non_compliant,o.compliance.percent,o.parked])};
  return pageHeader('Orgs','Each org expands to its repositories. Assigned, compliant and non-compliant count control assignments (repository × control); compliance is compliant ÷ (compliant + non-compliant), and the footer sums the rows.',{actions:`<button class="btn" data-act="export" data-export="orgs">Export CSV</button>`})
    +card(null,null,toolbar+(prTab||`<table class="gg"><thead>${head}</thead><tbody>${rows}${total}</tbody></table>`));
};

V.org=(org)=>{const d=api.org(org);if(!d)return notFound();const s=api.orgs(org).items[0];const hist=api.history({aggregate:'org',org,days:days()}).items;
  return pageHeader(`${esc(org)} ${kindBadge('org')}`,'Baseline and org-added compliance, the controls this org carries, and what it excludes.',{scope:false,range:true,actions:`<a class="btn" href="#/findings?org=${org}">Findings in this org</a>`})

    +`<div class="grid cols-3 mt"><div>${card(`Compliance (${days()}d)`,'<code>aggregate=org</code>, every control in this org.',areaChart(hist.map(p=>({t:p.snapshot_at,v:p.compliance.percent})),{h:180,label:'compliance %',aria:`${org} compliance over time`}),{right:tableBtn('c-oh'),id:'c-oh'})}<div class="mt">${card('Controls','Baseline, replaced and org-added.',`<table class="tbl"><thead><tr><th>Control</th><th>Decision</th><th class="num">Compliant</th><th class="num">Non-compliant</th><th class="num">N/A</th><th class="num">%</th></tr></thead><tbody>${d.controls.map(c=>`<tr class="link" data-go="controls/${c.control_id}?org=${org}"><td class="m">${esc(c.control_id)}</td><td>${decisionBadge(c.decision)}</td><td class="num${c.compliance.compliant?'':' muted'}">${fmtN(c.compliance.compliant)}</td><td class="num${c.compliance.non_compliant?'':' muted'}">${fmtN(c.compliance.non_compliant)}</td><td class="num muted">${fmtN(c.compliance.not_applicable)}</td><td class="num" style="font-weight:600;font-size:14px;border-left:1px solid var(--line)">${fmtP(c.compliance.percent)}</td></tr>`).join('')}</tbody></table>`)}</div></div>
      <div class="grid" style="align-content:start">${card('Worst controls','Lowest measured compliance.',barList(d.worst_controls.map(c=>({label:c.control_id,value:c.compliance.non_compliant,after:` <span class="muted">· ${fmtP(c.compliance.percent)}</span>`})),{link:i=>`#/controls/${i.label}?org=${org}`}))}${card('Exclusions','Repositories or controls the policy leaves out, and why.',d.exclusions.length?`<table class="tbl dense"><tbody>${d.exclusions.map(e=>`<tr><td class="m">${esc(e.repository||e.control_id)}<span class="sub">${esc(e.reason)} · ${esc(e.excluded_by)}</span></td></tr>`).join('')}</tbody></table>`:'<div class="muted" style="font-size:13px">Nothing excluded.</div>')}${card('Parked by reason',null,barList(d.parked.map(p=>({label:human(p.reason),value:p.count})),{pct:true}))}</div></div>`;
};

/* findings: non_compliant results only, no status filter */
const FILTERS=[['control',()=>api.controls(route().q.org).items.map(c=>c.id)],['rule',()=>{const c=ctrl(route().q.control);return c?c.rules.map(r=>r[0]):[]}],['org',()=>ORGS.map(o=>o.org)],['decision',()=>['baseline','replaced','org_added']],['pr_stale',()=>['true']]];
function ruleTable(x){return `<table class="tbl dense"><thead><tr><th>Rule</th><th>Status</th><th>Evidence</th></tr></thead><tbody>${x.rules.map(r=>`<tr><td class="m">${esc(r.rule_id)}${r.remediate?'':'<span class="sub">not remediable</span>'}</td><td>${ruleBadge(r.status)}</td><td class="m" style="white-space:normal;font-size:12px">${esc(evidenceHeadline(r.evidence))}</td></tr>`).join('')}</tbody></table>`}
function describeEvent(e){if(e.source==='repository'){const d=e.detail||{};switch(e.kind){case 'discovered':return 'discovered';case 'renamed':return `renamed ${esc(d.from)} → ${esc(d.to)}`;case 'parked':return `parked · ${esc(human(d.reason))}`;default:return esc(e.kind)}}
  return `<span class="m">${esc(e.control_id)}${e.rule_id?' · '+esc(e.rule_id):''}</span> ${e.rule_id?ruleBadge(e.from_status):statusBadge(e.from_status)} → ${e.rule_id?ruleBadge(e.to_status):statusBadge(e.to_status)}`}
function timeline(repoId,control){const items=api.events(repoId).items.filter(e=>e.source==='repository'?['parked','renamed'].includes(e.kind):(!control||e.control_id===control)).slice(0,12).reverse();
  const evals=api.evaluations(repoId).items.slice(0,2).reverse();
  const all=[...items.map(e=>({t:e.occurred_at,html:describeEvent(e)})),...evals.map(c=>({t:c.started_at,html:`evaluated · ${esc(c.trigger)} · ${c.outcome==='success'?'ok':`<span class="bad">${esc(c.outcome)}</span>`}`}))].sort((a,b)=>a.t-b.t);
  return `<div class="hist">${all.map((i,k)=>`<div class="${k===all.length-1?'now':''}"><span class="d">${timeAttr(i.t)}${fmtTime(i.t)}</time></span>${i.html}</div>`).join('')}</div>`}

V.findings=()=>{const {q}=route();const on=remediationOn();

  const sel=open?api.results({status:'non_compliant'}).items.find(x=>String(x.repository_id)===open[0]&&x.control_id===open[1]):null;
  const active=FILTERS.filter(([k])=>q[k]);

    return `<tr class="link ${isSel?'sel':''}" data-act="open" data-open="${x.repository_id}/${x.control_id}" tabindex="0"><td class="m" style="color:var(--fg)">${esc(x.repository)}<span class="sub">${esc(x.org)}</span></td><td class="m">${esc(x.control_id)}<span class="sub">v${x.version}${x.decision!=='baseline'?' · '+esc(human(x.decision)):''}</span></td><td style="white-space:normal;max-width:380px"><div class="rules-mini">${x.failing_rules.map(r=>badge(r,'bad')).join('')}</div>${first?`<span class="hint m">${esc(evidenceHeadline(first.evidence))}</span>`:''}</td><td>${on?remBadge(x.remediation):'<span class="muted">—</span>'}</td><td class="muted col-since">${timeAttr(x.last_changed_at)}${rel(x.last_changed_at)}</time></td></tr>`}).join('')||`<tr><td colspan="5" class="muted" style="text-align:center;padding:28px">No findings match.</td></tr>`}</tbody></table>`;
  const drawer=sel?`<div class="drawer-scrim" data-act="open" data-open="" aria-hidden="true"></div><aside class="drawer" role="dialog" aria-label="Finding detail">
    <h3><a href="https://github.com/${esc(sel.org)}/${esc(sel.repository)}" target="_blank" rel="noopener noreferrer">${esc(sel.org)}/${esc(sel.repository)} ${ICON.ext}</a><button class="btn ghost sm" data-act="open" data-open="" aria-label="Close">✕</button></h3>
    <div class="sub">${esc(sel.control_id)} v${sel.version} · ${esc(human(sel.decision))} · failing since ${esc(fmtTime(sel.last_changed_at,dateOnly))}</div>
    <div class="kv"><span>Status</span><div>${statusBadge(sel.status)}</div><span>Remediation</span><div>${on?remBadge(sel.remediation):'<span class="muted">— remediation not enabled</span>'}</div><span>Last evaluated</span><div class="muted" style="font-size:12.5px">${timeAttr(sel.evaluated_at)}${fmtTime(sel.evaluated_at)}</time></div></div>
    <div class="card" style="margin-bottom:14px"><div class="card-b" style="padding:0">${ruleTable(sel)}</div></div>
    ${sel.rules.filter(r=>r.status==='fail'||r.status==='error').map(r=>`<div class="ev"><span class="k">${esc(r.rule_id)}</span> · ${evidenceText(r.evidence,true)}</div>`).join('')}
    ${timeline(sel.repository_id,sel.control_id)}
    <div class="actions"><button class="btn" data-act="evaluate">Re-evaluate</button><a href="#/repositories/${sel.repository_id}">Open repository →</a></div></aside>`:'';
  state.exports.findings={name:['findings',q.control,q.org].filter(Boolean).join('-'),header:['org','repository','control','version','decision','failing_rules','since'],rows:res.items.map(x=>[x.org,x.repository,x.control_id,x.version,x.decision,x.failing_rules.join(' '),iso(x.last_changed_at)])};
  return pageHeader('Findings','Non-compliant results: a control that failed on a repository. Filters map 1:1 to <code>/results</code> query parameters.',{actions:`<button class="btn" data-act="export" data-export="findings">Export CSV</button>`})
    +`<div class="layout ${sel?'open':''}"><div><div class="card"><div class="filters">${chips}${sortBtn}<span class="count">${res.items.length} loaded of ${fmtN(res.total)}</span></div></div><div class="card mt"><div class="tbl-wrap">${table}</div></div>${res.total>res.items.length?'<div style="text-align:center;margin-top:10px"><button class="btn">Load more</button></div>':''}</div>${drawer}</div>`;
};

const RFILTERS=[['kind',()=>['pull_request','api']],['state',()=>['reserved','open','merged','closed_compliant','closed_by_user','closed_withdrawn','recommended','superseded','withdrawn','resolved','applied','failed']],['org',()=>ORGS.map(o=>o.org)],['control',()=>CONTROLS.map(c=>c.id)],['hold',()=>Object.keys(HOLD_TEXT)],['older_than',()=>['7','30','90']]];

    <div class="sub">${esc(sel.control_id)} · ${esc(human(sel.kind))} · opened ${esc(fmtTime(sel.created_at,dateOnly))}</div>
    <div class="kv"><span>State</span><div>${badge(sel.state==='open'?'pr open':human(sel.state),TONE.remediation[sel.state]||'mute')}</div>${sel.pr_number?`<span>Pull request</span><div><a class="m" href="${esc(sel.pr_url)}" target="_blank" rel="noopener noreferrer">#${sel.pr_number} ${ICON.ext}</a> <span class="muted m" style="font-size:12px">repo-guardian/${esc(sel.control_id)}</span></div>`:''}<span>Hold</span><div>${sel.hold?`${badge(human(sel.hold),TONE.hold[sel.hold])}<span class="hint">${esc(HOLD_TEXT[sel.hold])}</span>`:'<span class="muted">—</span>'}</div><span>Age</span><div>${remAge(sel)} days</div></div>

    ${sel.steps.length?`<div class="ev"><span class="k">steps (direct apply journal)</span>\n${sel.steps.map(st=>`${st.seq}. ${esc(st.kind)} · ${esc(st.detail)}`).join('\n')}</div>`:''}

V.repo=(id)=>{const {q}=route();const d=api.repository(id);if(!d)return notFound();const r=d.repository;const tab=q.tab||'controls';const on=remediationOn();
  let body;
  if(tab==='evaluations'){body=card('Evaluation log','The last 20 evaluations, newest first.',`<table class="tbl"><thead><tr><th>Time</th><th>Trigger</th><th>Outcome</th><th class="num">Duration</th><th>Error</th></tr></thead><tbody>${api.evaluations(id).items.map(c=>`<tr><td class="m muted">${timeAttr(c.started_at)}${rel(c.started_at)}</time></td><td>${esc(c.trigger)}</td><td>${badge(c.outcome,c.outcome==='success'?'ok':'bad')}</td><td class="num">${c.duration_seconds.toFixed(1)}s</td><td class="muted" style="white-space:normal;max-width:320px;font-size:12px">${c.error?esc(c.error):'—'}</td></tr>`).join('')||'<tr><td colspan="5" class="muted">Not evaluated while parked.</td></tr>'}</tbody></table>`)}
  else if(tab==='events'){body=card('Events','Result changes and repository events, newest first.',`<table class="tbl"><thead><tr><th>Time</th><th>Change</th></tr></thead><tbody>${api.events(id).items.map(e=>`<tr><td class="m muted">${timeAttr(e.occurred_at)}${rel(e.occurred_at)}</time></td><td style="white-space:normal">${describeEvent(e)}</td></tr>`).join('')}</tbody></table>`)}
  else{const ctls=api.repositoryControls(id).items;body=ctls.length?ctls.map(c=>card(`<a class="m" href="#/controls/${c.control_id}">${esc(c.control_id)}</a>`,`v${c.version} · ${esc(c.effective_mode)} (${esc(c.mode_source)}${c.mode_reason?', '+esc(human(c.mode_reason)):''}) · from ${esc(c.source)}${c.source_block?' '+esc(c.source_block):''}`,
      (c.reason||c.excluded_by?`<p class="muted" style="font-size:12px;margin:0 0 8px">${esc([c.reason,c.excluded_by].filter(Boolean).join(' · '))}</p>`:'')+(c.rules.length?`<table class="tbl dense"><thead><tr><th>Rule</th><th>Status</th><th>Evidence</th><th>Remediable rule</th></tr></thead><tbody>${c.rules.map(x=>`<tr><td class="m">${esc(x.rule_id)}</td><td>${ruleBadge(x.status)}</td><td class="m" style="white-space:normal;font-size:12px">${esc(evidenceHeadline(x.evidence))}</td><td class="muted">${x.remediate?'yes':'no'}</td></tr>`).join('')}</tbody></table>`:'<div class="muted" style="font-size:13px">Not evaluated: excluded by policy.</div>')+(on&&c.remediation?`<div style="margin-top:8px;font-size:12.5px">Remediation: ${remBadge(c.remediation)}${c.remediation.hold?`<span class="hint">${esc(HOLD_TEXT[c.remediation.hold])}</span>`:''}${c.remediation.steps&&c.remediation.steps.length?`<span class="hint m">${c.remediation.steps.map(st=>`${st.seq}. ${esc(st.kind)} · ${esc(st.detail)}`).join(' → ')}</span>`:''} <a href="#/remediations?open=${c.remediation.id}" style="font-size:12px">details →</a></div>`:''),
      {right:`${decisionBadge(c.decision)} ${bucketBadge(c.bucket)}`})).join('<div class="mt"></div>'):'<div class="muted">No control is assigned to this repository.</div>'}
  const tabs=`<div class="tabs-line" role="tablist" aria-label="Repository sections">${[['controls','Controls'],['evaluations','Evaluation log'],['events','Events']].map(([k,l])=>`<button role="tab" class="${tab===k?'cur':''}" data-act="rtab" data-tab="${k}">${l}</button>`).join('')}</div>`;
  const facts=`<div class="kv" style="margin:0"><span>State</span><div>${r.active?badge('active','ok'):badge('parked · '+human(r.park_reason),'warn')}</div><span>Policy state</span><div class="m">${esc(r.policy_state)}</div>${r.policy_reason?`<span>Policy reason</span><div style="font-size:12.5px">${esc(r.policy_reason)}</div>`:''}<span>Compliance</span><div>${r.active?meter(r.compliance.percent,'accent'):'<span class="muted">—</span>'}</div><span>Evaluable</span><div>${r.evaluable?'yes':'no'}</div><span>Remediable</span><div>${r.remediable?'yes':'no'}${r.remediable?'':'<span class="hint">Remediation App has no access to this repository</span>'}</div><span>Discovered</span><div>${timeAttr(r.discovered_at)}${fmtTime(r.discovered_at,dateOnly)}</time></div><span>Last evaluated</span><div>${r.last_evaluated_at?timeAttr(r.last_evaluated_at)+rel(r.last_evaluated_at)+'</time>':'—'}</div><span>Next due</span><div>${r.next_due_at?timeAttr(r.next_due_at)+until(r.next_due_at)+'</time>':'<span class="muted">— parked</span>'}</div><span>Provider id</span><div class="m">${r.provider_repo_id}</div></div>`;
  return pageHeader(`${esc(r.org)}/${esc(r.name)} ${r.active?badge('active','ok'):badge('parked · '+human(r.park_reason),'warn')}`,`evaluated ${r.last_evaluated_at?rel(r.last_evaluated_at):'never'} · ${fmtN(r.compliance.non_compliant)} findings across ${fmtN(r.compliance.assigned)} assignments`,{scope:false,actions:`${r.active?'<button class="btn" data-act="evaluate">Re-evaluate</button>':''}<a class="btn" href="https://github.com/${esc(r.org)}/${esc(r.name)}" target="_blank" rel="noopener noreferrer">Open on GitHub ${ICON.ext}</a>`})
    +`<div class="grid cols-3"><div>${tabs}${body}</div><div>${card('Repository',null,facts)}</div></div>`;
};

V.history=()=>{const {q}=route();const control=q.control||'';const org=q.org||'';const d=days();const controls=api.controls(org).items;
  const pick=`<select class="btn" data-act="control-pick" aria-label="Control">${['',...controls.map(x=>x.id)].map(n=>`<option value="${n}" ${control===n?'selected':''}>${n||'All controls'}</option>`).join('')}</select>`;
  const fleet=api.history({aggregate:control?'control':'fleet',control,org,days:d}).items;const per=api.history({aggregate:'org',control,org,days:d}).items;
  return pageHeader('History','Compliance over time from <code>/compliance/history</code>; one small chart per org so every series keeps its own axis.',{range:true,actions:pick})
    +card(`${control?esc(control):'All controls'} · ${org||'every org'}`,`aggregate=${control?'control':'fleet'}`,areaChart(fleet.map(p=>({t:p.snapshot_at,v:p.compliance.percent})),{h:200,label:'compliance %',aria:'compliance over time'}),{right:tableBtn('c-hf'),id:'c-hf'})
    +`<div class="grid cols-3b mt">${ORGS.filter(o=>inScope(o.org,org)).map(o=>{const ser=per.filter(p=>p.org===o.org);return card(esc(o.org),control?esc(control):'all controls',ser.length?areaChart(ser.map(p=>({t:p.snapshot_at,v:p.compliance.percent})),{w:420,h:170,xticks:4,label:'compliance %',aria:`${o.org} compliance`}):'<div class="muted" style="padding:20px;text-align:center">not assigned in this org</div>',{right:ser.length?tableBtn('c-h-'+o.org):'',id:'c-h-'+o.org})}).join('')}</div>`;
};

V.policy=()=>{const p=api.policies();const layer=(title,list)=>list.length?list.map(c=>`<div class="m" style="font-size:12px">${esc(c.control)}${c.with?' → '+esc(c.with):''}${c.block?' · block '+esc(c.block):''}${c.reason?` <span class="muted">· ${esc(c.reason)}</span>`:''}</div>`).join(''):'<span class="muted">—</span>';
  return pageHeader('Policy','The active policy as you may see it: version, enterprise baseline, org layers and the catalogue. Changes go through git.',{scope:false})
    +`<div class="grid cols-4">${kpi('Version',`<span class="m" style="font-size:14px">${esc(p.version)}</span>`)}${kpi('Activated',fmtTime(p.activated_at,dateOnly),rel(p.activated_at))}${kpi('Rollout',badge('complete','ok'),'completed '+rel(p.rollout_completed_at))}${kpi('Controls',p.controls.length,`${p.enterprise.controls.length} in the baseline`)}</div>`
    +`<div class="grid cols-2 mt">${card('Enterprise baseline',`mode <code>${esc(p.enterprise.mode)}</code> · ${p.enterprise.orgs.length} orgs`,`<div class="rules-mini">${p.enterprise.controls.map(c=>kindBadge(c)).join('')}</div>`)}${card('Org layers','What each org adds, replaces and excludes.',p.orgs.map(o=>`<div style="padding:8px 0;border-bottom:1px solid var(--line)"><div style="display:flex;justify-content:space-between"><b class="m" style="font-size:13px">${esc(o.org)}</b>${o.mode?kindBadge(o.mode):''}</div><div class="kv" style="margin:6px 0 0;grid-template-columns:110px 1fr;gap:4px 10px"><span>added</span><div>${layer('',o.added)}</div><span>replaced</span><div>${layer('',o.replaced)}</div><span>excluded</span><div>${layer('',o.excluded)}</div><span>excluded repos</span><div>${o.excluded_repos.length?o.excluded_repos.map(e=>`<div class="m" style="font-size:12px">${esc(e.match.join(', '))} <span class="muted">· ${esc(e.reason)}</span></div>`).join(''):'<span class="muted">—</span>'}</div><span>repo groups</span><div>${o.repos.length?o.repos.map(e=>`<div class="m" style="font-size:12px">${esc(e.label)}: ${esc(e.match.join(', '))}${e.mode?` <span class="muted">· ${esc(e.mode)}</span>`:''}</div>`).join(''):'<span class="muted">—</span>'}</div></div></div>`).join(''))}</div>`
    +`<div class="mt">${card('Catalogue','The controls this policy references.',`<table class="tbl"><thead><tr><th>Control</th><th>Title</th><th>Type</th><th>Revision</th></tr></thead><tbody>${p.controls.map(c=>`<tr class="link" data-go="controls/${c.id.split('@')[0]}"><td class="m" style="font-weight:500">${esc(c.id)}</td><td style="white-space:normal">${esc(c.title)}</td><td class="m muted">${esc(c.type)}</td><td class="m muted">${esc(c.revision.slice(0,19))}</td></tr>`).join('')}</tbody></table>`)}</div>`;
};

V.status=()=>{const s=api.status();const head={operational:'All systems operational',degraded:'Degraded performance',down:'Service disruption',unknown:'Status not yet available'}[s.state]||s.state;const tone=TONE.component[s.state]||'mute';const op=s.operations;
  return `<div class="status-page" style="max-width:860px">
    <div class="hd"><div class="brand" style="font-size:15px">${ICON.shield}<span>Repo Guardian status</span></div><span class="muted" style="font-size:12px">updated ${rel(s.updated_at)} · refreshes every 30s</span></div>
    <div class="card banner" style="border-color:color-mix(in srgb,var(--${tone}) 50%,var(--line))"><span class="dot" style="background:var(--${tone})"></span><div style="flex:1"><b>${head}</b><span>Public, aggregate-only. No org, repository or control names appear on this page.</span></div>${stateBadge(s.state)}</div>
    <div class="grid mt" style="grid-template-columns:3fr 2fr">
      ${card('Components',null,`<div class="comp">${s.components.map(c=>`<div class="row"><i style="background:var(--${TONE.component[c.state]||'mute'})"></i><span class="n" style="width:150px">${esc(c.name)}</span><span class="d">${esc(c.detail||'')}</span>${stateBadge(c.state)}</div>`).join('')}</div>`)}
      ${card('Fleet compliance','Across all tracked repositories, last 30 days.',`<div class="hero">${s.compliance.measured?fmtP(s.compliance.percent):'no data'}</div><div style="margin-top:6px">${sparkline(s.compliance.history.map(p=>p.percent),{w:300,h:40,color:C.ok})}</div><div class="muted" style="font-size:12px;margin-top:6px">coverage ${fmtP(s.compliance.coverage)} · compliant ÷ (compliant + non_compliant)</div>`)}
    </div>
    <div class="card mt"><div class="ops" role="group" aria-label="Operations"><div><span>Evaluated 24h</span><b>${fmtN(op.evaluated_24h)}</b></div><div><span>Overdue</span><b>${fmtN(op.overdue)}</b></div><div><span>Policy rollout</span><b>${esc(op.rollout_state)}</b></div><div><span>Last snapshot</span><b>${rel(op.last_snapshot_at)}</b></div>${remediationOn()?`<div><span>Remediation backlog</span><b>${fmtN(op.remediation_backlog)}</b></div>`:''}</div></div>
    <div class="grid mt" style="grid-template-columns:2fr 3fr">
      ${card('Deployment',null,`<div class="kv" style="margin:0"><span>Version</span><div class="m">${esc(UI_VERSION)}</div><span>Topology</span><div class="m">${esc(s.topology)}</div>${s.apps.map(a=>`<span>${esc(a.app)} App</span><div>${fmtN(a.installations)} installations${a.suspended?` · <span class="down">${a.suspended} suspended</span>`:''} · ${fmtN(a.repositories)} repositories</div>`).join('')}${s.apps.some(a=>a.app==='remediate')?'':'<span>remediate App</span><div class="muted">not installed</div>'}</div>`)}
      ${card('Changelog','Curated release notes, embedded at build time.',`<div class="cl">${CHANGELOG.slice(0,5).map(e=>`<div class="e"><div class="h"><b>${esc(e.version)}</b><time datetime="${esc(e.date)}">${esc(e.date)}</time>${UI_VERSION===e.version?badge('running','ok'):''}</div><div class="t">${esc(e.title)}</div><p>${esc(e.summary)}</p><div>${e.tags.map(tagBadge).join('')}</div></div>`).join('')}</div><div style="margin-top:8px;font-size:12.5px"><a href="${api.uiConfig().releases_url}" target="_blank" rel="noopener noreferrer">All releases ${ICON.ext}</a></div>`)}
    </div>
    <div class="ft">GET /api/v1/status · served from an in-process cache · changelog from the UI bundle · <a href="#/">sign in</a></div>
  </div>`};

const notFound=()=>`<div class="card" style="padding:40px;text-align:center" role="alert"><b>Not found</b><div class="muted">That page or object is outside your scope or does not exist.</div></div>`;

/* ------------------------------------------------------------------ */
/* render + interactions                                               */
/* ------------------------------------------------------------------ */
const app=document.getElementById('app');
const HOME={l:'Repo Guardian',p:''};
function render(){const {parts,q}=route();let html,crumb;
  if(parts[0]==='status'){app.innerHTML=V.status();wireCharts(app);return}
  if(!parts[0]){html=V.fleet();crumb=[HOME,'Fleet']}
  else if(parts[0]==='controls'&&parts[1]){html=V.control(parts[1]);crumb=[HOME,{l:'Controls',p:'controls'},parts[1]]}
  else if(parts[0]==='controls'){html=V.controls();crumb=[HOME,'Controls']}
  else if(parts[0]==='orgs'&&parts[1]){html=V.org(parts[1]);crumb=[HOME,{l:'Orgs',p:'orgs'},parts[1]]}
  else if(parts[0]==='orgs'){html=V.orgs();crumb=[HOME,'Orgs']}
  else if(parts[0]==='findings'){html=V.findings();const o=q.open?q.open.split('/'):null;const r=o&&REPOS.find(x=>String(x.id)===o[0]);crumb=r?[HOME,{l:'Findings',p:'findings'},`${r.org}/${r.name} · ${o[1]}`]:[HOME,'Findings']}
  /* INV-0023 F2: the item crumb is the repository's name, never its numeric id */
  else if(parts[0]==='repositories'&&parts[1]){html=V.repo(parts[1]);const r=REPOS.find(x=>String(x.id)===parts[1]);crumb=[HOME,{l:'Repositories',p:'repositories'},r?r.org+'/'+r.name:'…']}
  else if(parts[0]==='repositories'){html=V.repositories();crumb=[HOME,'Repositories']}
  else if(parts[0]==='remediations'){html=V.remediations();const m=q.open&&REMEDIATIONS.find(r=>String(r.id)===q.open);crumb=m?[HOME,{l:'Remediations',p:'remediations'},`${m.org}/${m.repository} · ${m.control_id}`]:[HOME,'Remediations']}
  else if(parts[0]==='history'){html=V.history();crumb=[HOME,'History']}
  else if(parts[0]==='policy'){html=V.policy();crumb=[HOME,'Policy']}
  else{html=notFound();crumb=[HOME,'Not found']}
  app.innerHTML=shell(crumb,html);wireCharts(app);closePop();
}
function toast(msg){const t=document.createElement('div');t.className='pop';t.style.cssText='left:50%;bottom:24px;transform:translateX(-50%);padding:8px 12px';t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2200)}
function closePop(){document.querySelectorAll('.scrim,.pop.live,.pal').forEach(e=>e.remove());state.pop=null}
function openPop(anchor,kind){closePop();const scrim=document.createElement('div');scrim.className='scrim';scrim.style.background='transparent';scrim.addEventListener('click',closePop);document.body.appendChild(scrim);
  const pop=document.createElement('div');pop.className='pop live';const {q}=route();
  if(kind==='org'){const n=api.orgs().items;pop.innerHTML=`<div class="hd">Scope</div><button class="it ${!q.org?'cur':''}" data-org="">All orgs <small>${n.length}</small></button>${n.map(o=>`<button class="it ${q.org===o.org?'cur':''}" data-org="${esc(o.org)}">${esc(o.org)} <small>${fmtN(o.tracked)}</small></button>`).join('')}`;pop.addEventListener('click',e=>{const b=e.target.closest('[data-org]');if(!b)return;const {parts,q}=route();go(parts.join('/'),Object.assign({},q,{org:b.dataset.org}))})}
  else if(kind==='user'){const me=api.me();pop.innerHTML=`<div class="it" style="flex-direction:column;align-items:flex-start;gap:2px"><span>${esc(me.name)}</span><small>${esc(me.subject)}</small></div><hr><a class="it" href="${api.uiConfig().docs_url}" target="_blank" rel="noopener noreferrer">Documentation</a><button class="it" type="button" data-act="toast">Sign out</button>`}
  else if(kind.startsWith('rfilter:')){const key=kind.slice(8);
    if(!key){pop.innerHTML=`<div class="hd">Add filter</div>${RFILTERS.map(([k])=>`<button class="it" data-filter="${k}">${k}</button>`).join('')}`;pop.addEventListener('click',e=>{const b=e.target.closest('[data-filter]');if(b)openPop(anchor,'rfilter:'+b.dataset.filter)})}
    else{const vals=RFILTERS.find(([k])=>k===key)[1]();pop.innerHTML=`<div class="hd">${esc(key)}</div><button class="it" data-val="">any</button>${vals.map(v=>`<button class="it ${q[key]===v?'cur':''}" data-val="${esc(v)}">${esc(v)}</button>`).join('')}`;pop.addEventListener('click',e=>{const b=e.target.closest('[data-val]');if(!b)return;const nq=Object.assign({},route().q);if(b.dataset.val)nq[key]=b.dataset.val;else delete nq[key];delete nq.open;go('remediations',nq)})}}
  else if(kind.startsWith('filter:')){const key=kind.slice(7);
    if(!key){pop.innerHTML=`<div class="hd">Add filter</div>${FILTERS.map(([k])=>{const dis=(k==='rule'&&!q.control)||(k==='pr_stale'&&!remediationOn());return `<button class="it" data-filter="${k}" ${dis?'disabled style="opacity:.45;cursor:not-allowed"':''}>${k}<small>${k==='rule'&&!q.control?'choose a control first':k==='pr_stale'&&!remediationOn()?'remediation not enabled':''}</small></button>`}).join('')}`;pop.addEventListener('click',e=>{const b=e.target.closest('[data-filter]');if(b&&!b.disabled)openPop(anchor,'filter:'+b.dataset.filter)})}
    else{const vals=FILTERS.find(([k])=>k===key)[1]();pop.innerHTML=`<div class="hd">${esc(key)}</div><button class="it" data-val="">any</button>${vals.map(v=>`<button class="it ${q[key]===v?'cur':''}" data-val="${esc(v)}">${esc(v)}</button>`).join('')}`;pop.addEventListener('click',e=>{const b=e.target.closest('[data-val]');if(!b)return;const nq=Object.assign({},route().q);if(b.dataset.val)nq[key]=b.dataset.val;else delete nq[key];if(key==='control')delete nq.rule;delete nq.open;go('findings',nq)})}}
  document.body.appendChild(pop);const r=anchor.getBoundingClientRect();pop.style.top=(r.bottom+6)+'px';pop.style.left=Math.min(window.innerWidth-pop.offsetWidth-8,r.left)+'px';state.pop=kind;
}
function openPalette(){closePop();const scrim=document.createElement('div');scrim.className='scrim';scrim.addEventListener('click',closePop);document.body.appendChild(scrim);
  const pal=document.createElement('div');pal.className='pal';pal.setAttribute('role','dialog');pal.setAttribute('aria-label','Search');pal.innerHTML=`<input placeholder="Search repositories, controls, orgs…" aria-label="Search"><div class="res"></div>`;document.body.appendChild(pal);const inp=pal.querySelector('input'),res=pal.querySelector('.res');let cur=0,items=[];
  const draw=()=>{const qv=inp.value.trim().toLowerCase();const {q}=route();
    const repos=api.repositories({q:qv,org:q.org}).items.slice(0,8).map(r=>({g:'Repositories',l:r.org+'/'+r.name,s:r.active?(r.compliance.non_compliant?r.compliance.non_compliant+' findings':'compliant'):'parked · '+human(r.park_reason),p:'repositories/'+r.id}));
    const controls=qv?api.controls().items.filter(c=>c.id.includes(qv)||c.title.toLowerCase().includes(qv)).map(c=>({g:'Controls',l:c.id,s:c.type,p:'controls/'+c.id})):[];
    const orgs=qv?api.orgs().items.filter(o=>o.org.includes(qv)).map(o=>({g:'Orgs',l:o.org,s:fmtN(o.tracked)+' tracked',p:'orgs/'+o.org})):[];
    items=[...repos,...controls,...orgs];cur=0;let g='';res.innerHTML=items.length?items.map((it,i)=>`${it.g!==g?`<div class="hd">${(g=it.g)}</div>`:''}<button class="it ${i===cur?'cur':''}" data-i="${i}"><span>${esc(it.l)}</span><small>${esc(it.s)}</small></button>`).join(''):`<div class="empty">No matches.</div>`};
  inp.addEventListener('input',draw);inp.addEventListener('keydown',e=>{if(e.key==='ArrowDown'){cur=Math.min(items.length-1,cur+1)}else if(e.key==='ArrowUp'){cur=Math.max(0,cur-1)}else if(e.key==='Enter'){if(items[cur]){go(items[cur].p);closePop()}return}else if(e.key==='Escape'){closePop();return}else return;res.querySelectorAll('.it').forEach((b,i)=>b.classList.toggle('cur',i===cur));e.preventDefault()});
  res.addEventListener('click',e=>{const b=e.target.closest('[data-i]');if(b){go(items[+b.dataset.i].p);closePop()}});draw();inp.focus();
}
document.addEventListener('click',e=>{
  const row=e.target.closest('[data-go]');if(row&&!e.target.closest('a,button,input,select')){const [p,qs]=row.dataset.go.split('?');go(p,Object.fromEntries(new URLSearchParams(qs||'')));return}
  const b=e.target.closest('[data-act]');if(!b||b.matches('input,select'))return;const act=b.dataset.act;const {parts,q}=route();
  if(act==='range')go(parts.join('/'),Object.assign({},q,{days:b.dataset.days}));
  else if(act==='series')go(parts.join('/'),Object.assign({},q,{series:b.dataset.series}));
  else if(act==='tab')go('orgs',Object.assign({},q,{tab:b.dataset.tab}));
  else if(act==='rtab')go(parts.join('/'),Object.assign({},q,{tab:b.dataset.tab}));
  else if(act==='pstate')go('repositories',Object.assign({},q,{state:b.dataset.state}));
  else if(act==='sort')go('findings',Object.assign({},q,{sort:(q.sort||'since_asc')==='since_asc'?'since_desc':'since_asc'}));
  else if(act==='gg'){state.gg[b.dataset.org]=state.gg[b.dataset.org]===false;render()}
  else if(act==='ggall'){const collapse=!Object.values(state.gg).some(v=>v===false);ORGS.forEach(o=>state.gg[o.org]=!collapse);render()}
  else if(act==='open')go('findings',Object.assign({},q,{open:b.dataset.open}));
  else if(act==='ropen')go('remediations',Object.assign({},q,{open:b.dataset.open}));
  else if(act==='rview')go('remediations',Object.assign({},q,{view:b.dataset.view,open:''}));
  else if(act==='table'){const c=document.getElementById(b.dataset.target);c.classList.toggle('table-view');b.setAttribute('aria-pressed',c.classList.contains('table-view'))}
  else if(act==='export'){const x=state.exports[b.dataset.export];if(x)downloadCSV(x.name,x.header,x.rows)}
  else if(act==='evaluate'){b.disabled=true;b.textContent='Requested';toast('POST /repositories/{id}/evaluate → 202 Accepted')}
  else if(act==='pop')openPop(b,b.dataset.pop);
  else if(act==='palette')openPalette();
  else if(act==='mock-remediate'){localStorage.setItem('rg.mock.remediate',remediationOn()?'off':'on');render()}
  else if(act==='tz'){localStorage.setItem('rg.tz',tz()==='utc'?'local':'utc');render()}
  else if(act==='toast')toast('Mockup: this action is not wired.');
});
document.addEventListener('change',e=>{const t=e.target;const {q}=route();
  if(t.matches('[data-act="control-pick"]'))go('history',Object.assign({},q,{control:t.value}));
  else if(t.matches('[data-act="type-pick"]'))go('controls',Object.assign({},q,{type:t.value}));
  else if(t.matches('[data-act="repo-search"]'))go('repositories',Object.assign({},q,{q:t.value}));
  else if(t.matches('[data-act="org-search"]'))go('orgs',Object.assign({},q,{q:t.value}));
});
document.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openPalette()}else if(e.key==='Escape'){if(state.pop||document.querySelector('.pal'))closePop();else if(route().q.open)go(route().parts[0]==='remediations'?'remediations':'findings',Object.assign({},route().q,{open:''}))}else if(e.key==='Enter'&&e.target.matches('tr[data-act="open"],tr[data-act="ropen"]'))e.target.click()});
render();
})();
</script>
