suite: secret-scoping
# DESIGN-0026 § Chart 2.0.0: each role holds only the credentials its
# work needs. Every absence below is a security property, not a detail.
templates:
  - templates/deployment.yaml
release:
  name: rg
set:
  config:
    appId: "12345"
  secrets:
    webhookSecret: "test-secret"
    privateKey: "test-key"
  temporal:
    address: temporal:7233
    tls:
      existingSecret: temporal-mtls
  policy:
    config: "guardian {}"
  api:
    enabled: true
    auth:
      issuer: https://idp.example.com
    roDsn:
      existingSecret: ro-dsn
tests:
  - it: gives the App key to the worker, not the webhook secret
    documentSelector: {path: metadata.name, value: rg-repo-guardian-worker}
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: GITHUB_APP_ID}
          any: true
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: GITHUB_PRIVATE_KEY_PATH}
          any: true
      - contains:
          path: spec.template.spec.volumes
          content: {name: github-private-key}
          any: true
      - notContains:
          path: spec.template.spec.containers[0].env
          content: {name: GITHUB_WEBHOOK_SECRET}
          any: true
      - contains:
          path: spec.template.spec.volumes
          content: {name: temporal-tls}
          any: true

  - it: gives the worker the key as env when not mounted as a file
    set:
      secrets:
        privateKeyAsFile: false
    documentSelector: {path: metadata.name, value: rg-repo-guardian-worker}
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: GITHUB_PRIVATE_KEY}
          any: true
      - notContains:
          path: spec.template.spec.containers[0].env
          content: {name: GITHUB_PRIVATE_KEY_PATH}
          any: true

  - it: keeps the App key and database off ingest
    documentSelector: {path: metadata.name, value: rg-repo-guardian-ingest}
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: GITHUB_WEBHOOK_SECRET}
          any: true
      - notContains:
          path: spec.template.spec.containers[0].env
          content: {name: GITHUB_PRIVATE_KEY}
          any: true
      - notContains:
          path: spec.template.spec.containers[0].env
          content: {name: GITHUB_PRIVATE_KEY_PATH}
          any: true
      - notContains:
          path: spec.template.spec.containers[0].env
          content: {name: GITHUB_APP_ID}
          any: true
      - notContains:
          path: spec.template.spec.containers[0].env
          content: {name: STORE_DSN}
          any: true
      - notContains:
          path: spec.template.spec.volumes
          content: {name: github-private-key}
          any: true
      - contains:
          path: spec.template.spec.volumes
          content: {name: temporal-tls}
          any: true

  - it: keeps the App key env off ingest when not mounted as a file
    set:
      secrets:
        privateKeyAsFile: false
    documentSelector: {path: metadata.name, value: rg-repo-guardian-ingest}
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content: {name: GITHUB_PRIVATE_KEY}
          any: true

  - it: gives api neither the App key, the webhook secret nor Temporal
    documentSelector: {path: metadata.name, value: rg-repo-guardian-api}
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content: {name: GITHUB_PRIVATE_KEY}
          any: true
      - notContains:
          path: spec.template.spec.containers[0].env
          content: {name: GITHUB_PRIVATE_KEY_PATH}
          any: true
      - notContains:
          path: spec.template.spec.containers[0].env
          content: {name: GITHUB_APP_ID}
          any: true
      - notContains:
          path: spec.template.spec.containers[0].env
          content: {name: GITHUB_WEBHOOK_SECRET}
          any: true
      - notContains:
          path: spec.template.spec.containers[0].env
          content: {name: STORE_DSN}
          any: true
      - notContains:
          path: spec.template.spec.containers[0].env
          content: {name: TEMPORAL_ADDRESS}
          any: true
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: STORE_RO_DSN}
          any: true
      - notContains:
          path: spec.template.spec.volumes
          content: {name: github-private-key}
          any: true
      - notContains:
          path: spec.template.spec.volumes
          content: {name: temporal-tls}
          any: true

  - it: gives all every credential
    set:
      topology: all
    documentSelector: {path: metadata.name, value: rg-repo-guardian-all}
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: GITHUB_APP_ID}
          any: true
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: GITHUB_PRIVATE_KEY_PATH}
          any: true
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: GITHUB_WEBHOOK_SECRET}
          any: true
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: STORE_DSN}
          any: true
      - contains:
          path: spec.template.spec.volumes
          content: {name: temporal-tls}
          any: true
