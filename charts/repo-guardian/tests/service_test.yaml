suite: service
# Document 0 is the webhook Service (ingest in split, all in all). The
# per-role Services are covered by topology_test.yaml.
templates:
  - templates/service.yaml
tests:
  - it: should create a ClusterIP service by default
    documentIndex: 0
    asserts:
      - equal:
          path: spec.type
          value: ClusterIP

  - it: should expose http and metrics ports
    documentIndex: 0
    asserts:
      - contains:
          path: spec.ports
          content:
            port: 80
            targetPort: http
            protocol: TCP
            name: http
      - contains:
          path: spec.ports
          content:
            port: 9090
            targetPort: metrics
            protocol: TCP
            name: metrics

  - it: should use custom ports when set
    set:
      service:
        httpPort: 8080
        metricsPort: 9191
    documentIndex: 0
    asserts:
      - contains:
          path: spec.ports
          content:
            port: 8080
            targetPort: http
            protocol: TCP
            name: http
      - contains:
          path: spec.ports
          content:
            port: 9191
            targetPort: metrics
            protocol: TCP
            name: metrics

  - it: should use selector labels
    documentIndex: 0
    asserts:
      - isSubset:
          path: spec.selector
          content:
            app.kubernetes.io/name: repo-guardian
            app.kubernetes.io/instance: RELEASE-NAME
