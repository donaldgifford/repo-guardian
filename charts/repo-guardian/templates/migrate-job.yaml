{{- if .Values.migrate.enabled }}
# `repo-guardian migrate` as a Helm hook (IMPL-0025 Phase 7): applies the
# v2 goose migrations, and on an adopted v1 database the one-time
# backfill. before-hook-creation replaces a failed Job on the next
# attempt; hook-succeeded removes a finished one.
#
# NOTE: post-install, not pre-install: a pre-install hook runs before the
# release's own resources exist, so with baked Postgres (or a
# chart-rendered store Secret) it would have nothing to connect to. On a
# first install the worker retries until the schema lands; there is no
# v1 data to backfill. Upgrades migrate before the new pods roll.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "repo-guardian.fullname" . }}-migrate
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "repo-guardian.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrate
  annotations:
    helm.sh/hook: post-install,pre-upgrade
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
    helm.sh/hook-weight: "0"
spec:
  backoffLimit: {{ .Values.migrate.backoffLimit }}
  {{- with .Values.migrate.activeDeadlineSeconds }}
  activeDeadlineSeconds: {{ . }}
  {{- end }}
  template:
    metadata:
      labels:
        {{- include "repo-guardian.labels" . | nindent 8 }}
        app.kubernetes.io/component: migrate
    spec:
      restartPolicy: Never
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "repo-guardian.serviceAccountName" . }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: migrate
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["migrate"]
          env:
            {{- include "repo-guardian.storeDSNEnv" . | nindent 12 }}
            - name: RECONCILE_FRESHNESS
              value: {{ .Values.migrate.freshness | quote }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.migrate.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
{{- end }}
