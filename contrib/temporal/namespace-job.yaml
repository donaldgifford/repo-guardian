# One-shot namespace registration (DESIGN-0026 OQ10). Idempotent: an
# existing namespace is left alone. Apply after the chart is up:
#
#   kubectl -n temporal apply -f namespace-job.yaml
#
# It connects through the internal frontend with the internode
# certificate (temporal-internode-tls), because the external frontend
# now requires a JWT with admin rights and this Job holds none
# (DESIGN-0028 OQ7). The internal frontend skips the authorizer, and
# networkpolicy.yaml keeps it reachable only from the temporal namespace.
apiVersion: batch/v1
kind: Job
metadata:
  name: temporal-namespace-repo-guardian
  namespace: temporal
  labels:
    app.kubernetes.io/name: temporal
    app.kubernetes.io/component: namespace-setup
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: temporal
        app.kubernetes.io/component: namespace-setup
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: admintools
          image: temporalio/admin-tools:1.32.0
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              if temporal operator namespace describe --namespace repo-guardian >/dev/null 2>&1; then
                echo "namespace repo-guardian exists; nothing to do"
              else
                temporal operator namespace create --namespace repo-guardian --retention 7d
              fi
          env:
            - name: TEMPORAL_ADDRESS
              value: temporal-internal-frontend.temporal.svc:7236
            - name: TEMPORAL_TLS_CERT
              value: /etc/temporal/tls/tls.crt
            - name: TEMPORAL_TLS_KEY
              value: /etc/temporal/tls/tls.key
            - name: TEMPORAL_TLS_CA
              value: /etc/temporal/tls/ca.crt
            - name: TEMPORAL_TLS_SERVER_NAME
              value: temporal-internode
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tls
              mountPath: /etc/temporal/tls
              readOnly: true
      volumes:
        - name: tls
          secret:
            secretName: temporal-internode-tls
