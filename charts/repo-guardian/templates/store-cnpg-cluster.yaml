{{- if and (eq .Values.store.backend "postgres") (eq .Values.store.postgres.mode "cnpg") -}}
---
# CloudNativePG Cluster CR. Requires the cloudnative-pg operator
# already installed in the cluster. CNPG creates a `<name>-app`
# Secret holding the DSN under the `uri` key, which the
# repo-guardian Deployment references.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: {{ include "repo-guardian.postgresFullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "repo-guardian.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  instances: {{ .Values.store.postgres.cnpg.instances }}
  imageName: {{ .Values.store.postgres.cnpg.imageName | quote }}
  primaryUpdateStrategy: unsupervised
  bootstrap:
    initdb:
      database: repoguardian
      owner: repoguardian
  {{- if or (include "repo-guardian.needsRORole" .) (include "repo-guardian.controlsProvisioned" .) }}
  managed:
    roles:
      {{- if include "repo-guardian.needsRORole" . }}
      # The api role's read-only login. pg_read_all_data grants SELECT on
      # every table, including ones later migrations add, without depending
      # on whether this role existed when the migration ran.
      - name: repoguardian_ro
        ensure: present
        login: true
        inRoles: [pg_read_all_data]
        passwordSecret:
          name: {{ include "repo-guardian.postgresFullname" . }}-ro
      {{- end }}
      {{- if include "repo-guardian.controlsProvisioned" . }}
      # The controls application roles (DESIGN-0032 D31). The controls
      # chain grants to them; the cluster's owner runs it.
      - name: rg_evaluator
        ensure: present
        login: true
        passwordSecret:
          name: {{ include "repo-guardian.postgresFullname" . }}-rg-evaluator
      - name: rg_remediator
        ensure: present
        login: true
        passwordSecret:
          name: {{ include "repo-guardian.postgresFullname" . }}-rg-remediator
      - name: rg_all
        ensure: present
        login: true
        inRoles: [rg_evaluator, rg_remediator]
        passwordSecret:
          name: {{ include "repo-guardian.postgresFullname" . }}-rg-all
      {{- end }}
  {{- end }}
  storage:
    size: {{ .Values.store.postgres.cnpg.storage.size }}
    {{- with .Values.store.postgres.cnpg.storage.storageClass }}
    storageClass: {{ . | quote }}
    {{- end }}
  monitoring:
    enablePodMonitor: {{ .Values.serviceMonitor.enabled }}
{{- end }}
