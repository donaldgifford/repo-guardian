---
suite: backend deployment shapes (IMPL-0011 P6 / IMPL-0016 update)
templates:
  - templates/deployment.yaml
  - templates/store-postgres.yaml
  - templates/store-postgres-secret.yaml
  - templates/store-cnpg-cluster.yaml
  - templates/store-cnpg-pooler.yaml
  - templates/queue-valkey.yaml
  - templates/queue-valkey-secret.yaml

set:
  config:
    appId: "12345"
  secrets:
    webhookSecret: "x"
    privateKey: "x"

tests:
  - it: chart with no backend values set produces baked Postgres + baked Valkey resources
    # Codifies the IMPL-0016 default. A fresh `helm install` with no
    # values overrides renders the StatefulSets out-of-the-box.
    asserts:
      - equal:
          path: kind
          value: StatefulSet
        template: templates/store-postgres.yaml
        documentIndex: 0
      - equal:
          path: kind
          value: StatefulSet
        template: templates/queue-valkey.yaml
        documentIndex: 0
      - equal:
          path: kind
          value: Secret
        template: templates/store-postgres-secret.yaml
      - equal:
          path: kind
          value: Secret
        template: templates/queue-valkey-secret.yaml

  - it: baked shape renders Postgres + Valkey StatefulSets, Services, and Secrets
    set:
      store.backend: postgres
      store.postgres.mode: baked
      queue.backend: valkey
      queue.valkey.mode: baked
      scheduler.backend: valkey
    asserts:
      - equal:
          path: kind
          value: StatefulSet
        template: templates/store-postgres.yaml
        documentIndex: 0
      - equal:
          path: kind
          value: Service
        template: templates/store-postgres.yaml
        documentIndex: 1
      - equal:
          path: kind
          value: Secret
        template: templates/store-postgres-secret.yaml
      - equal:
          path: kind
          value: StatefulSet
        template: templates/queue-valkey.yaml
        documentIndex: 0
      - equal:
          path: kind
          value: Service
        template: templates/queue-valkey.yaml
        documentIndex: 1
      - equal:
          path: kind
          value: Secret
        template: templates/queue-valkey-secret.yaml

  - it: cnpg shape renders the Cluster CR but no baked Postgres StatefulSet
    set:
      store.backend: postgres
      store.postgres.mode: cnpg
      queue.backend: valkey
      queue.valkey.mode: baked
      scheduler.backend: valkey
    asserts:
      - equal:
          path: kind
          value: Cluster
        template: templates/store-cnpg-cluster.yaml
      - hasDocuments:
          count: 0
        template: templates/store-postgres.yaml
      - hasDocuments:
          count: 0
        template: templates/store-postgres-secret.yaml
      - hasDocuments:
          count: 0
        template: templates/store-cnpg-pooler.yaml

  - it: cnpg pooler renders when enabled
    set:
      store.backend: postgres
      store.postgres.mode: cnpg
      store.postgres.cnpg.pooler.enabled: true
      queue.backend: valkey
      queue.valkey.mode: baked
      scheduler.backend: valkey
    asserts:
      - equal:
          path: kind
          value: Pooler
        template: templates/store-cnpg-pooler.yaml

  - it: external shape adds no backing services
    set:
      store.backend: postgres
      store.postgres.mode: external
      store.postgres.existingSecret: my-existing-secret
      queue.backend: valkey
      queue.valkey.mode: external
      queue.valkey.existingSecret: my-existing-valkey
      scheduler.backend: valkey
    asserts:
      - equal:
          path: kind
          value: Deployment
        template: templates/deployment.yaml
      - hasDocuments:
          count: 0
        template: templates/store-postgres.yaml
      - hasDocuments:
          count: 0
        template: templates/store-postgres-secret.yaml
      - hasDocuments:
          count: 0
        template: templates/queue-valkey.yaml
      - hasDocuments:
          count: 0
        template: templates/queue-valkey-secret.yaml

  - it: postgres backend injects STORE_DSN env var sourced from chart-rendered secret
    set:
      store.backend: postgres
      store.postgres.mode: baked
      queue.backend: valkey
      queue.valkey.mode: baked
      scheduler.backend: valkey
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: STORE_BACKEND
            value: postgres
        template: templates/deployment.yaml
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: STORE_DSN
            valueFrom:
              secretKeyRef:
                name: RELEASE-NAME-repo-guardian-postgres
                key: STORE_DSN
        template: templates/deployment.yaml

  - it: cnpg mode points STORE_DSN at the cnpg <name>-app secret with key=uri
    set:
      store.backend: postgres
      store.postgres.mode: cnpg
      queue.backend: valkey
      queue.valkey.mode: baked
      scheduler.backend: valkey
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: STORE_DSN
            valueFrom:
              secretKeyRef:
                name: RELEASE-NAME-repo-guardian-postgres-app
                key: uri
        template: templates/deployment.yaml

  - it: termination grace period set to 60s for SIGTERM nack
    set:
      store.backend: postgres
      store.postgres.mode: baked
      queue.backend: valkey
      queue.valkey.mode: baked
      scheduler.backend: valkey
    asserts:
      - equal:
          path: spec.template.spec.terminationGracePeriodSeconds
          value: 60
        template: templates/deployment.yaml

  - it: baked Postgres and Valkey pods run as the image non-root user with fsGroup
    # Regression guard for the root-chown startup failure: both official
    # images chown their data dir when started as root, which fails on
    # clusters/storage that forbid chown. Running as uid 999 makes the
    # entrypoints skip chown; fsGroup 999 keeps the PVC writable.
    asserts:
      - equal:
          path: spec.template.spec.securityContext.runAsUser
          value: 999
        template: templates/store-postgres.yaml
        documentIndex: 0
      - equal:
          path: spec.template.spec.securityContext.fsGroup
          value: 999
        template: templates/store-postgres.yaml
        documentIndex: 0
      - equal:
          path: spec.template.spec.securityContext.runAsNonRoot
          value: true
        template: templates/store-postgres.yaml
        documentIndex: 0
      - equal:
          path: spec.template.spec.securityContext.runAsUser
          value: 999
        template: templates/queue-valkey.yaml
        documentIndex: 0
      - equal:
          path: spec.template.spec.securityContext.fsGroup
          value: 999
        template: templates/queue-valkey.yaml
        documentIndex: 0
      - equal:
          path: spec.template.spec.securityContext.runAsNonRoot
          value: true
        template: templates/queue-valkey.yaml
        documentIndex: 0

  - it: podSecurityContext can be nulled to restore the root entrypoint default
    set:
      store.postgres.baked.podSecurityContext: null
      queue.valkey.baked.podSecurityContext: null
    asserts:
      - notExists:
          path: spec.template.spec.securityContext
        template: templates/store-postgres.yaml
        documentIndex: 0
      - notExists:
          path: spec.template.spec.securityContext
        template: templates/queue-valkey.yaml
        documentIndex: 0

  - it: baked with operator-supplied password sources it externally and skips the chart Secret
    # GitOps-safe path (fix for the lookup-under-helm-template password
    # rotation): no chart-generated password Secret, StatefulSet + app
    # both read the operator's Secret, DSN assembled at runtime.
    set:
      store.postgres.baked.existingSecret: my-pg-secret
      queue.valkey.baked.existingSecret: my-vk-secret
    release:
      namespace: rg-ns
    asserts:
      - hasDocuments:
          count: 0
        template: templates/store-postgres-secret.yaml
      - hasDocuments:
          count: 0
        template: templates/queue-valkey-secret.yaml
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: POSTGRES_USER
            value: repoguardian
        template: templates/store-postgres.yaml
        documentIndex: 0
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: POSTGRES_PASSWORD
            valueFrom:
              secretKeyRef:
                name: my-pg-secret
                key: POSTGRES_PASSWORD
        template: templates/store-postgres.yaml
        documentIndex: 0
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: VALKEY_PASSWORD
            valueFrom:
              secretKeyRef:
                name: my-vk-secret
                key: VALKEY_PASSWORD
        template: templates/queue-valkey.yaml
        documentIndex: 0
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: STORE_DSN
            value: "postgres://repoguardian:$(POSTGRES_PASSWORD)@RELEASE-NAME-repo-guardian-postgres.rg-ns.svc.cluster.local:5432/repoguardian?sslmode=disable"
        template: templates/deployment.yaml
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: QUEUE_VALKEY_DSN
            value: "redis://:$(VALKEY_PASSWORD)@RELEASE-NAME-repo-guardian-valkey.rg-ns.svc.cluster.local:6379/0"
        template: templates/deployment.yaml

  - it: baked existingSecretKey overrides the default password key
    set:
      store.postgres.baked.existingSecret: my-pg-secret
      store.postgres.baked.existingSecretKey: password
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: POSTGRES_PASSWORD
            valueFrom:
              secretKeyRef:
                name: my-pg-secret
                key: password
        template: templates/store-postgres.yaml
        documentIndex: 0

  # Schema rejection lives in values.schema.json; helm-unittest can't
  # easily exercise it because the plugin doesn't surface
  # schema-validation errors as catchable failures. Schema rejection
  # is exercised manually via `helm template ... --set
  # store.backend=memory` and documented in the chart README under
  # "Schema validation". See values.schema.json itself for the
  # locked enum.
