{{- include "repo-guardian.validateTemplatingVars" . -}}
{{- include "repo-guardian.validateBackendSecrets" . -}}
{{- include "repo-guardian.validateRemovedValues" . -}}
{{- include "repo-guardian.validateRoles" . -}}
{{- range $role := splitList " " (include "repo-guardian.roles" .) }}
{{- $r := dict "ctx" $ "role" $role }}
{{- $v := $.Values }}
{{- $roleValues := index $v $role | default dict }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "repo-guardian.roleFullname" $r }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "repo-guardian.roleLabels" $r | nindent 4 }}
spec:
  {{- if eq $role "all" }}
  replicas: {{ $v.replicaCount }}
  {{- else if not (and (eq $role "worker") $v.worker.keda.enabled) }}
  replicas: {{ $roleValues.replicas }}
  {{- end }}
  revisionHistoryLimit: {{ $v.revisionHistoryLimit }}
  selector:
    matchLabels:
      {{- include "repo-guardian.roleSelectorLabels" $r | nindent 6 }}
  template:
    metadata:
      annotations:
        {{- if include "repo-guardian.roleReadsPolicy" $r }}
        {{- /* Hashed from values, not the rendered ConfigMaps, so a role
        rolls on a policy or template edit. An existingConfigMap is the
        operator's to roll. */}}
        checksum/policy: {{ toYaml (pick $v.policy "config" "existingConfigMap") | sha256sum }}
        checksum/templates: {{ toYaml $v.templates | sha256sum }}
        {{- end }}
        {{- if and (include "repo-guardian.roleServesAPI" $r) $v.api.enabled $v.api.auth.enabled }}
        checksum/authz: {{ toYaml $v.api.authz | sha256sum }}
        {{- end }}
        {{- with $v.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "repo-guardian.roleLabels" $r | nindent 8 }}
        {{- with $v.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with $v.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "repo-guardian.serviceAccountName" $ }}
      terminationGracePeriodSeconds: 60
      {{- with $v.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ $.Chart.Name }}
          image: "{{ $v.image.repository }}:{{ $v.image.tag | default $.Chart.AppVersion }}"
          imagePullPolicy: {{ $v.image.pullPolicy }}
          {{- with $v.command }}
          command:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          args: [{{ $role | quote }}]
          ports:
            - containerPort: {{ $v.config.port }}
              name: http
              protocol: TCP
            - containerPort: {{ $v.config.metricsPort }}
              name: metrics
              protocol: TCP
            {{- if eq $role "all" }}
            - containerPort: {{ $v.api.port }}
              name: api
              protocol: TCP
            {{- end }}
          env:
            - name: LISTEN_ADDR
              value: ":{{ $v.config.port }}"
            - name: METRICS_ADDR
              value: ":{{ $v.config.metricsPort }}"
            - name: LOG_LEVEL
              value: {{ $v.config.logLevel | quote }}
            {{- if include "repo-guardian.roleDialsTemporal" $r }}
            {{- include "repo-guardian.temporalEnv" $ | nindent 12 }}
            {{- end }}
            {{- if include "repo-guardian.roleHasWebhookSecret" $r }}
            - name: GITHUB_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "repo-guardian.secretName" $ }}
                  key: webhook-secret
            {{- end }}
            {{- if include "repo-guardian.roleHasAppKey" $r }}
            - name: GITHUB_APP_ID
              valueFrom:
                secretKeyRef:
                  name: {{ include "repo-guardian.secretName" $ }}
                  key: app-id
            {{- if $v.secrets.privateKeyAsFile }}
            - name: GITHUB_PRIVATE_KEY_PATH
              value: /etc/repo-guardian/private-key/private-key.pem
            {{- else }}
            - name: GITHUB_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "repo-guardian.secretName" $ }}
                  key: private-key
            {{- end }}
            {{- end }}
            {{- if include "repo-guardian.roleReadsPolicy" $r }}
            - name: DRY_RUN
              value: {{ $v.config.dryRun | quote }}
            - name: SKIP_FORKS
              value: {{ $v.config.skipForks | quote }}
            - name: SKIP_ARCHIVED
              value: {{ $v.config.skipArchived | quote }}
            - name: AUTO_CLOSE_PR
              value: {{ $v.policy.autoClosePR | quote }}
            - name: ORPHAN_CLEANUP
              value: {{ $v.policy.orphanCleanup | quote }}
            - name: TEMPLATE_DIR
              value: /etc/repo-guardian/templates
            {{- if include "repo-guardian.hasPolicy" $ }}
            - name: GUARDIAN_CONFIG
              value: /etc/repo-guardian/policy/guardian.hcl
            {{- end }}
            {{- if $v.templating.strict }}
            - name: STRICT_TEMPLATES
              value: "true"
            {{- end }}
            {{- end }}
            {{- if include "repo-guardian.roleHasStore" $r }}
            - name: WORKER_ACTIVITY_CONCURRENCY
              value: {{ $v.worker.concurrency | quote }}
            - name: CHECK_INTERVAL
              value: {{ $v.checkInterval | quote }}
            - name: POLICY_ROLLOUT_WINDOW
              value: {{ $v.policyRolloutWindow | quote }}
            - name: CHECKS_RETENTION
              value: {{ $v.checksRetention | quote }}
            - name: DISCOVERY_ENABLED
              value: {{ $v.discovery.enabled | quote }}
            - name: DISCOVERY_INTERVAL
              value: {{ $v.discovery.interval | quote }}
            - name: COMPLIANCE_SNAPSHOT_INTERVAL
              value: {{ $v.posture.snapshotInterval | quote }}
            - name: STORE_POSTGRES_MAX_CONNS
              value: {{ $v.store.postgres.maxConns | quote }}
            {{- include "repo-guardian.storeDSNEnv" $ | nindent 12 }}
            {{- end }}
            {{- if include "repo-guardian.roleServesAPI" $r }}
            {{- include "repo-guardian.apiEnv" $r | nindent 12 }}
            {{- end }}
            {{- if include "repo-guardian.roleReadsPolicy" $r }}
            {{- range $k, $val := $v.templating.vars }}
            - name: {{ $k }}
              value: {{ $val | quote }}
            {{- end }}
            {{- end }}
            {{- with $v.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          volumeMounts:
            {{- if and (include "repo-guardian.roleHasAppKey" $r) $v.secrets.privateKeyAsFile }}
            - name: github-private-key
              mountPath: /etc/repo-guardian/private-key
              readOnly: true
            {{- end }}
            {{- if and (include "repo-guardian.roleDialsTemporal" $r) $v.temporal.tls.existingSecret }}
            - name: temporal-tls
              mountPath: /etc/repo-guardian/temporal-tls
              readOnly: true
            {{- end }}
            {{- if include "repo-guardian.roleReadsPolicy" $r }}
            - name: templates
              mountPath: /etc/repo-guardian/templates
              readOnly: true
            {{- if include "repo-guardian.hasPolicy" $ }}
            - name: policy
              mountPath: /etc/repo-guardian/policy
              readOnly: true
            {{- end }}
            {{- end }}
            {{- if and (include "repo-guardian.roleServesAPI" $r) $v.api.enabled $v.api.auth.enabled }}
            - name: authz
              mountPath: /etc/repo-guardian/authz
              readOnly: true
            {{- end }}
            {{- with $v.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with $v.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with ($roleValues.resources | default $v.resources) }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $v.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $v.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        {{- if and (include "repo-guardian.roleHasAppKey" $r) $v.secrets.privateKeyAsFile }}
        - name: github-private-key
          secret:
            secretName: {{ include "repo-guardian.secretName" $ }}
            items:
              - key: private-key
                path: private-key.pem
        {{- end }}
        {{- if and (include "repo-guardian.roleDialsTemporal" $r) $v.temporal.tls.existingSecret }}
        - name: temporal-tls
          secret:
            secretName: {{ $v.temporal.tls.existingSecret }}
        {{- end }}
        {{- if include "repo-guardian.roleReadsPolicy" $r }}
        - name: templates
          configMap:
            name: {{ $v.templates.existingConfigMap | default (printf "%s-templates" (include "repo-guardian.fullname" $)) }}
        {{- if include "repo-guardian.hasPolicy" $ }}
        - name: policy
          configMap:
            name: {{ $v.policy.existingConfigMap | default (printf "%s-policy" (include "repo-guardian.fullname" $)) }}
        {{- end }}
        {{- end }}
        {{- if and (include "repo-guardian.roleServesAPI" $r) $v.api.enabled $v.api.auth.enabled }}
        - name: authz
          configMap:
            name: {{ include "repo-guardian.fullname" $ }}-authz
        {{- end }}
        {{- with $v.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with $v.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $v.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $v.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
