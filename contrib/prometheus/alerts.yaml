# Prometheus alerting rules for repo-guardian.
#
# Usage:
#   Add this file to your Prometheus rule_files configuration:
#
#   rule_files:
#     - /etc/prometheus/rules/repo-guardian-alerts.yaml
#
#   Or if using the Prometheus Operator, create a PrometheusRule resource:
#
#   apiVersion: monitoring.coreos.com/v1
#   kind: PrometheusRule
#   metadata:
#     name: repo-guardian
#     namespace: platform-tools
#     labels:
#       release: kube-prometheus-stack   # match your Prometheus selector
#   spec:
#     groups:
#       <paste the groups below here>

groups:
  - name: repo-guardian
    rules:
      # -------------------------------------------------------------------
      # Availability
      # -------------------------------------------------------------------

      # The service has not checked any repositories in the last 2 hours.
      # During normal operation the scheduler or webhooks should produce
      # a steady stream of checks. A gap suggests the pod is down, the
      # queue is stuck, or no webhooks are arriving.
      #
      # Note: repos_checked_total carries [trigger, org] labels, so we
      # sum without those to evaluate the global rate.
      - alert: RepoGuardianNoRepoChecks
        expr: |
          sum(increase(repo_guardian_repos_checked_total[2h])) == 0
        for: 30m
        labels:
          severity: warning
          service: repo-guardian
        annotations:
          summary: "No repositories checked in the last 2 hours"
          description: >-
            repo-guardian has not processed any repository checks in the
            last 2 hours. Verify the pod is running, the work queue is
            not stuck, and GitHub webhooks are being delivered.

      # -------------------------------------------------------------------
      # Error rate
      # -------------------------------------------------------------------

      # The error rate exceeds 10% of total checks over the last 15 minutes.
      - alert: RepoGuardianHighErrorRate
        expr: |
          (
            sum(rate(repo_guardian_errors_total[15m]))
            /
            clamp_min(sum(rate(repo_guardian_repos_checked_total[15m])), 1)
          ) > 0.10
        for: 10m
        labels:
          severity: warning
          service: repo-guardian
        annotations:
          summary: "Error rate above 10%"
          description: >-
            More than 10% of repo-guardian operations are failing.
            Check the repo_guardian_errors_total metric by operation
            label to identify the failing component.

      # Sustained errors with no successful checks. This typically means
      # the GitHub App credentials are invalid or the API is unreachable.
      - alert: RepoGuardianAllChecksFailing
        expr: |
          (
            sum(rate(repo_guardian_errors_total[30m])) > 0
            and
            sum(rate(repo_guardian_repos_checked_total[30m])) == 0
          )
        for: 15m
        labels:
          severity: critical
          service: repo-guardian
        annotations:
          summary: "All repository checks are failing"
          description: >-
            repo-guardian is producing errors but has not completed a
            single successful check in 30 minutes. This often indicates
            invalid GitHub App credentials, an expired private key, or
            GitHub API connectivity issues.

      # -------------------------------------------------------------------
      # GitHub API rate limiting
      # -------------------------------------------------------------------

      # Remaining API quota has dropped below 500.
      - alert: RepoGuardianRateLimitLow
        expr: |
          repo_guardian_github_rate_remaining < 500
        for: 5m
        labels:
          severity: warning
          service: repo-guardian
        annotations:
          summary: "GitHub API rate limit running low"
          description: >-
            The GitHub API rate limit remaining is {{ $value }}. The
            service will begin pre-emptive throttling. If quota reaches
            zero, all checks will stall until the rate limit resets.

      # Jobs are being deferred into the delayed set because GitHub
      # rate limits are near exhaustion (IMPL-0022 — re-pointed from
      # the removed github_rate_limit_waits_total; the transport no
      # longer sleeps, it defers whole jobs). Deferrals are per-JOB,
      # not per-request, so rates run orders of magnitude lower than
      # the old wait counter — hence a count-based threshold. The 1h
      # window covers the re-deferral cadence: a genuinely throttled
      # tenant re-defers each reset window (up to 1h apart), which a
      # shorter window would see as flapping and never hold through
      # `for` (INV-0012 finding C).
      - alert: RepoGuardianRateLimitThrottling
        expr: |
          sum(increase(repo_guardian_queue_delayed_total{reason="rate_limit"}[1h])) > 10
        for: 30m
        labels:
          severity: warning
          service: repo-guardian
        annotations:
          summary: "Service is being rate-limited by GitHub"
          description: >-
            repo-guardian has deferred more than 10 jobs in the last
            hour because installation rate limits were near
            exhaustion. Deferred jobs self-reschedule after the reset
            window, so this is backpressure working — but a sustained
            rate means check volume exceeds the API budget. Break down
            queue_delayed_total by installation_id to find the tenant;
            tune the threshold to fleet size. See
            docs/operations/scaling.md §Delayed requeue.

      # -------------------------------------------------------------------
      # Check latency
      # -------------------------------------------------------------------

      # P99 check duration exceeds 30 seconds. Individual repo checks
      # should normally complete in a few seconds.
      - alert: RepoGuardianSlowChecks
        expr: |
          histogram_quantile(0.99, sum(rate(repo_guardian_check_duration_seconds_bucket[15m])) by (le)) > 30
        for: 15m
        labels:
          severity: warning
          service: repo-guardian
        annotations:
          summary: "Repository checks are slow (p99 > 30s)"
          description: >-
            The 99th percentile check duration is {{ $value | humanizeDuration }}.
            This may indicate GitHub API latency or rate limit back-off.

      # -------------------------------------------------------------------
      # Webhook delivery
      # -------------------------------------------------------------------

      # No webhooks received in 24 hours. During normal org activity,
      # at least some webhook events (pushes, PRs, etc.) should arrive.
      # A complete gap usually means the webhook URL is misconfigured or
      # the ingress is down.
      - alert: RepoGuardianNoWebhooks
        expr: |
          increase(repo_guardian_webhook_received_total[24h]) == 0
        for: 1h
        labels:
          severity: warning
          service: repo-guardian
        annotations:
          summary: "No webhooks received in 24 hours"
          description: >-
            repo-guardian has not received any GitHub webhook events in
            the last 24 hours. Verify the webhook URL is correctly
            configured in the GitHub App settings and that the ingress
            or load balancer is routing traffic to the service.

      # -------------------------------------------------------------------
      # Custom properties
      # -------------------------------------------------------------------

      # A burst of properties PRs may indicate a misconfiguration or an
      # unintended reconciliation. Similar to the file-rule PR burst alert.
      - alert: RepoGuardianPropertiesPRBurst
        expr: |
          increase(repo_guardian_properties_prs_created_total[1h]) > 50
        for: 5m
        labels:
          severity: warning
          service: repo-guardian
        annotations:
          summary: "Unusually high number of properties PRs created"
          description: >-
            repo-guardian created {{ $value }} custom properties PRs in
            the last hour. This may be expected during initial rollout
            of CUSTOM_PROPERTIES_MODE, but could also indicate a
            misconfiguration. Review recent PRs and consider enabling
            DRY_RUN mode.

      # -------------------------------------------------------------------
      # PR creation
      # -------------------------------------------------------------------

      # A burst of PRs may indicate a misconfiguration or an unintended
      # reconciliation against repos that should be excluded.
      #
      # Note: prs_created_total is now a CounterVec[org]. Wrap in sum(...)
      # to preserve the prior scalar threshold semantic; replace with
      # `sum by (org) (...)` and a per-org threshold to alert per org.
      - alert: RepoGuardianPRBurst
        expr: |
          sum(increase(repo_guardian_prs_created_total[1h])) > 50
        for: 5m
        labels:
          severity: warning
          service: repo-guardian
        annotations:
          summary: "Unusually high number of PRs created"
          description: >-
            repo-guardian created {{ $value }} PRs in the last hour.
            This may be expected during initial rollout or after enabling
            a new rule, but could also indicate a misconfiguration.
            Review recent PRs and consider enabling DRY_RUN mode.

      # -------------------------------------------------------------------
      # Setting and branch protection rules
      # -------------------------------------------------------------------

      # A setting being remediated repeatedly suggests another tool (or a
      # human) is reverting the change after each reconciliation. Either
      # disable the setting rule, or fix the upstream cause.
      - alert: RepoGuardianSettingRemediationChurn
        expr: |
          sum by (rule_name, org) (
            rate(repo_guardian_settings_remediated_total[6h])
          ) > 0.01
        for: 6h
        labels:
          severity: warning
          service: repo-guardian
        annotations:
          summary: "Setting rule is being remediated repeatedly"
          description: >-
            Setting rule {{ $labels.rule_name }} in org {{ $labels.org }}
            has been remediated repeatedly over 6 hours. Another tool or
            user is likely reverting the change. Investigate the source
            of the drift before re-enabling remediation.

      # Branch protection ruleset churn — same indicator at the ruleset
      # layer.
      - alert: RepoGuardianBranchProtectionChurn
        expr: |
          sum by (rule_name, org) (
            rate(repo_guardian_branch_protection_remediated_total[6h])
          ) > 0.01
        for: 6h
        labels:
          severity: warning
          service: repo-guardian
        annotations:
          summary: "Branch protection ruleset is being remediated repeatedly"
          description: >-
            Branch protection rule {{ $labels.rule_name }} in org
            {{ $labels.org }} has been remediated repeatedly over 6 hours.
            Another tool may be overwriting the ruleset, or the
            remediation diff is non-converging.

      # -------------------------------------------------------------------
      # Webhook ingress
      # -------------------------------------------------------------------

      # Sustained webhook rejections indicate either a misconfigured
      # ingress (legitimate GitHub traffic being rejected) or scanning
      # attempts against the public endpoint.
      - alert: RepoGuardianWebhookRejectionsHigh
        expr: |
          sum by (reason) (rate(repo_guardian_webhook_rejected_total[15m])) > 0.1
        for: 30m
        labels:
          severity: warning
          service: repo-guardian
        annotations:
          summary: "Webhook requests being rejected at >0.1/s"
          description: >-
            Webhook rejection rate is {{ $value | humanize }}/s with
            reason {{ $labels.reason }}. If reason is `ip_not_allowed`,
            this may be GitHub IP range refresh lag or scanning traffic.
            If `allowlist_unavailable`, the /meta fetch is failing and
            legitimate webhooks are being dropped (fail-closed default).

      # -------------------------------------------------------------------
      # Strict-mode scope misconfiguration
      # -------------------------------------------------------------------

      # A rule is consistently producing rule-level out-of-scope events,
      # meaning it applies to no in-scope orgs. This usually indicates a
      # typo in the rule's scope.orgs list — the rule will never fire.
      #
      # Window/for shape (INV-0012): out_of_scope_total increments in
      # bursts at sweep time, so the window must outlive the gap between
      # bursts AND the `for` period. The original rate[1h] + for: 6h
      # could never fire on a weekly sweep cadence — the 1h window went
      # quiet long before the 6h pending period elapsed.
      - alert: RepoGuardianRuleNeverApplies
        expr: |
          sum by (org) (increase(repo_guardian_out_of_scope_total{level="rule"}[24h])) > 0
          and
          sum by (org) (increase(repo_guardian_files_missing_total[24h])) == 0
        for: 2h
        labels:
          severity: warning
          service: repo-guardian
        annotations:
          summary: "Rule-level scope is rejecting every evaluation"
          description: >-
            For org {{ $labels.org }}, every rule evaluation has been
            rejected by per-rule scope for 6 hours. Check guardian.hcl
            for typos in scope.orgs lists or rules whose scope no longer
            matches any in-scope org.

  # =====================================================================
  # Multi-replica / scheduler / store / queue (IMPL-0011, chart 0.5.0+)
  # =====================================================================
  # Mirrors the alert pack rendered by the Helm chart's
  # `prometheusrule.yaml`. Operators using the chart already receive
  # these; this group is for standalone deployments importing
  # contrib/prometheus/alerts.yaml directly.
  - name: repo-guardian.multi-replica
    rules:
      # Workers can't keep up — the queue is backing up. Default
      # threshold = 1000 jobs.
      - alert: RepoGuardianQueueDepthHigh
        expr: max(repo_guardian_queue_depth{queue="jobs"}) > 1000
        for: 10m
        labels:
          severity: warning
          service: repo-guardian
        annotations:
          summary: "repo-guardian queue depth above threshold"
          description: >-
            queue:jobs depth has exceeded 1000 for 10+ minutes; workers
            may be falling behind. Scale `replicaCount` or tune
            `workers.concurrency`.

      # The in-flight reaper is requeueing jobs whose ack window
      # expired. Sustained reaper activity indicates worker crashes or
      # hangs.
      - alert: RepoGuardianReaperRequeues
        expr: rate(repo_guardian_queue_reaped_total[15m]) > 0.1
        for: 15m
        labels:
          severity: warning
          service: repo-guardian
        annotations:
          summary: "repo-guardian reaper actively requeueing jobs"
          description: >-
            The in-flight reaper has been requeueing jobs for 15+
            minutes. Workers may be crashing or hanging — check pod
            logs and OOMKilled events.

      # Deferrals (rate-limit throttling) are outpacing promotion —
      # the delayed set keeps a sustained backlog (IMPL-0022). The
      # gauge is published by every pod's reaper tick (each
      # REAPER_INTERVAL, default 60s), so the series is always fresh
      # and a long `for` is safe; max() because every replica reports
      # the same ZCARD.
      - alert: RepoGuardianQueueBackpressure
        expr: max(repo_guardian_queue_delayed_depth) > 100
        for: 30m
        labels:
          severity: warning
          service: repo-guardian
        annotations:
          summary: "repo-guardian delayed-job backlog sustained"
          description: >-
            More than 100 jobs have sat parked in the delayed set for
            30+ minutes; deferrals are outpacing promotion. Check
            queue_delayed_total by installation to find the throttled
            tenant. See docs/operations/scaling.md §Delayed requeue.

      # A job hit MAX_JOB_ATTEMPTS and was dropped with a terminal
      # StatusError (IMPL-0022). Two-legged on purpose: increase()
      # cannot see a brand-new series' first increment (needs two
      # samples to diff, and birth-at-1 diffs to 0 — INV-0012 finding
      # E class). The second leg fires for any exhausted-counter
      # series younger than 1h — exactly the window the first leg is
      # blind in; once the series is older than 1h the offset sample
      # exists and `unless` retires that leg.
      - alert: RepoGuardianJobsExhausted
        expr: |
          sum(increase(repo_guardian_queue_attempts_exhausted_total[1h])) > 0
            or sum(repo_guardian_queue_attempts_exhausted_total
              unless repo_guardian_queue_attempts_exhausted_total offset 1h) > 0
        for: 5m
        labels:
          severity: warning
          service: repo-guardian
        annotations:
          summary: "repo-guardian dropped a job at the attempt cap"
          description: >-
            A job exhausted MAX_JOB_ATTEMPTS and was dropped with a
            terminal StatusError in repo_state; the next stale sweep
            retries the repo, but a sustained rate means a
            persistently failing installation. Check
            queue_attempts_exhausted_total by installation and the
            worker logs.

      # No replica holds the scheduler leader lock. Reconciliation has
      # stalled — webhooks still work, but the StaleSweeper and
      # Discoverer will not run.
      - alert: RepoGuardianNoSchedulerLeader
        expr: max(repo_guardian_scheduler_is_leader{name="sweep"}) == 0
        for: 5m
        labels:
          severity: critical
          service: repo-guardian
        annotations:
          summary: "repo-guardian sweep scheduler has no leader"
          description: >-
            No replica has held the sweep leader lock for 5+ minutes;
            reconciliation has stalled. Check Valkey connectivity and
            replica liveness.

      # The persistent-store error rate has crossed 10%. This usually
      # points at Postgres connectivity / pool exhaustion / locked rows.
      - alert: RepoGuardianStoreQueryErrors
        expr: |
          sum(rate(repo_guardian_store_query_seconds_count{outcome="error"}[5m]))
            / sum(rate(repo_guardian_store_query_seconds_count[5m]))
            > 0.1
        for: 10m
        labels:
          severity: warning
          service: repo-guardian
        annotations:
          summary: "repo-guardian store error rate elevated"
          description: >-
            {{ $value | humanizePercentage }} of store queries failed
            in the last 5 minutes. Check Postgres connectivity,
            `store.maxConns`, and slow-query logs.

      # An installation's rate-limit budget has fallen below the
      # reserve floor — the StaleSweeper's reserve gate will start
      # blocking sweeps for that installation.
      - alert: RepoGuardianRateLimitNearExhaustion
        expr: min(repo_guardian_rate_limit_remaining) < 200
        for: 5m
        labels:
          severity: warning
          service: repo-guardian
        annotations:
          summary: "repo-guardian GitHub rate-limit nearly exhausted"
          description: >-
            An installation has fewer than 200 rate-limit budget
            remaining; the reserve gate will start blocking sweeps.

  # =====================================================================
  # PR convergence (IMPL-0013)
  # =====================================================================
  - name: repo-guardian.pr-convergence
    rules:
      # At least one repo-guardian PR has been open for 30+ days
      # without converging. Most often a sign that the underlying rule
      # is in a state the auto-close path doesn't handle.
      - alert: RepoGuardianStaleOpenPRs
        expr: max(repo_guardian_open_prs_by_rule{age_bucket="30d+"}) > 0
        for: 1h
        labels:
          severity: warning
          service: repo-guardian
        annotations:
          summary: "repo-guardian PR open for 30+ days"
          description: >-
            At least one repo-guardian PR has been open for over 30 days
            without convergence. Investigate the {rule, org} pair.

      # Open repo-guardian PRs exist where every file rule is now
      # satisfied on the default branch — the INV-0005 drift surface.
      # IMPL-0013 Phase 3 auto-converges these by default; a non-zero
      # rate after Phase 3 indicates auto-close is disabled or failing.
      - alert: RepoGuardianPRDrift
        expr: sum(rate(repo_guardian_pr_open_with_empty_actionable_total[1h])) > 0
        for: 30m
        labels:
          severity: warning
          service: repo-guardian
        annotations:
          summary: "repo-guardian PR drift detected (INV-0005)"
          description: >-
            Open repo-guardian PRs exist where every file rule is now
            satisfied on the default branch. Verify `policy.autoClosePR`
            is enabled (chart) or `AUTO_CLOSE_PR=true` (env).

  # =====================================================================
  # Custom-property sync (DESIGN-0019 / IMPL-0017 / IMPL-0020)
  # =====================================================================
  - name: repo-guardian.custom-property-sync
    rules:
      # A managed custom property (from annotation_properties or the
      # built-in Owner/Component pair) is not defined in the org's
      # custom-property schema, so the preflight is skipping its sync.
      # Mirrors the chart's starter alert of the same name.
      #
      # increase(...[1h]) with a short `for`, not rate(...[15m]) with
      # for: 30m: a schema mismatch is observed once per repo per sweep,
      # so a short window goes quiet before a long pending period
      # elapses and the alert can never fire (INV-0011 A7).
      - alert: RepoGuardianPropertySchemaMissing
        expr: increase(repo_guardian_custom_property_missing_schema_total[1h]) > 0
        for: 5m
        labels:
          severity: warning
          service: repo-guardian
        annotations:
          summary: "repo-guardian custom property missing from org schema"
          description: >-
            A managed custom property has no matching definition in the
            org's custom-property schema; its sync is being skipped.
            Define the property at the org (or enterprise) level, or
            remove it from annotation_properties. The structured log
            line "custom properties missing from org schema" carries
            the org and property names.

      # A repo's catalog-info.yaml failed to parse, so its
      # custom-properties reconcile was skipped entirely (IMPL-0020 A1:
      # a malformed file must never overwrite the managed set with
      # defaults). Sustained failures mean repos are drifting from
      # their catalog metadata. Same sparse-metric shape as above.
      - alert: RepoGuardianCatalogParseFailures
        expr: increase(repo_guardian_catalog_parse_failed_total[1h]) > 0
        for: 5m
        labels:
          severity: warning
          service: repo-guardian
        annotations:
          summary: "repo-guardian skipping repos with unparseable catalog-info.yaml"
          description: >-
            At least one repo's catalog-info.yaml failed to parse in the
            last hour; custom-property sync for those repos is skipped
            (never overwritten). The structured log line "catalog-info
            parse failed" names the repo — fix the YAML there.

      # repo-guardian parked repositories it could not read: the App was
      # uninstalled from them, lost a permission, or they were deleted.
      # Parked rows stay in repo_state but leave the stale sweep, and only
      # discovery can un-park them, so this is self-healing — the alert
      # exists to tell you access changed, not to demand an action.
      # Mirrors the chart's starter alert of the same name.
      #
      # The reason selector is load-bearing. repos_parked_total also
      # counts reason="archived" and reason="fork", which are routine and
      # would otherwise fire this on every normal onboarding sweep. Those
      # two are worth a dashboard panel rather than an alert -- a large
      # step means somebody archived a batch of repositories:
      #
      #   sum by (reason) (increase(repo_guardian_repos_parked_total[24h]))
      - alert: RepoGuardianRepoAccessDenied
        expr: increase(repo_guardian_repos_parked_total{reason="access_denied"}[1h]) > 0
        for: 15m
        labels:
          severity: warning
          service: repo-guardian
        annotations:
          summary: "repo-guardian cannot read repositories it was asked to check"
          description: >-
            Repositories were parked because the installation cannot read
            them. A trickle is normal in a large org (repositories get
            deleted); a step change means the App lost access to something
            it used to have. List them with:
            SELECT owner, repo, last_error FROM repo_state WHERE NOT active
            AND last_check_status = 'error';

  # =====================================================================
  # Removed: Discoverer + BudgetTracker (IMPL-0015 Phase 1)
  # =====================================================================
  # RepoGuardianBudgetGated is gone. The BudgetTracker it watched was
  # inert in production (INV-0012 finding A: nothing ever called
  # RefreshFromAPI outside tests, so enqueue_gated_by_budget_total had
  # no producer and the alert could never fire) and was deleted in
  # IMPL-0022 Phase 6 along with its nine api_budget_* metrics.
  # The replacement signals are RepoGuardianQueueBackpressure and the
  # re-pointed RepoGuardianRateLimitThrottling above, both fed by the
  # delayed-requeue path that actually throttles work.
