# Example Helm values for repo-guardian: one org with every built-in
# control type (examples/policy/full).
#
# Install:
#   helm install repo-guardian oci://ghcr.io/donaldgifford/charts/repo-guardian \
#     --namespace platform-tools --create-namespace \
#     -f examples/values-with-policy.yaml
#
# The chart renders policy.files into one ConfigMap and mounts it at
# GUARDIAN_CONFIG (/etc/repo-guardian/policy) with each file at its path.

temporal:
  address: temporal-frontend.temporal.svc.cluster.local:7233

# The Evaluation App (read-only). Add github.remediate.* to run the
# remediator and open pull requests.
github:
  eval:
    appId: "123456"
    # Secret with keys `private-key` and `webhook-secret`.
    existingSecret: repo-guardian-eval

# The policy root as a nested map by directory (a string is a file, a
# map is a directory). Byte-identical to examples/policy/full —
# examples_test.go fails if the two drift.
policy:
  files:
    catalogue:
      catalog_info.hcl: |
        control "catalog_info" {
          version     = 1
          type        = "catalog_info"
          title       = "Backstage catalog entry"
          description = "catalog-info.yaml is a Component with its owner and system filled in"
          template    = "catalog-info"

          rule "exists" {
            remediate = true
          }

          rule "kind" {
            title     = "The entity is a Component"
            remediate = true
          }

          rule "owner-is-team" {
            kind     = "field_set"
            title    = "spec.owner names a team"
            field    = "spec.owner"
            contains = "team"
          }

          rule "system-set" {
            kind  = "field_set"
            title = "spec.system is set"
            field = "spec.system"
          }

          rule "no-placeholders" {
            kind  = "no_placeholders"
            title = "No TODO placeholders remain"
          }
        }
      codeowners.hcl: |
        control "codeowners" {
          version     = 1
          type        = "codeowners"
          title       = "CODEOWNERS"
          description = "A CODEOWNERS file exists in one of GitHub's locations"
          template    = "codeowners"

          rule "exists" {
            number    = "1.1"
            title     = "A CODEOWNERS file exists"
            remediate = true
          }

          pr {
            title = "chore({{ .Repo }}): adopt CODEOWNERS"
          }
        }
      custom_properties.hcl: |
        control "custom_properties" {
          version     = 1
          type        = "custom_properties"
          title       = "Custom properties"
          description = "Repository custom properties match catalog-info.yaml"

          annotation_properties = {
            "jira/project-key" = "JiraProject"
            "jira/label"       = "JiraLabel"
          }

          properties = {
            Owner = {
              pattern = "^[a-z0-9-]+$"
            }
          }

          rule "matches" {
            remediate = true
          }

          rule "value_pattern" {
            title = "Every value matches its pattern"
          }

          rule "defined" {
            title = "The org schema defines every property"
          }

          remediation {
            apply = "direct"
          }
        }
      labels.hcl: |
        control "labels" {
          version     = 1
          type        = "labels"
          title       = "Labels"
          description = "The org's triage labels exist and retired ones are gone"

          rule "bug" {
            kind        = "present"
            name        = "bug"
            color       = "d73a4a"
            description = "Something isn't working"
            remediate   = true
          }

          rule "security" {
            kind        = "present"
            name        = "security"
            color       = "b60205"
            description = "A security issue"
            remediate   = true
          }

          rule "no-wontfix" {
            kind      = "absent"
            name      = "wontfix"
            remediate = true
          }

          remediation {
            apply = "direct"
          }
        }
      protect_main.hcl: |
        control "protect_main" {
          version     = 1
          type        = "branch_ruleset"
          title       = "Default branch ruleset"
          description = "The default branch needs a reviewed pull request and linear history"
          name        = "protect-main"

          ruleset = {
            conditions = {
              ref_name = {
                include = ["~DEFAULT_BRANCH"]
                exclude = []
              }
            }
            rules = [
              {
                type = "pull_request"
                parameters = {
                  required_approving_review_count = 1
                  dismiss_stale_reviews_on_push   = true
                }
              },
              { type = "required_linear_history" },
              { type = "deletion" },
            ]
          }

          rule "exists" {
            remediate = true
          }

          rule "matches" {
            title     = "The ruleset matches the declaration"
            remediate = true
          }

          remediation {
            apply = "direct"
          }
        }
      renovate.hcl: |
        control "renovate" {
          version     = 1
          type        = "dependency_updates"
          title       = "Renovate"
          description = "Renovate is configured, extends the org preset, and is the only dependency bot"
          template    = "renovate"
          tool        = "renovate"
          renovate = {
            extends = "github>{{ .Owner }}/renovate-config"
          }

          rule "configured" {
            remediate = true
          }

          rule "extends" {
            title     = "The config extends the org preset"
            remediate = true
          }

          rule "exclusive" {
            title     = "No Dependabot config is left behind"
            remediate = true
          }
        }
      renovate_workflow.hcl: |
        control "renovate_workflow" {
          version     = 1
          type        = "file"
          title       = "Renovate workflow"
          description = "The self-hosted Renovate workflow matches the template"
          template    = "renovate-workflow"
          path        = ".github/workflows/renovate.yml"

          rule "exact" {
            remediate = true
          }
        }
      repo_settings.hcl: |
        control "repo_settings" {
          version     = 1
          type        = "repo_settings"
          title       = "Repository settings"
          description = "Alerts on, merged branches deleted, no wiki, squash merges allowed"

          rule "vulnerability-alerts" {
            kind      = "equals"
            property  = "vulnerability_alerts"
            value     = true
            remediate = true
          }

          rule "delete-branch-on-merge" {
            kind      = "equals"
            property  = "delete_branch_on_merge"
            value     = true
            remediate = true
          }

          rule "no-wiki" {
            kind      = "equals"
            property  = "has_wiki"
            value     = false
            remediate = true
          }

          rule "squash-merge" {
            kind     = "equals"
            title    = "Squash merges are allowed (reported, never changed)"
            property = "allow_squash_merge"
            value    = true
          }

          remediation {
            apply = "recommend"
          }
        }
    enterprise.hcl: |
      # full: what v1's guardian-full.hcl did, one control per concern, every
      # built-in control type used once. The org file carries v1's global
      # ignore list and the legacy carve-out from branch protection.
      enterprise {
        orgs = ["myorg"]
        mode = "remediate"
        controls = [
          "codeowners@1",
          "renovate@1",
          "renovate_workflow@1",
          "catalog_info@1",
          "custom_properties@1",
          "labels@1",
          "repo_settings@1",
          "protect_main@1",
        ]

        remediation {
          max_open_prs = 3
          reopen_after = "336h"
        }
      }
    orgs:
      myorg.hcl: |
        org "myorg" {
          exclude_repos {
            match  = [".github", "terraform-*", "archive-*"]
            reason = "org config, infrastructure and archives are managed elsewhere"
          }

          repos "legacy" {
            match = ["legacy-*"]

            exclude "protect_main@1" {
              reason = "legacy repositories predate the review policy"
            }
          }
        }
