# Prometheus alerting rules for repo-guardian.
#
# Usage:
#   Add this file to your Prometheus rule_files configuration:
#
#   rule_files:
#     - /etc/prometheus/rules/repo-guardian-alerts.yaml
#
#   Or if using the Prometheus Operator, create a PrometheusRule resource:
#
#   apiVersion: monitoring.coreos.com/v1
#   kind: PrometheusRule
#   metadata:
#     name: repo-guardian
#     namespace: platform-tools
#     labels:
#       release: kube-prometheus-stack   # match your Prometheus selector
#   spec:
#     groups:
#       <paste the groups below here>

groups:
  - name: repo-guardian
    rules:
      # -------------------------------------------------------------------
      # Availability
      # -------------------------------------------------------------------

      # The service has not checked any repositories in the last 2 hours.
      # During normal operation the scheduler or webhooks should produce
      # a steady stream of checks. A gap suggests the pod is down, the
      # queue is stuck, or no webhooks are arriving.
      #
      # Note: repos_checked_total carries [trigger, org] labels, so we
      # sum without those to evaluate the global rate.
      - alert: RepoGuardianNoRepoChecks
        expr: |
          sum(increase(repo_guardian_repos_checked_total[2h])) == 0
        for: 30m
        labels:
          severity: warning
          service: repo-guardian
        annotations:
          summary: "No repositories checked in the last 2 hours"
          description: >-
            repo-guardian has not processed any repository checks in the
            last 2 hours. Verify the pod is running, the work queue is
            not stuck, and GitHub webhooks are being delivered.

      # -------------------------------------------------------------------
      # Error rate
      # -------------------------------------------------------------------

      # The error rate exceeds 10% of total checks over the last 15 minutes.
      - alert: RepoGuardianHighErrorRate
        expr: |
          (
            sum(rate(repo_guardian_errors_total[15m]))
            /
            clamp_min(sum(rate(repo_guardian_repos_checked_total[15m])), 1)
          ) > 0.10
        for: 10m
        labels:
          severity: warning
          service: repo-guardian
        annotations:
          summary: "Error rate above 10%"
          description: >-
            More than 10% of repo-guardian operations are failing.
            Check the repo_guardian_errors_total metric by operation
            label to identify the failing component.

      # Sustained errors with no successful checks. This typically means
      # the GitHub App credentials are invalid or the API is unreachable.
      - alert: RepoGuardianAllChecksFailing
        expr: |
          (
            sum(rate(repo_guardian_errors_total[30m])) > 0
            and
            sum(rate(repo_guardian_repos_checked_total[30m])) == 0
          )
        for: 15m
        labels:
          severity: critical
          service: repo-guardian
        annotations:
          summary: "All repository checks are failing"
          description: >-
            repo-guardian is producing errors but has not completed a
            single successful check in 30 minutes. This often indicates
            invalid GitHub App credentials, an expired private key, or
            GitHub API connectivity issues.

      # -------------------------------------------------------------------
      # GitHub API rate limiting
      # -------------------------------------------------------------------

      # Remaining API quota has dropped below 500.
      - alert: RepoGuardianRateLimitLow
        expr: |
          repo_guardian_github_rate_remaining < 500
        for: 5m
        labels:
          severity: warning
          service: repo-guardian
        annotations:
          summary: "GitHub API rate limit running low"
          description: >-
            The GitHub API rate limit remaining is {{ $value }}. The
            service will begin pre-emptive throttling. If quota reaches
            zero, all checks will stall until the rate limit resets.

      # Rate limit waits are increasing, indicating the service is
      # actively being throttled by GitHub.
      - alert: RepoGuardianRateLimitThrottling
        expr: |
          sum(rate(repo_guardian_github_rate_limit_waits_total[15m])) > 0.5
        for: 10m
        labels:
          severity: warning
          service: repo-guardian
        annotations:
          summary: "Service is being rate-limited by GitHub"
          description: >-
            repo-guardian is hitting GitHub rate limits and actively
            waiting before retrying. Consider reducing WORKER_COUNT or
            increasing RATE_LIMIT_THRESHOLD to throttle earlier.

      # -------------------------------------------------------------------
      # Check latency
      # -------------------------------------------------------------------

      # P99 check duration exceeds 30 seconds. Individual repo checks
      # should normally complete in a few seconds.
      - alert: RepoGuardianSlowChecks
        expr: |
          histogram_quantile(0.99, sum(rate(repo_guardian_check_duration_seconds_bucket[15m])) by (le)) > 30
        for: 15m
        labels:
          severity: warning
          service: repo-guardian
        annotations:
          summary: "Repository checks are slow (p99 > 30s)"
          description: >-
            The 99th percentile check duration is {{ $value | humanizeDuration }}.
            This may indicate GitHub API latency or rate limit back-off.

      # -------------------------------------------------------------------
      # Webhook delivery
      # -------------------------------------------------------------------

      # No webhooks received in 24 hours. During normal org activity,
      # at least some webhook events (pushes, PRs, etc.) should arrive.
      # A complete gap usually means the webhook URL is misconfigured or
      # the ingress is down.
      - alert: RepoGuardianNoWebhooks
        expr: |
          increase(repo_guardian_webhook_received_total[24h]) == 0
        for: 1h
        labels:
          severity: warning
          service: repo-guardian
        annotations:
          summary: "No webhooks received in 24 hours"
          description: >-
            repo-guardian has not received any GitHub webhook events in
            the last 24 hours. Verify the webhook URL is correctly
            configured in the GitHub App settings and that the ingress
            or load balancer is routing traffic to the service.

      # -------------------------------------------------------------------
      # Custom properties
      # -------------------------------------------------------------------

      # A burst of properties PRs may indicate a misconfiguration or an
      # unintended reconciliation. Similar to the file-rule PR burst alert.
      - alert: RepoGuardianPropertiesPRBurst
        expr: |
          increase(repo_guardian_properties_prs_created_total[1h]) > 50
        for: 5m
        labels:
          severity: warning
          service: repo-guardian
        annotations:
          summary: "Unusually high number of properties PRs created"
          description: >-
            repo-guardian created {{ $value }} custom properties PRs in
            the last hour. This may be expected during initial rollout
            of CUSTOM_PROPERTIES_MODE, but could also indicate a
            misconfiguration. Review recent PRs and consider enabling
            DRY_RUN mode.

      # -------------------------------------------------------------------
      # PR creation
      # -------------------------------------------------------------------

      # A burst of PRs may indicate a misconfiguration or an unintended
      # reconciliation against repos that should be excluded.
      #
      # Note: prs_created_total is now a CounterVec[org]. Wrap in sum(...)
      # to preserve the prior scalar threshold semantic; replace with
      # `sum by (org) (...)` and a per-org threshold to alert per org.
      - alert: RepoGuardianPRBurst
        expr: |
          sum(increase(repo_guardian_prs_created_total[1h])) > 50
        for: 5m
        labels:
          severity: warning
          service: repo-guardian
        annotations:
          summary: "Unusually high number of PRs created"
          description: >-
            repo-guardian created {{ $value }} PRs in the last hour.
            This may be expected during initial rollout or after enabling
            a new rule, but could also indicate a misconfiguration.
            Review recent PRs and consider enabling DRY_RUN mode.

      # -------------------------------------------------------------------
      # Setting and branch protection rules
      # -------------------------------------------------------------------

      # A setting being remediated repeatedly suggests another tool (or a
      # human) is reverting the change after each reconciliation. Either
      # disable the setting rule, or fix the upstream cause.
      - alert: RepoGuardianSettingRemediationChurn
        expr: |
          sum by (rule_name, org) (
            rate(repo_guardian_settings_remediated_total[6h])
          ) > 0.01
        for: 6h
        labels:
          severity: warning
          service: repo-guardian
        annotations:
          summary: "Setting rule is being remediated repeatedly"
          description: >-
            Setting rule {{ $labels.rule_name }} in org {{ $labels.org }}
            has been remediated repeatedly over 6 hours. Another tool or
            user is likely reverting the change. Investigate the source
            of the drift before re-enabling remediation.

      # Branch protection ruleset churn — same indicator at the ruleset
      # layer.
      - alert: RepoGuardianBranchProtectionChurn
        expr: |
          sum by (rule_name, org) (
            rate(repo_guardian_branch_protection_remediated_total[6h])
          ) > 0.01
        for: 6h
        labels:
          severity: warning
          service: repo-guardian
        annotations:
          summary: "Branch protection ruleset is being remediated repeatedly"
          description: >-
            Branch protection rule {{ $labels.rule_name }} in org
            {{ $labels.org }} has been remediated repeatedly over 6 hours.
            Another tool may be overwriting the ruleset, or the
            remediation diff is non-converging.

      # -------------------------------------------------------------------
      # Webhook ingress
      # -------------------------------------------------------------------

      # Sustained webhook rejections indicate either a misconfigured
      # ingress (legitimate GitHub traffic being rejected) or scanning
      # attempts against the public endpoint.
      - alert: RepoGuardianWebhookRejectionsHigh
        expr: |
          sum by (reason) (rate(repo_guardian_webhook_rejected_total[15m])) > 0.1
        for: 30m
        labels:
          severity: warning
          service: repo-guardian
        annotations:
          summary: "Webhook requests being rejected at >0.1/s"
          description: >-
            Webhook rejection rate is {{ $value | humanize }}/s with
            reason {{ $labels.reason }}. If reason is `ip_not_allowed`,
            this may be GitHub IP range refresh lag or scanning traffic.
            If `allowlist_unavailable`, the /meta fetch is failing and
            legitimate webhooks are being dropped (fail-closed default).

      # -------------------------------------------------------------------
      # Strict-mode scope misconfiguration
      # -------------------------------------------------------------------

      # A rule is consistently producing rule-level out-of-scope events,
      # meaning it applies to no in-scope orgs. This usually indicates a
      # typo in the rule's scope.orgs list — the rule will never fire.
      - alert: RepoGuardianRuleNeverApplies
        expr: |
          sum by (org) (rate(repo_guardian_out_of_scope_total{level="rule"}[1h])) > 0
          and
          sum by (org) (rate(repo_guardian_files_missing_total[1h])) == 0
        for: 6h
        labels:
          severity: warning
          service: repo-guardian
        annotations:
          summary: "Rule-level scope is rejecting every evaluation"
          description: >-
            For org {{ $labels.org }}, every rule evaluation has been
            rejected by per-rule scope for 6 hours. Check guardian.hcl
            for typos in scope.orgs lists or rules whose scope no longer
            matches any in-scope org.
