---
# -- Number of replicas
replicaCount: 1

# -- Number of old ReplicaSets retained for rollback. Defaults to 3 to
# keep the kubectl `get rs` view tidy; bump if you need more rollback
# headroom. Kubernetes default is 10.
revisionHistoryLimit: 3

image:
  # -- Container image repository
  repository: ghcr.io/donaldgifford/repo-guardian
  # -- Image pull policy
  pullPolicy: IfNotPresent
  # -- Overrides the image tag (default: appVersion)
  tag: ""

# -- Image pull secrets
imagePullSecrets: []
# -- Override the chart name
nameOverride: ""
# -- Override the full release name
fullnameOverride: ""

serviceAccount:
  # -- Create a ServiceAccount
  create: true
  # -- Annotations for the ServiceAccount
  annotations: {}
  # -- Override the ServiceAccount name
  name: ""

# -- Pod annotations
podAnnotations: {}
# -- Pod labels
podLabels: {}

# -- Pod security context
podSecurityContext: {}

# -- Container security context
securityContext:
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 65534

service:
  # -- Service type
  type: ClusterIP
  # -- Webhook HTTP port
  httpPort: 80
  # -- Metrics port
  metricsPort: 9090

# -- Container resource requests and limits
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

livenessProbe:
  # @default -- See values.yaml
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 5
  periodSeconds: 15

readinessProbe:
  # @default -- See values.yaml
  httpGet:
    path: /readyz
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10

# -- repo-guardian application configuration (env vars)
config:
  # -- GitHub App ID
  appId: ""
  # -- Webhook listen port
  port: 8080
  # -- Metrics listen port
  metricsPort: 9090
  # -- Log level (debug, info, warn, error)
  logLevel: "info"
  # -- Dry run mode
  dryRun: false
  # -- Worker count for check queue
  workerCount: 5
  # -- Queue size for check queue
  queueSize: 100
  # -- Deliveries a single job may accumulate (rate-limit deferrals
  # plus reaper requeues) before it is dropped with a terminal error
  # written to repo_state. The next stale sweep re-enqueues the repo,
  # so this bounds retry cost without permanently abandoning work.
  # Must be >= 1.
  maxJobAttempts: 10
  # -- Reconciliation schedule interval (Go duration)
  scheduleInterval: "168h"
  # -- Skip forked repositories
  skipForks: true
  # -- Skip archived repositories
  skipArchived: true

# -- GitHub App secrets
secrets:
  # -- Create secret resource (false = use existing secret)
  create: true
  # -- Name of existing secret (when create=false)
  existingSecret: ""
  # -- GitHub webhook secret
  webhookSecret: ""
  # -- GitHub App private key (PEM format)
  privateKey: ""
  # -- Mount private key as file (true) or env var (false)
  privateKeyAsFile: true

# -- File-template overrides for the binary's TemplateStore.
#
# Breaking change in chart 0.4.0: the legacy `templates.codeowners`,
# `templates.dependabot`, and `templates.renovate` slots have been
# removed. Move existing values into `templates.files` keyed by
# filename (with `.tmpl` suffix), e.g.:
#
#   templates:
#     files:
#       codeowners.tmpl: |
#         * @platform-team
#       dependabot.tmpl: |
#         version: 2
#         updates: ...
#
# When `templates.existingConfigMap` is non-empty the chart skips
# rendering its own ConfigMap and the Deployment mounts the named
# ConfigMap at TEMPLATE_DIR. This is the escape hatch for operators
# who manage templates out-of-band (GitOps, Argo ApplicationSet, etc).
templates:
  # -- Map of filename to template content. Each entry becomes a
  # key in the rendered ConfigMap and is loaded by the binary at
  # startup. Filenames must end in `.tmpl`.
  files: {}
  # -- Name of an existing ConfigMap to mount at TEMPLATE_DIR
  # instead of rendering one from `templates.files`.
  existingConfigMap: ""

# -- Templating configuration: env-var injection and strict-mode
# validation.
#
# `templating.vars` exposes arbitrary environment variables to the
# binary's `env "VAR"` template helper. Values flow through to the
# Deployment's container env list; they are NOT secrets — use
# `secrets.*` or `extraEnv` (with valueFrom: secretKeyRef) for
# secret material. The chart rejects keys that collide with
# chart-managed env vars (GITHUB_APP_ID, WEBHOOK_SECRET, etc).
#
# `templating.strict` toggles `STRICT_TEMPLATES=true` on the
# Deployment. When enabled the binary validates every compiled PR
# template against a zero-value PRVars context at startup and
# fails fast on missing-field references.
templating:
  # -- Map of env-var key to value. Keys must not collide with
  # chart-managed env vars; the chart fails template rendering on
  # collisions.
  vars: {}
  # -- Enable startup-time strict validation of compiled PR
  # templates (sets STRICT_TEMPLATES=true on the Deployment).
  strict: false

# -- Webhook IP allowlist configuration
webhookIPAllowlist:
  # -- Enable GitHub IP allowlist middleware
  enabled: true
  # -- Allow requests when allowlist unavailable
  failOpen: false
  # -- Trust X-Forwarded-For proxy headers
  trustProxyHeaders: false

# -- Tailscale Funnel sidecar
tailscale:
  # -- Enable Tailscale sidecar container
  enabled: false
  # -- Tailscale container image
  image: ghcr.io/tailscale/tailscale:latest
  # -- Tailscale hostname (becomes <hostname>.<tailnet>.ts.net)
  hostname: repo-guardian
  # -- Use userspace networking (no CAP_NET_ADMIN needed)
  userspace: true
  # -- Name of existing secret containing 'authkey'
  authKeySecret: tailscale-auth
  # -- Create RBAC for Tailscale state management
  rbac:
    create: true

serviceMonitor:
  # -- Create Prometheus ServiceMonitor
  enabled: false
  # -- Scrape interval
  interval: 30s
  # -- Additional labels for ServiceMonitor
  labels: {}

# -- Prometheus PrometheusRule with starter alerts (IMPL-0011 P6).
prometheusRule:
  # -- Create PrometheusRule with starter alerts.
  enabled: false
  # -- Additional labels (e.g., to match Prometheus operator
  # `ruleSelector`).
  labels: {}
  # -- Per-alert overrides: each key under `alerts.<name>` accepts
  # `for`, `severity`, `threshold`, and `enabled`. See the rendered
  # PrometheusRule template for the canonical alert names.
  alerts: {}

# -- Persistent state store (per-repo reconcile state). See
# DESIGN-0012 §Backend modes. The in-memory backend was removed
# in IMPL-0016 (chart 1.0); postgres is the only supported value.
store:
  # -- Backend implementation. Only "postgres" is supported.
  backend: postgres
  # -- Postgres-specific configuration. Ignored when backend != postgres.
  postgres:
    # -- Source of the Postgres deployment. One of:
    # "baked"    — chart renders a single-pod Postgres Deployment;
    # "cnpg"     — chart renders a CloudNativePG `Cluster` CR;
    # "external" — operator provides DSN via existingSecret.
    mode: baked
    # -- Operator-supplied secret holding STORE_DSN. Required when
    # mode=external.
    existingSecret: ""
    # -- Key inside existingSecret holding the DSN. Default: STORE_DSN.
    existingSecretKey: STORE_DSN
    # -- Connection cap for the pgx pool.
    maxConns: 16
    # -- Baked Postgres-only configuration.
    baked:
      # -- Pinned image. Bump intentionally.
      image: postgres:18.4
      # -- Operator-supplied Secret holding the Postgres password. When
      # set, the chart does NOT generate its own password Secret; the
      # baked StatefulSet reads the password from this Secret and the app
      # assembles STORE_DSN at runtime via $(POSTGRES_PASSWORD). Use this
      # for GitOps/ArgoCD: the chart's default `lookup`-based password
      # preservation returns nothing under `helm template`, so the
      # generated password rotates on every sync and drifts from the
      # already-initialised data directory (auth failures). Password must
      # be URL-safe (alphanumeric) — it is interpolated into the DSN URL.
      existingSecret: ""
      # -- Key inside existingSecret holding the password.
      existingSecretKey: POSTGRES_PASSWORD
      # -- Persistent volume size.
      storageSize: 10Gi
      # -- StorageClass name. Empty → cluster default.
      storageClassName: ""
      # -- Pod securityContext. Runs Postgres as the image's built-in
      # non-root user (uid/gid 999) so the entrypoint skips its
      # root-only chown of PGDATA (which fails on clusters/storage
      # that forbid chown, e.g. restrictive admission policies or
      # NFS root_squash); fsGroup makes kubelet set volume group
      # ownership instead. Set to `{}` to restore the image default
      # (root entrypoint + chown).
      podSecurityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
      # -- Resource requests/limits for the Postgres container.
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 1000m
          memory: 1Gi
    # -- CloudNativePG-only configuration.
    cnpg:
      # -- Number of CNPG instances.
      instances: 1
      # -- CNPG-managed Postgres image.
      imageName: ghcr.io/cloudnative-pg/postgresql:18.4
      # -- Storage block.
      storage:
        size: 10Gi
        storageClass: ""
      # -- Connection pooler (PgBouncer). Disabled by default.
      pooler:
        enabled: false
        # -- Pooler type: `rw` (primary) or `ro` (read-only replicas).
        type: rw
        # -- Pooler replica count.
        instances: 1
        pgbouncer:
          # -- PgBouncer pool mode: `session`, `transaction`, or `statement`.
          poolMode: transaction
          # -- PgBouncer `default_pool_size`.
          defaultPoolSize: 25
          # -- PgBouncer `max_client_conn`.
          maxClientConnections: 100
          # -- Extra `pgbouncer.ini` parameters (key-value pairs).
          parameters: {}
        monitoring:
          # -- Render a `PodMonitor` for the pooler. Requires the Prometheus Operator CRD.
          enablePodMonitor: false
        # Cilium does not support TCPRoute (cilium/cilium#42016), so external
        # connections use a LoadBalancer Service with BGP advertisement.
        service:
          # -- Enable an external LoadBalancer Service in front of the pooler.
          enabled: false
          # -- Service `type` (usually `LoadBalancer`).
          type: LoadBalancer
          # -- Extra Service annotations.
          annotations: {}
          # -- Service labels. Defaults wire Cilium BGP IP advertisement.
          labels:
            bgp.cilium.io/advertise-service: default
            bgp.cilium.io/ip-pool: default

# -- Work queue for reconcile jobs. The in-memory backend was
# removed in IMPL-0016 (chart 1.0); valkey is the only supported
# value.
queue:
  # -- Backend implementation. Only "valkey" is supported.
  backend: valkey
  # -- (deprecated) Buffered channel size; ignored since the
  # in-memory backend was removed in IMPL-0016. Retained for
  # values-schema backwards compatibility; will be deleted in a
  # future chart-major release.
  size: 1000
  # -- Valkey-specific configuration. Ignored when backend != valkey.
  valkey:
    # -- Source of the Valkey deployment. One of:
    # "baked"    — chart renders a single-pod Valkey Deployment;
    # "external" — operator provides DSN via existingSecret.
    mode: baked
    # -- Operator-supplied secret holding QUEUE_VALKEY_DSN.
    existingSecret: ""
    # -- Key inside existingSecret holding the DSN.
    existingSecretKey: QUEUE_VALKEY_DSN
    # -- How long an in-flight job may sit before the reaper
    # requeues it.
    jobAckTimeout: "5m"
    # -- Cadence between reaper iterations.
    reaperInterval: "60s"
    # -- Baked Valkey-only configuration.
    baked:
      # -- Pinned image. Bump intentionally.
      image: valkey/valkey:9.1
      # -- Operator-supplied Secret holding the Valkey password. Same
      # GitOps rationale as store.postgres.baked.existingSecret. When set,
      # the chart skips its generated password Secret; the baked Valkey
      # reads the password from this Secret and the app assembles
      # QUEUE_VALKEY_DSN at runtime via $(VALKEY_PASSWORD). URL-safe
      # (alphanumeric) password required.
      existingSecret: ""
      # -- Key inside existingSecret holding the password.
      existingSecretKey: VALKEY_PASSWORD
      # -- Persistent volume size.
      storageSize: 1Gi
      # -- StorageClass name. Empty → cluster default.
      storageClassName: ""
      # -- Generated AUTH password length (random alphanumeric).
      authPasswordLength: 32
      # -- Pod securityContext. Runs Valkey as the image's built-in
      # non-root user (uid/gid 999) so the entrypoint skips its
      # root-only chown of /data (which fails on clusters/storage
      # that forbid chown); fsGroup makes kubelet set volume group
      # ownership instead. Set to `{}` to restore the image default
      # (root entrypoint + chown).
      podSecurityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch

# -- Scheduler (sweep cadence) backend. The single-replica ticker
# scheduler was removed in IMPL-0016 (chart 1.0); valkey is the only
# supported value. Scheduler shares the queue's Valkey instance.
scheduler:
  # -- Backend implementation. Only "valkey" is supported.
  backend: valkey

# -- Stale-sweep tuning (IMPL-0011 Phase 5d).
staleSweep:
  # -- Maximum age of a stored last_checked_at before the sweep
  # requeues. Default 24h. Effective only with store.backend=postgres.
  freshness: "24h"
  # -- Cap on rows returned per StaleRepos query.
  batchSize: 200

# -- Repository discovery (IMPL-0015 Phase 1). The Discoverer runs on
# the leader pod, enumerates installations + repos via the GitHub
# API, and persists discovery rows via Store.UpsertIfMissing so the
# stale-sweeper picks them up on the next tick. Webhook-driven
# discovery (`installation_repositories.added` + `repository.created`)
# is the primary on-ramp; the periodic Discoverer is the safety net
# for missed deliveries.
discovery:
  # -- Toggle the Discoverer schedule. When false the binary still
  # responds to discovery via webhooks; only the periodic enumeration
  # path is disabled.
  enabled: true
  # -- Cadence between Discoverer.Discover invocations. Lower values
  # burn more API budget on list_installations +
  # list_installation_repos; higher values delay discovery of repos
  # the webhook path missed.
  interval: "1h"

# -- HCL policy configuration
policy:
  # -- Inline HCL policy config (creates a ConfigMap)
  config: ""
  # -- Use an existing ConfigMap for policy config
  existingConfigMap: ""
  # -- Auto-close repo-guardian PRs when every file rule is
  # satisfied on the default branch (IMPL-0013 Phase 3). When
  # `true` (default), the PR is closed with a sticky comment and
  # the reconcile branch is deleted. When `false`, the PR stays
  # open until a human closes it.
  autoClosePR: true

# -- Additional environment variables
extraEnv: []
# -- Additional volumes
extraVolumes: []
# -- Additional volume mounts
extraVolumeMounts: []

# -- Node selector
nodeSelector: {}
# -- Tolerations
tolerations: []
# -- Affinity rules
affinity: {}
