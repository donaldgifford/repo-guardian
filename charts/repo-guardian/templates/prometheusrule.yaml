{{- if .Values.prometheusRule.enabled -}}
{{/*
Starter alert pack, mirrored by hand from the generated catalogue
(internal/monitoring/alert, IMPL-0029 6.6) — keep the two in step. Each
alert may be tuned via prometheusRule.alerts.<name>.{for,severity,
threshold}; setting `enabled: false` skips rendering the alert.
Scoped to the labels block from values.yaml so an operator running
multiple Prometheus instances can target a specific one with
ruleSelector.
*/}}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "repo-guardian.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "repo-guardian.labels" . | nindent 4 }}
    {{- with .Values.prometheusRule.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  groups:
    - name: repo-guardian.rules
      rules:
        {{- $a := .Values.prometheusRule.alerts -}}
        {{- /* EvaluationErrorRate */ -}}
        {{- $alert := default dict $a.EvaluationErrorRate -}}
        {{- if ne (toString (get $alert "enabled")) "false" }}
        - alert: RepoGuardianEvaluationErrorRate
          expr: (sum(rate(repo_guardian_evaluations_total{outcome="error"}[15m])) / (sum(rate(repo_guardian_evaluations_total[15m])) > 0)) > {{ default 0.1 (get $alert "threshold") }}
          for: {{ default "10m" (get $alert "for") | quote }}
          labels:
            severity: {{ default "warning" (get $alert "severity") | quote }}
          annotations:
            summary: "more than 10% of repo-guardian evaluations are failing"
            description: "at 100% the evaluator cannot read GitHub or the store at all: usually the Evaluation App's credentials, connectivity, or a policy that fails to load."
        {{- end }}
        {{- /* ControlEvaluationErrors */ -}}
        {{- $alert := default dict $a.ControlEvaluationErrors -}}
        {{- if ne (toString (get $alert "enabled")) "false" }}
        - alert: RepoGuardianControlEvaluationErrors
          {{- /* Per (org, control), first increment included: increase() cannot see a new series. */}}
          expr: |
            increase(repo_guardian_evaluation_errors_total[1h]) > 0
            or
            (repo_guardian_evaluation_errors_total
              unless repo_guardian_evaluation_errors_total offset 1h) > 0
          for: {{ default "15m" (get $alert "for") | quote }}
          labels:
            severity: {{ default "warning" (get $alert "severity") | quote }}
          annotations:
            summary: "a repo-guardian control is returning an error status"
            description: "the control could not evaluate: a GitHub read it needs failed or was refused. One control erroring across an org is usually a missing App permission; the logs dashboard names the repositories."
        {{- end }}
        {{- /* EvaluationFreshness */ -}}
        {{- $alert := default dict $a.EvaluationFreshness -}}
        {{- if ne (toString (get $alert "enabled")) "false" }}
        - alert: RepoGuardianEvaluationFreshness
          expr: histogram_quantile(0.95, sum by (le) (rate(repo_guardian_evaluation_freshness_seconds_bucket[6h]))) > {{ default 172800 (get $alert "threshold") }}
          for: {{ default "1h" (get $alert "for") | quote }}
          labels:
            severity: {{ default "warning" (get $alert "severity") | quote }}
          annotations:
            summary: "repo-guardian controls are re-evaluated more than two days apart (p95)"
            description: "evaluation is not keeping up with the fleet: check the evaluation queue's schedule-to-start latency and budget waits before raising EVALUATOR_CONCURRENCY."
        {{- end }}
        {{- /* StaleEpochDiscards */ -}}
        {{- $alert := default dict $a.StaleEpochDiscards -}}
        {{- if ne (toString (get $alert "enabled")) "false" }}
        - alert: RepoGuardianStaleEpochDiscards
          expr: sum(increase(repo_guardian_results_discarded_total{reason="stale_epoch"}[2h])) > {{ default 100 (get $alert "threshold") }}
          for: {{ default "1h" (get $alert "for") | quote }}
          labels:
            severity: {{ default "warning" (get $alert "severity") | quote }}
          annotations:
            summary: "repo-guardian evaluations keep being discarded for a moved assignment epoch"
            description: "assignments change between evaluation and record faster than evaluations finish, usually a policy being re-activated repeatedly. Evaluation work is being thrown away."
        {{- end }}
        {{- /* NoWebhooks */ -}}
        {{- $alert := default dict $a.NoWebhooks -}}
        {{- if ne (toString (get $alert "enabled")) "false" }}
        - alert: RepoGuardianNoWebhooks
          expr: increase(repo_guardian_webhook_received_total[24h]) == 0
          for: {{ default "1h" (get $alert "for") | quote }}
          labels:
            severity: {{ default "warning" (get $alert "severity") | quote }}
          annotations:
            summary: "repo-guardian has received no webhook in 24 hours"
            description: "either the App's webhook delivery is broken or the endpoint is unreachable. Check the App's recent deliveries in GitHub."
        {{- end }}
        {{- /* WebhookRejectionsHigh */ -}}
        {{- $alert := default dict $a.WebhookRejectionsHigh -}}
        {{- if ne (toString (get $alert "enabled")) "false" }}
        - alert: RepoGuardianWebhookRejectionsHigh
          expr: sum by (reason) (rate(repo_guardian_webhook_rejected_total[30m])) > {{ default 0.1 (get $alert "threshold") }}
          for: {{ default "30m" (get $alert "for") | quote }}
          labels:
            severity: {{ default "warning" (get $alert "severity") | quote }}
          annotations:
            summary: "repo-guardian webhook requests are being rejected"
            description: "signature validation failures (401s), usually a wrong or rotated webhook secret. Source-IP rejections happen at the operator's edge layer, not here."
        {{- end }}
        {{- /* StoreErrors */ -}}
        {{- $alert := default dict $a.StoreErrors -}}
        {{- if ne (toString (get $alert "enabled")) "false" }}
        - alert: RepoGuardianStoreErrors
          expr: sum(rate(repo_guardian_store_query_seconds_count{outcome="error"}[10m])) / (sum(rate(repo_guardian_store_query_seconds_count[10m])) > 0) > {{ default 0.1 (get $alert "threshold") }}
          for: {{ default "10m" (get $alert "for") | quote }}
          labels:
            severity: {{ default "warning" (get $alert "severity") | quote }}
          annotations:
            summary: "more than 10% of repo-guardian store queries are failing"
            description: "Postgres is unreachable, saturated, or the schema is behind the binary."
        {{- end }}
        {{- /* RateLimitNearExhaustion */ -}}
        {{- $alert := default dict $a.RateLimitNearExhaustion -}}
        {{- if ne (toString (get $alert "enabled")) "false" }}
        - alert: RepoGuardianRateLimitNearExhaustion
          expr: min(repo_guardian_rate_limit_remaining) < {{ default 200 (get $alert "threshold") }}
          for: {{ default "5m" (get $alert "for") | quote }}
          labels:
            severity: {{ default "warning" (get $alert "severity") | quote }}
          annotations:
            summary: "repo-guardian GitHub API budget is nearly exhausted"
            description: "set by every evaluation from the response headers. The installation budget defers evaluations until the reset, so work waits rather than fails."
        {{- end }}
    {{- /*
      Temporal worker health (rc.2), mirrored by hand from the generated
      catalogue's repo-guardian.temporal group — keep the two in step.
      Grouped by task_queue, never namespace: a ServiceMonitor renames
      the SDK's Temporal-namespace label to exported_namespace. Each
      window is at least its default `for`; raising `for` past the
      window means the alert can never fire.
    */}}
    - name: repo-guardian.temporal
      rules:
        {{- $a := .Values.prometheusRule.alerts -}}
        {{- /* TemporalActivityBacklog */ -}}
        {{- $alert := default dict $a.TemporalActivityBacklog -}}
        {{- if ne (toString (get $alert "enabled")) "false" }}
        - alert: RepoGuardianTemporalActivityBacklog
          expr: histogram_quantile(0.99, sum by (le, task_queue) (rate(temporal_activity_schedule_to_start_latency_seconds_bucket[30m]))) > {{ default 60 (get $alert "threshold") }}
          for: {{ default "30m" (get $alert "for") | quote }}
          labels:
            severity: {{ default "warning" (get $alert "severity") | quote }}
          annotations:
            summary: "repo-guardian activities wait more than a minute (p99) for a worker slot"
            description: "far above Temporal's generic 200ms on purpose: evaluations are GitHub rate-limit bound and a policy rollout queues work by design. Minutes of sustained wait mean the fleet cannot keep up; add evaluator replicas (or KEDA maxReplicas) or EVALUATOR_CONCURRENCY, within the GitHub budget."
        {{- end }}
        {{- /* TemporalStickyCacheEvictions */ -}}
        {{- $alert := default dict $a.TemporalStickyCacheEvictions -}}
        {{- if ne (toString (get $alert "enabled")) "false" }}
        - alert: RepoGuardianTemporalStickyCacheEvictions
          expr: sum(rate(temporal_sticky_cache_total_forced_eviction[30m])) > {{ default 1 (get $alert "threshold") }}
          for: {{ default "30m" (get $alert "for") | quote }}
          labels:
            severity: {{ default "warning" (get $alert "severity") | quote }}
          annotations:
            summary: "repo-guardian workers are force-evicting cached workflows"
            description: "more long-lived workflows are active than the sticky cache holds (one EvaluationWorkflow per repository), so evicted workflows replay their history on every task. Add worker replicas; each has its own cache."
        {{- end }}
        {{- /* TemporalWorkerSlotsExhausted */ -}}
        {{- $alert := default dict $a.TemporalWorkerSlotsExhausted -}}
        {{- if ne (toString (get $alert "enabled")) "false" }}
        - alert: RepoGuardianTemporalWorkerSlotsExhausted
          {{- /* max: fires only when no pod has a free slot. */}}
          expr: max by (task_queue, worker_type) (temporal_worker_task_slots_available{worker_type=~"WorkflowWorker|ActivityWorker"}) == 0
          for: {{ default "15m" (get $alert "for") | quote }}
          labels:
            severity: {{ default "warning" (get $alert "severity") | quote }}
          annotations:
            summary: "no repo-guardian worker has a free task slot"
            description: "every worker's slots are in use, so new tasks queue. Add worker replicas, or raise EVALUATOR_CONCURRENCY within the GitHub budget."
        {{- end }}
        {{- /* TemporalWorkflowTaskLatency */ -}}
        {{- $alert := default dict $a.TemporalWorkflowTaskLatency -}}
        {{- if ne (toString (get $alert "enabled")) "false" }}
        - alert: RepoGuardianTemporalWorkflowTaskLatency
          expr: histogram_quantile(0.99, sum by (le, task_queue) (rate(temporal_workflow_task_schedule_to_start_latency_seconds_bucket[15m]))) > {{ default 0.2 (get $alert "threshold") }}
          for: {{ default "15m" (get $alert "for") | quote }}
          labels:
            severity: {{ default "warning" (get $alert "severity") | quote }}
          annotations:
            summary: "repo-guardian workflow tasks wait more than 200ms (p99) to start"
            description: "Temporal's recommended threshold. Workflow tasks are short, so waiting means workers are saturated, down, or their build is not the deployment's current version (check the worker's deployment readiness check)."
        {{- end }}
        {{- /* TemporalWorkflowTaskFailures */ -}}
        {{- $alert := default dict $a.TemporalWorkflowTaskFailures -}}
        {{- if ne (toString (get $alert "enabled")) "false" }}
        - alert: RepoGuardianTemporalWorkflowTaskFailures
          expr: sum by (task_queue) (rate(temporal_workflow_task_execution_failed[15m])) > 0
          for: {{ default "15m" (get $alert "for") | quote }}
          labels:
            severity: {{ default "warning" (get $alert "severity") | quote }}
          annotations:
            summary: "repo-guardian workflow tasks are failing"
            description: "a failing workflow task retries forever and its workflow makes no progress. Almost always nondeterminism: a workflow change shipped without workflow.GetVersion. The worker log names the workflow id."
        {{- end }}
        {{- /* TemporalNoWorkerPollers */ -}}
        {{- $alert := default dict $a.TemporalNoWorkerPollers -}}
        {{- if ne (toString (get $alert "enabled")) "false" }}
        - alert: RepoGuardianTemporalNoWorkerPollers
          expr: max by (task_queue, poller_type) (temporal_num_pollers{poller_type=~"workflow_task|activity_task"}) == 0
          for: {{ default "10m" (get $alert "for") | quote }}
          labels:
            severity: {{ default "critical" (get $alert "severity") | quote }}
          annotations:
            summary: "a repo-guardian worker has stopped polling its task queue"
            description: "the process is up but takes no tasks: usually lost connectivity to the frontend or a build that is not the deployment's current version."
        {{- end }}
        {{- /* TemporalUnreachable */ -}}
        {{- $alert := default dict $a.TemporalUnreachable -}}
        {{- if ne (toString (get $alert "enabled")) "false" }}
        - alert: RepoGuardianTemporalUnreachable
          expr: sum(rate(temporal_long_request_failure[10m])) / (sum(rate(temporal_long_request[10m])) > 0) > {{ default 0.5 (get $alert "threshold") }}
          for: {{ default "10m" (get $alert "for") | quote }}
          labels:
            severity: {{ default "critical" (get $alert "severity") | quote }}
          annotations:
            summary: "most repo-guardian Temporal polls are failing"
            description: "workers cannot reach the Temporal frontend: check the address, mTLS material and the frontend's own health. Nothing evaluates until it recovers."
        {{- end }}
{{- end }}
