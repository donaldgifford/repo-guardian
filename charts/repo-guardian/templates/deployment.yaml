{{- include "repo-guardian.validateTemplatingVars" . -}}
{{- include "repo-guardian.validateExtraEnv" . -}}
{{- include "repo-guardian.validateBackendSecrets" . -}}
{{- include "repo-guardian.validateRemovedValues" . -}}
{{- include "repo-guardian.validateRoles" . -}}
{{- include "repo-guardian.validatePolicyFiles" . -}}
{{- include "repo-guardian.validateTemporalAuth" . -}}
{{- include "repo-guardian.validateUI" . -}}
{{- range $role := splitList " " (include "repo-guardian.roles" .) }}
{{- $r := dict "ctx" $ "role" $role }}
{{- $v := $.Values }}
{{- $roleValues := index $v $role | default dict }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "repo-guardian.roleFullname" $r }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "repo-guardian.roleLabels" $r | nindent 4 }}
  annotations:
    {{- include "repo-guardian.argoWorkloadWave" $ | nindent 4 }}
spec:
  {{- if eq $role "all" }}
  replicas: {{ $v.replicaCount }}
  {{- else if not (dig "keda" "enabled" false $roleValues) }}
  replicas: {{ $roleValues.replicas }}
  {{- end }}
  revisionHistoryLimit: {{ $v.revisionHistoryLimit }}
  selector:
    matchLabels:
      {{- include "repo-guardian.roleSelectorLabels" $r | nindent 6 }}
  template:
    metadata:
      annotations:
        {{- if include "repo-guardian.roleReadsPolicy" $r }}
        {{- /* Hashed from values, not the rendered ConfigMaps, so a role
        rolls on a policy or template edit. An existingConfigMap is the
        operator's to roll. */}}
        checksum/policy: {{ toYaml (pick $v.policy "files" "existingConfigMap") | sha256sum }}
        {{- end }}
        {{- if and (include "repo-guardian.roleServesAPI" $r) $v.api.enabled $v.api.auth.enabled }}
        checksum/authz: {{ toYaml $v.api.authz | sha256sum }}
        {{- end }}
        {{- with $v.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "repo-guardian.roleLabels" $r | nindent 8 }}
        {{- with $v.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with $v.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "repo-guardian.serviceAccountName" $ }}
      terminationGracePeriodSeconds: 60
      {{- with $v.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ $.Chart.Name }}
          image: "{{ $v.image.repository }}:{{ $v.image.tag | default $.Chart.AppVersion }}"
          imagePullPolicy: {{ $v.image.pullPolicy }}
          {{- with $v.command }}
          command:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          args: [{{ $role | quote }}]
          ports:
            - containerPort: {{ $v.config.port }}
              name: http
              protocol: TCP
            - containerPort: {{ $v.config.metricsPort }}
              name: metrics
              protocol: TCP
            {{- if eq $role "all" }}
            - containerPort: {{ $v.api.port }}
              name: api
              protocol: TCP
            {{- end }}
          env:
            - name: LISTEN_ADDR
              value: ":{{ $v.config.port }}"
            - name: METRICS_ADDR
              value: ":{{ $v.config.metricsPort }}"
            - name: LOG_LEVEL
              value: {{ $v.config.logLevel | quote }}
            {{- if include "repo-guardian.roleDialsTemporal" $r }}
            {{- include "repo-guardian.temporalEnv" $ | nindent 12 }}
            {{- end }}
            {{- range $app := list "eval" "remediate" }}
            {{- include "repo-guardian.appEnv" (dict "ctx" $ "role" $r.role "app" $app) | nindent 12 }}
            {{- end }}
            {{- if include "repo-guardian.roleReadsPolicy" $r }}
            - name: GUARDIAN_CONFIG
              value: {{ include "repo-guardian.policyRoot" $ }}
            {{- end }}
            {{- if include "repo-guardian.roleHasStore" $r }}
            {{- /* Every worker promotes this build to its deployment's
            current version; the Go fallback is "dev" in every image. */}}
            - name: TEMPORAL_BUILD_ID
              value: {{ $v.worker.buildId | default ($v.image.tag | default $.Chart.AppVersion) | quote }}
            {{- /* Each controls worker is sized by its own role's values
            (IMPL-0028 task 4.9), in all only when its App is set. */}}
            {{- range $half := list (dict "role" "evaluator" "app" "Eval" "env" "EVALUATOR") (dict "role" "remediator" "app" "Remediate" "env" "REMEDIATOR") }}
            {{- if include (printf "repo-guardian.roleHas%sKey" $half.app) $r }}
            {{- $hv := index $v $half.role }}
            - name: {{ $half.env }}_CONCURRENCY
              value: {{ $hv.concurrency | quote }}
            {{- if $hv.dbPoolSize }}
            - name: {{ $half.env }}_DB_POOL_SIZE
              value: {{ $hv.dbPoolSize | quote }}
            {{- end }}
            {{- end }}
            {{- end }}
            {{- /* The evaluation schedule and service workflows run on the
            evaluator; in all only when its App is set. */}}
            {{- if include "repo-guardian.roleHasEvalKey" $r }}
            - name: EVAL_INTERVAL
              value: {{ $v.evalInterval | quote }}
            - name: POLICY_ROLLOUT_WINDOW
              value: {{ $v.policyRolloutWindow | quote }}
            - name: CHECKS_RETENTION
              value: {{ $v.checksRetention | quote }}
            - name: DISCOVERY_ENABLED
              value: {{ $v.discovery.enabled | quote }}
            - name: DISCOVERY_INTERVAL
              value: {{ $v.discovery.interval | quote }}
            - name: COMPLIANCE_SNAPSHOT_INTERVAL
              value: {{ $v.posture.snapshotInterval | quote }}
            {{- end }}
            {{- /* A split controls worker reads only its own role's DSN
            (IMPL-0030 1.12); all keeps STORE_DSN for the api's fallback. */}}
            {{- if not (and $v.store.controls.enabled (ne $r.role "all")) }}
            {{- include "repo-guardian.storeDSNEnv" $ | nindent 12 }}
            {{- end }}
            {{- include "repo-guardian.controlsDSNEnv" $r | nindent 12 }}
            {{- end }}
            {{- if include "repo-guardian.roleServesAPI" $r }}
            {{- include "repo-guardian.apiEnv" $r | nindent 12 }}
            {{- end }}
            {{- if include "repo-guardian.roleReadsPolicy" $r }}
            {{- range $k, $val := $v.templating.vars }}
            - name: {{ $k }}
              value: {{ $val | quote }}
            {{- end }}
            {{- end }}
            {{- with $v.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          volumeMounts:
            {{- range $app := list "eval" "remediate" }}
            {{- if include (printf "repo-guardian.roleHas%sKey" (title $app)) (dict "ctx" $ "role" $r.role) }}
            - name: {{ $app }}-app-key
              mountPath: /etc/repo-guardian/{{ $app }}-key
              readOnly: true
            {{- end }}
            {{- end }}
            {{- if and (include "repo-guardian.roleDialsTemporal" $r) $v.temporal.tls.existingSecret }}
            - name: temporal-tls
              mountPath: /etc/repo-guardian/temporal-tls
              readOnly: true
            {{- end }}
            {{- if and (include "repo-guardian.roleDialsTemporal" $r) $v.temporal.tls.caSecret }}
            - name: temporal-ca
              mountPath: /etc/repo-guardian/temporal-ca
              readOnly: true
            {{- end }}
            {{- if and (include "repo-guardian.roleDialsTemporal" $r) $v.temporal.auth.oidc.tokenUrl }}
            - name: temporal-oidc
              mountPath: /etc/repo-guardian/temporal-oidc
              readOnly: true
            {{- end }}
            {{- if include "repo-guardian.roleReadsPolicy" $r }}
            - name: policy
              mountPath: {{ include "repo-guardian.policyRoot" $ }}
              readOnly: true
            {{- end }}
            {{- if and (include "repo-guardian.roleServesAPI" $r) $v.api.enabled $v.api.auth.enabled }}
            - name: authz
              mountPath: /etc/repo-guardian/authz
              readOnly: true
            {{- end }}
            {{- with $v.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with $v.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with ($roleValues.resources | default $v.resources) }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $v.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $v.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        {{- range $app := list "eval" "remediate" }}
        {{- if include (printf "repo-guardian.roleHas%sKey" (title $app)) (dict "ctx" $ "role" $r.role) }}
        - name: {{ $app }}-app-key
          secret:
            secretName: {{ include "repo-guardian.appSecretName" (dict "ctx" $ "app" $app) }}
            items:
              - key: private-key
                path: private-key.pem
        {{- end }}
        {{- end }}
        {{- if and (include "repo-guardian.roleDialsTemporal" $r) $v.temporal.tls.existingSecret }}
        - name: temporal-tls
          secret:
            secretName: {{ $v.temporal.tls.existingSecret }}
        {{- end }}
        {{- if and (include "repo-guardian.roleDialsTemporal" $r) $v.temporal.tls.caSecret }}
        - name: temporal-ca
          secret:
            secretName: {{ $v.temporal.tls.caSecret }}
            items:
              - key: ca.crt
                path: ca.crt
        {{- end }}
        {{- if and (include "repo-guardian.roleDialsTemporal" $r) $v.temporal.auth.oidc.tokenUrl }}
        - name: temporal-oidc
          secret:
            secretName: {{ $v.temporal.auth.oidc.existingSecret }}
            items:
              - key: client-secret
                path: client-secret
        {{- end }}
        {{- if include "repo-guardian.roleReadsPolicy" $r }}
        {{- include "repo-guardian.policyVolume" $ | nindent 8 }}
        {{- end }}
        {{- if and (include "repo-guardian.roleServesAPI" $r) $v.api.enabled $v.api.auth.enabled }}
        - name: authz
          configMap:
            name: {{ include "repo-guardian.fullname" $ }}-authz
        {{- end }}
        {{- with $v.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with $v.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $v.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $v.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
