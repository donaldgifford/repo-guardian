---
# $schema=https://www.schemastore.org/github-action.json
name: License Check

on:
  push:
    branches: [main, v2]
  pull_request:
    branches: [main, v2]

permissions:
  contents: read

jobs:
  license-check:
    name: Check Dependency Licenses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Install go-licenses
        run: go install github.com/google/go-licenses@latest

      - name: Check licenses
        # nexus-proto-annotations (a Temporal SDK dependency) ships no license
        # file, so go-licenses cannot classify it.
        run: >-
          go-licenses check ./...
          --allowed_licenses=Apache-2.0,MIT,BSD-2-Clause,BSD-3-Clause,ISC,MPL-2.0
          --ignore github.com/nexus-rpc/nexus-proto-annotations

      - name: Generate license report
        if: always()
        run: >-
          go-licenses report ./...
          --template=.github/licenses-csv.tpl
          --ignore github.com/nexus-rpc/nexus-proto-annotations
          > licenses.csv

      - name: Upload license report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: license-report
          path: licenses.csv
