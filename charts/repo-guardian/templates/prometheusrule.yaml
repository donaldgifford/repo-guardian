{{- if .Values.prometheusRule.enabled -}}
{{/*
Starter alert pack for IMPL-0011 multi-replica deployments. Each
alert may be tuned via prometheusRule.alerts.<name>.{for,severity,
threshold}; setting `enabled: false` skips rendering the alert.
Scoped to the labels block from values.yaml so an operator running
multiple Prometheus instances can target a specific one with
ruleSelector.
*/}}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "repo-guardian.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "repo-guardian.labels" . | nindent 4 }}
    {{- with .Values.prometheusRule.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  groups:
    - name: repo-guardian.rules
      rules:
        {{- $a := .Values.prometheusRule.alerts -}}
        {{- /* QueueDepthHigh */ -}}
        {{- $alert := default dict $a.QueueDepthHigh -}}
        {{- if ne (toString (get $alert "enabled")) "false" }}
        - alert: RepoGuardianQueueDepthHigh
          expr: max(repo_guardian_queue_depth{queue="jobs"}) > {{ default 1000 (get $alert "threshold") }}
          for: {{ default "10m" (get $alert "for") | quote }}
          labels:
            severity: {{ default "warning" (get $alert "severity") | quote }}
          annotations:
            summary: "repo-guardian queue depth above threshold"
            description: "queue:jobs depth has exceeded the threshold for {{ default `10m` (get $alert `for`) }}; workers may be falling behind."
        {{- end }}
        {{- /* ReaperRequeues */ -}}
        {{- $alert := default dict $a.ReaperRequeues -}}
        {{- if ne (toString (get $alert "enabled")) "false" }}
        - alert: RepoGuardianReaperRequeues
          expr: rate(repo_guardian_queue_reaped_total[15m]) > {{ default 0.1 (get $alert "threshold") }}
          for: {{ default "15m" (get $alert "for") | quote }}
          labels:
            severity: {{ default "warning" (get $alert "severity") | quote }}
          annotations:
            summary: "repo-guardian reaper actively requeueing jobs"
            description: "the in-flight reaper has been requeueing jobs for over 15 minutes; workers may be crashing or hanging."
        {{- end }}
        {{- /* NoLeader */ -}}
        {{- $alert := default dict $a.NoLeader -}}
        {{- if ne (toString (get $alert "enabled")) "false" }}
        - alert: RepoGuardianNoSchedulerLeader
          {{- /*
            name="stale-sweep", NOT name="sweep". The legacy full-
            enumeration `sweep` schedule was deleted in IMPL-0015 Phase
            0, so this alert watched a series with no producer from that
            release until IMPL-0023 Phase 7 — and an == 0 comparison
            against an empty vector is itself empty, so it did not fire
            wrongly, it could not fire at all. INV-0012 finding A, again.
          */}}
          expr: max(repo_guardian_scheduler_is_leader{name="stale-sweep"}) == 0
          for: {{ default "5m" (get $alert "for") | quote }}
          labels:
            severity: {{ default "critical" (get $alert "severity") | quote }}
          annotations:
            summary: "repo-guardian sweep scheduler has no leader"
            description: "no replica has held the stale-sweep leader lock for 5+ minutes; reconciliation has stalled."
        {{- end }}
        {{- /* StoreErrors */ -}}
        {{- $alert := default dict $a.StoreErrors -}}
        {{- if ne (toString (get $alert "enabled")) "false" }}
        - alert: RepoGuardianStoreQueryErrors
          {{- /*
            clamp_min on the denominator, and a 10m window to match the
            generator's catalogue. Unclamped, an idle deployment divides
            0 by 0 and the series goes NaN — which never crosses the
            threshold, so the alert is merely useless rather than noisy,
            but "useless exactly while nothing is happening" is not a
            property worth keeping.
          */}}
          expr: |
            sum(rate(repo_guardian_store_query_seconds_count{outcome="error"}[10m]))
              / clamp_min(sum(rate(repo_guardian_store_query_seconds_count[10m])), 1)
              > {{ default 0.1 (get $alert "threshold") }}
          for: {{ default "10m" (get $alert "for") | quote }}
          labels:
            severity: {{ default "warning" (get $alert "severity") | quote }}
          annotations:
            summary: "repo-guardian store error rate elevated"
            description: "{{ "{{" }} $value | humanizePercentage {{ "}}" }} of store queries failed in the last 5 minutes."
        {{- end }}
        {{- /* RateLimitNearExhaustion */ -}}
        {{- $alert := default dict $a.RateLimitNearExhaustion -}}
        {{- if ne (toString (get $alert "enabled")) "false" }}
        - alert: RepoGuardianRateLimitNearExhaustion
          expr: min(repo_guardian_rate_limit_remaining) < {{ default 200 (get $alert "threshold") }}
          for: {{ default "5m" (get $alert "for") | quote }}
          labels:
            severity: {{ default "warning" (get $alert "severity") | quote }}
          annotations:
            summary: "repo-guardian GitHub rate-limit nearly exhausted"
            description: "an installation has fewer than the configured threshold rate-limit budget remaining; the reserve gate will start blocking sweeps."
        {{- end }}
        {{- /* RepoAccessDenied — INV-0015 circuit breaker */ -}}
        {{- $alert := default dict $a.RepoAccessDenied -}}
        {{- if ne (toString (get $alert "enabled")) "false" }}
        - alert: RepoGuardianRepoAccessDenied
          {{- /*
            The second disjunct catches the FIRST access_denied park.
            increase() cannot see a counter's first increment — the
            series does not exist until it is incremented, so its first
            sample is 1 and there is nothing earlier to subtract. On a
            fleet where this happens once, that is the only occurrence
            there will ever be. Mirrors alert.firstOrIncrease in the
            generator catalogue; keep the two in step.
          */}}
          expr: |
            increase(repo_guardian_repos_parked_total{reason="access_denied"}[1h]) > {{ default 0 (get $alert "threshold") }}
            or
            (repo_guardian_repos_parked_total{reason="access_denied"}
              unless repo_guardian_repos_parked_total{reason="access_denied"} offset 1h) > {{ default 0 (get $alert "threshold") }}
          for: {{ default "15m" (get $alert "for") | quote }}
          labels:
            severity: {{ default "warning" (get $alert "severity") | quote }}
          annotations:
            summary: "repo-guardian cannot read repositories it was asked to check"
            description: "repositories were parked because the installation cannot read them — the App was uninstalled from them, lost a permission, or they were deleted. Only reason=access_denied is alerted; archived and fork parking is routine. Parked repos are skipped by the sweep and rejoin automatically when discovery sees them again."
        {{- end }}
        {{- /* StaleOpenPRs — IMPL-0013 Phase 1 drift visibility */ -}}
        {{- $alert := default dict $a.StaleOpenPRs -}}
        {{- if ne (toString (get $alert "enabled")) "false" }}
        - alert: RepoGuardianStaleOpenPRs
          expr: max(repo_guardian_open_prs_by_rule{age_bucket="30d+"}) > {{ default 0 (get $alert "threshold") }}
          for: {{ default "1h" (get $alert "for") | quote }}
          labels:
            severity: {{ default "warning" (get $alert "severity") | quote }}
          annotations:
            summary: "repo-guardian PR open for 30+ days"
            description: "at least one repo-guardian PR has been open for over 30 days without convergence; investigate the rule / org pair."
        {{- end }}
        {{- /* PRDrift — INV-0005 drift surface */ -}}
        {{- $alert := default dict $a.PRDrift -}}
        {{- if ne (toString (get $alert "enabled")) "false" }}
        - alert: RepoGuardianPRDrift
          expr: sum(rate(repo_guardian_pr_open_with_empty_actionable_total[1h])) > {{ default 0 (get $alert "threshold") }}
          for: {{ default "30m" (get $alert "for") | quote }}
          labels:
            severity: {{ default "warning" (get $alert "severity") | quote }}
          annotations:
            summary: "repo-guardian PR drift detected (INV-0005)"
            description: "open repo-guardian PRs exist where every file rule is now satisfied on the default branch; IMPL-0013 Phase 3 will auto-converge these, but the metric flags them today."
        {{- end }}
        {{- /* QueueBackpressure — IMPL-0022 delayed-requeue depth */ -}}
        {{- $alert := default dict $a.QueueBackpressure -}}
        {{- if ne (toString (get $alert "enabled")) "false" }}
        - alert: RepoGuardianQueueBackpressure
          {{- /*
            Gauge published by EVERY pod's reaper tick (each
            REAPER_INTERVAL, default 60s), so the series is always
            fresh and a sustained `for` is safe — no rate() window to
            outlive (INV-0012 finding C class). max() because every
            replica reports the same ZCARD.
          */}}
          expr: max(repo_guardian_queue_delayed_depth) > {{ default 100 (get $alert "threshold") }}
          for: {{ default "30m" (get $alert "for") | quote }}
          labels:
            severity: {{ default "warning" (get $alert "severity") | quote }}
          annotations:
            summary: "repo-guardian delayed-job backlog sustained"
            description: "more than the threshold number of jobs have sat parked in the delayed set for 30+ minutes; deferrals (rate-limit throttling) are outpacing promotion. Check queue_delayed_total by installation to find the throttled tenant. See docs/operations/scaling.md §Delayed requeue."
        {{- end }}
        {{- /* JobsExhausted — IMPL-0022 attempt-cap terminal drops */ -}}
        {{- $alert := default dict $a.JobsExhausted -}}
        {{- if ne (toString (get $alert "enabled")) "false" }}
        - alert: RepoGuardianJobsExhausted
          {{- /*
            Two-legged on purpose: increase() cannot see a brand-new
            series' first increment (needs two samples to diff, and
            birth-at-1 diffs to 0 — INV-0012 finding E class). The
            second leg fires for any exhausted-counter series younger
            than 1h, covering exactly the window the first leg is
            blind in; once the series is older than 1h the offset
            sample exists and `unless` retires that leg.
          */}}
          expr: |
            sum(increase(repo_guardian_queue_attempts_exhausted_total[1h])) > 0
              or sum(repo_guardian_queue_attempts_exhausted_total
                unless repo_guardian_queue_attempts_exhausted_total offset 1h) > 0
          for: {{ default "5m" (get $alert "for") | quote }}
          labels:
            severity: {{ default "warning" (get $alert "severity") | quote }}
          annotations:
            summary: "repo-guardian dropped a job at the attempt cap"
            description: "a job exhausted MAX_JOB_ATTEMPTS and was dropped with a terminal StatusError in repo_state; the next stale sweep will retry the repo, but a sustained rate means a persistently failing installation. Check queue_attempts_exhausted_total by installation and the worker logs."
        {{- end }}
        {{- /* PostureExportStalled — IMPL-0023 Phase 2 */ -}}
        {{- $alert := default dict $a.PostureExportStalled -}}
        {{- if ne (toString (get $alert "enabled")) "false" }}
        - alert: RepoGuardianPostureExportStalled
          {{- /*
            The one failure the compliance gauges cannot report about
            themselves. The exporter runs on the leader and republishes
            repos_actionable / repos_tracked / repos_unmeasurable on a
            timer; if it stops, the gauges do not go to zero or go
            stale-flagged — they keep serving their last values, with
            total confidence, forever. Every number on the KPI dashboard
            is then a lie of unknown age.
          */}}
          expr: sum(increase(repo_guardian_posture_export_total{outcome="ok"}[1h])) == {{ default 0 (get $alert "threshold") }}
          for: {{ default "15m" (get $alert "for") | quote }}
          labels:
            severity: {{ default "warning" (get $alert "severity") | quote }}
          annotations:
            summary: "repo-guardian posture exporter has stopped publishing"
            description: "no successful posture export in the last hour. The compliance gauges are still being served but are frozen at their last values; treat every compliance number as unknown rather than as its last reading until this clears. Check the leader's logs for posture export errors and repo_guardian_posture_export_total{outcome=\"error\"}."
        {{- end }}
        {{- /* PropertySchemaMissing — DESIGN-0019 schema preflight */ -}}
        {{- $alert := default dict $a.PropertySchemaMissing -}}
        {{- if ne (toString (get $alert "enabled")) "false" }}
        - alert: RepoGuardianPropertySchemaMissing
          {{- /*
            increase(...[1h]) with a short `for`, not rate(...[15m]) with
            for: 30m. The window must outlive `for` or the alert can never
            fire: a schema mismatch is observed once per repo per sweep, so
            an isolated one leaves rate() positive for ~15m and the 30m
            pending period resets before it elapses (INV-0011 A7).
          */}}
          expr: |
            increase(repo_guardian_custom_property_missing_schema_total[1h]) > {{ default 0 (get $alert "threshold") }}
            or
            (repo_guardian_custom_property_missing_schema_total
              unless repo_guardian_custom_property_missing_schema_total offset 1h) > {{ default 0 (get $alert "threshold") }}
          for: {{ default "5m" (get $alert "for") | quote }}
          labels:
            severity: {{ default "warning" (get $alert "severity") | quote }}
          annotations:
            summary: "repo-guardian custom property missing from org schema"
            description: "a mapped annotation_properties target has no matching org-level custom property definition; the sync for that property is being skipped. See docs/usage/policy-reference.md §Custom Property Schema Preflight — either define the property in the org's custom-property schema, or remove it from annotation_properties."
        {{- end }}
    {{- /*
      Temporal worker health (rc.2), mirrored by hand from the generated
      catalogue's repo-guardian.temporal group — keep the two in step.
      Grouped by task_queue, never namespace: a ServiceMonitor renames
      the SDK's Temporal-namespace label to exported_namespace. Each
      window is at least its default `for`; raising `for` past the
      window means the alert can never fire.
    */}}
    - name: repo-guardian.temporal
      rules:
        {{- $a := .Values.prometheusRule.alerts -}}
        {{- /* TemporalActivityBacklog */ -}}
        {{- $alert := default dict $a.TemporalActivityBacklog -}}
        {{- if ne (toString (get $alert "enabled")) "false" }}
        - alert: RepoGuardianTemporalActivityBacklog
          expr: histogram_quantile(0.99, sum by (le, task_queue) (rate(temporal_activity_schedule_to_start_latency_seconds_bucket[30m]))) > {{ default 60 (get $alert "threshold") }}
          for: {{ default "30m" (get $alert "for") | quote }}
          labels:
            severity: {{ default "warning" (get $alert "severity") | quote }}
          annotations:
            summary: "repo-guardian activities wait more than a minute (p99) for a worker slot"
            description: "far above Temporal's generic 200ms on purpose: checks are GitHub rate-limit bound and a policy rollout queues work by design. Minutes of sustained wait mean the fleet cannot keep up; add worker replicas (or KEDA maxReplicas) or WORKER_ACTIVITY_CONCURRENCY, within the GitHub budget."
        {{- end }}
        {{- /* TemporalStickyCacheEvictions */ -}}
        {{- $alert := default dict $a.TemporalStickyCacheEvictions -}}
        {{- if ne (toString (get $alert "enabled")) "false" }}
        - alert: RepoGuardianTemporalStickyCacheEvictions
          expr: sum(rate(temporal_sticky_cache_total_forced_eviction[30m])) > {{ default 1 (get $alert "threshold") }}
          for: {{ default "30m" (get $alert "for") | quote }}
          labels:
            severity: {{ default "warning" (get $alert "severity") | quote }}
          annotations:
            summary: "repo-guardian workers are force-evicting cached workflows"
            description: "more long-lived workflows are active than the sticky cache holds (one RepoWorkflow per repository), so evicted workflows replay their history on every task. Add worker replicas; each has its own cache."
        {{- end }}
        {{- /* TemporalWorkerSlotsExhausted */ -}}
        {{- $alert := default dict $a.TemporalWorkerSlotsExhausted -}}
        {{- if ne (toString (get $alert "enabled")) "false" }}
        - alert: RepoGuardianTemporalWorkerSlotsExhausted
          {{- /* max: fires only when no pod has a free slot. */}}
          expr: max by (task_queue, worker_type) (temporal_worker_task_slots_available{worker_type=~"WorkflowWorker|ActivityWorker"}) == 0
          for: {{ default "15m" (get $alert "for") | quote }}
          labels:
            severity: {{ default "warning" (get $alert "severity") | quote }}
          annotations:
            summary: "no repo-guardian worker has a free task slot"
            description: "every worker's slots are in use, so new tasks queue. Add worker replicas, or raise WORKER_ACTIVITY_CONCURRENCY within the GitHub budget."
        {{- end }}
        {{- /* TemporalWorkflowTaskLatency */ -}}
        {{- $alert := default dict $a.TemporalWorkflowTaskLatency -}}
        {{- if ne (toString (get $alert "enabled")) "false" }}
        - alert: RepoGuardianTemporalWorkflowTaskLatency
          expr: histogram_quantile(0.99, sum by (le, task_queue) (rate(temporal_workflow_task_schedule_to_start_latency_seconds_bucket[15m]))) > {{ default 0.2 (get $alert "threshold") }}
          for: {{ default "15m" (get $alert "for") | quote }}
          labels:
            severity: {{ default "warning" (get $alert "severity") | quote }}
          annotations:
            summary: "repo-guardian workflow tasks wait more than 200ms (p99) to start"
            description: "Temporal's recommended threshold. Workflow tasks are short, so waiting means workers are saturated, down, or their build is not the deployment's current version (check the worker's deployment readiness check)."
        {{- end }}
        {{- /* TemporalClientCertExpiring: only when the pods present a client certificate. */ -}}
        {{- $alert := default dict $a.TemporalClientCertExpiring -}}
        {{- if and (include "repo-guardian.temporalTLSSecret" $) (ne (toString (get $alert "enabled")) "false") }}
        - alert: RepoGuardianTemporalClientCertExpiring
          {{- /* Threshold in seconds; a healthy 24h certificate renewed 8h early never drops below 8h. */}}
          expr: min(repo_guardian_temporal_client_cert_expiry_timestamp_seconds) - time() < {{ default 14400 (get $alert "threshold") }}
          for: {{ default "10m" (get $alert "for") | quote }}
          labels:
            severity: {{ default "warning" (get $alert "severity") | quote }}
          annotations:
            summary: "a repo-guardian pod presents a Temporal client certificate expiring within 4h"
            description: "renewal or reload is failing. Check the Certificate's status, the Issuer's OpenBao auth, and repo_guardian_temporal_credential_reloads_total{outcome=\"error\"}."
        {{- end }}
{{- end }}
