suite: configmap
templates:
  - templates/configmap.yaml
tests:
  - it: emits empty data when no templates.files declared
    asserts:
      - hasDocuments:
          count: 1
      - matchRegex:
          path: metadata.name
          pattern: ".*-templates$"

  - it: renders one configmap entry per templates.files key
    set:
      templates:
        files:
          codeowners.tmpl: "* @my-org/my-team"
          dependabot.tmpl: "version: 2"
    asserts:
      - hasDocuments:
          count: 1
      - isNotEmpty:
          path: data

  - it: skips chart configmap when templates.existingConfigMap is set
    set:
      templates:
        existingConfigMap: my-shared-templates
    asserts:
      - hasDocuments:
          count: 0

  - it: stamps Release.Namespace on metadata
    release:
      namespace: my-ns
    asserts:
      - equal:
          path: metadata.namespace
          value: my-ns
