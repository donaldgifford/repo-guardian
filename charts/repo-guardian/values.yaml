---
# -- Number of replicas
replicaCount: 1

# -- Number of old ReplicaSets retained for rollback. Defaults to 3 to
# keep the kubectl `get rs` view tidy; bump if you need more rollback
# headroom. Kubernetes default is 10.
revisionHistoryLimit: 3

image:
  # -- Container image repository
  repository: ghcr.io/donaldgifford/repo-guardian
  # -- Image pull policy
  pullPolicy: IfNotPresent
  # -- Overrides the image tag (default: appVersion)
  tag: ""

# -- Image pull secrets
imagePullSecrets: []
# -- Override the chart name
nameOverride: ""
# -- Override the full release name
fullnameOverride: ""

serviceAccount:
  # -- Create a ServiceAccount
  create: true
  # -- Annotations for the ServiceAccount
  annotations: {}
  # -- Override the ServiceAccount name
  name: ""

# -- Pod annotations
podAnnotations: {}
# -- Pod labels
podLabels: {}

# -- Pod security context
podSecurityContext: {}

# -- Container security context
securityContext:
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 65534

service:
  # -- Service type
  type: ClusterIP
  # -- Webhook HTTP port
  httpPort: 80
  # -- Metrics port
  metricsPort: 9090

# -- Container resource requests and limits
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

livenessProbe:
  # @default -- See values.yaml
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 5
  periodSeconds: 15

readinessProbe:
  # @default -- See values.yaml
  httpGet:
    path: /readyz
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10

# -- repo-guardian application configuration (env vars)
config:
  # -- GitHub App ID
  appId: ""
  # -- Webhook listen port
  port: 8080
  # -- Metrics listen port
  metricsPort: 9090
  # -- Log level (debug, info, warn, error)
  logLevel: "info"
  # -- Dry run mode
  dryRun: false
  # -- Skip forked repositories
  skipForks: true
  # -- Skip archived repositories
  skipArchived: true

# -- Deployment shape (DESIGN-0026 § Chart 2.0.0). `split` renders one
# Deployment per role: `ingest` (webhooks), `worker` (Temporal worker)
# and, when `api.enabled`, `api`. `all` renders a single Deployment
# running every role, for small installs and the homelab.
topology: split

# -- Temporal connection. Every role that dials Temporal (ingest,
# worker, all) gets these; api never does.
temporal:
  # -- Frontend `host:port`. Required.
  address: ""
  # -- Temporal namespace.
  namespace: repo-guardian
  # -- Task queue the worker polls and ingest signals through.
  taskQueue: repo-guardian
  tls:
    # -- Secret with `tls.crt`, `tls.key` and (optionally) `ca.crt` for
    # mTLS. Mounted only into roles that dial Temporal.
    existingSecret: ""
    # -- Server name to verify the frontend certificate against.
    serverName: ""

# -- Each repository's check cadence (Go duration).
checkInterval: "24h"
# -- Span a policy change is spread across: every repository is
# re-checked at a random point inside it, not all at once.
policyRolloutWindow: "24h"
# -- How long check history is kept before SnapshotWorkflow prunes it.
checksRetention: "2160h"

# -- The ingest role: receives webhooks and signals workflows. Stateless.
ingest:
  # -- Replica count (split only).
  replicas: 2
  # -- Resources; empty falls back to `resources`.
  resources: {}
  pdb:
    # -- Render a PodDisruptionBudget.
    enabled: true
    # -- Pods kept through voluntary disruptions.
    minAvailable: 1

# -- The worker role: runs workflows and activities (split only).
worker:
  # -- Replica count. Ignored when `worker.keda.enabled`.
  replicas: 1
  # -- Concurrent activities per pod (WORKER_ACTIVITY_CONCURRENCY).
  concurrency: 10
  # -- Resources; empty falls back to `resources`.
  resources: {}
  # -- KEDA autoscaling on Temporal backlog. Requires the KEDA CRDs.
  keda:
    # -- Render a ScaledObject with a `temporal` trigger.
    enabled: false
    # -- Floor.
    minReplicas: 1
    # -- Ceiling. Size it to the GitHub budget, not the backlog: checks
    # are rate-limit bound, so pods past the budget only park more
    # timers (INV-0018 Obs 7).
    maxReplicas: 4
    # -- Backlog per replica before KEDA scales out.
    targetQueueSize: "50"

# -- The api role: the read-only JSON API (DESIGN-0027). It holds only
# a read-only database credential: no App key, no webhook secret.
api:
  # -- Render the api role (split) and its Service. In `all` the API
  # always runs on `api.port`; this gates its Service and auth.
  enabled: false
  # -- Replica count (split only).
  replicas: 2
  # -- API port beside other roles (`all`). The api role alone serves
  # on `config.port`.
  port: 8081
  # -- Resources; empty falls back to `resources`.
  resources: {}
  pdb:
    # -- Render a PodDisruptionBudget.
    enabled: true
    # -- Pods kept through voluntary disruptions.
    minAvailable: 1
  roDsn:
    # -- Secret holding STORE_RO_DSN. Required for `store.postgres.mode:
    # external`; baked and cnpg derive it from the chart-managed
    # `repoguardian_ro` role when empty.
    existingSecret: ""
    # -- Key inside existingSecret.
    existingSecretKey: STORE_RO_DSN
  auth:
    # -- Require an OIDC bearer token on every data endpoint.
    enabled: true
    # -- OIDC issuer URL. Required when auth is enabled.
    issuer: ""
    # -- Expected token audience.
    audience: repo-guardian-api
    # -- Claim naming the caller in logs.
    nameClaim: preferred_username
    # -- Claim listing the caller's groups.
    groupsClaim: groups
  authz:
    # -- Group → org grants, rendered into the authz ConfigMap. Keys are
    # group names; values list orgs (`["*"]` for every org).
    groups: {}
    # -- Orgs granted to every authenticated caller.
    defaultOrgs: []
    # -- Machine clients (by `azp`) → groups above, for IdPs that put no
    # groups on client-credentials tokens.
    clients: {}
  # -- Open repo-guardian PRs older than this count as stale.
  prStaleAfter: "720h"
  status:
    # -- Serve /status without a token.
    public: true

# -- GitHub App secrets
secrets:
  # -- Create secret resource (false = use existing secret)
  create: true
  # -- Name of existing secret (when create=false)
  existingSecret: ""
  # -- GitHub webhook secret
  webhookSecret: ""
  # -- GitHub App private key (PEM format)
  privateKey: ""
  # -- Mount private key as file (true) or env var (false)
  privateKeyAsFile: true

# -- File-template overrides for the binary's TemplateStore.
#
# Breaking change in chart 0.4.0: the legacy `templates.codeowners`,
# `templates.dependabot`, and `templates.renovate` slots have been
# removed. Move existing values into `templates.files` keyed by
# filename (with `.tmpl` suffix), e.g.:
#
#   templates:
#     files:
#       codeowners.tmpl: |
#         * @platform-team
#       dependabot.tmpl: |
#         version: 2
#         updates: ...
#
# When `templates.existingConfigMap` is non-empty the chart skips
# rendering its own ConfigMap and the Deployment mounts the named
# ConfigMap at TEMPLATE_DIR. This is the escape hatch for operators
# who manage templates out-of-band (GitOps, Argo ApplicationSet, etc).
templates:
  # -- Map of filename to template content. Each entry becomes a
  # key in the rendered ConfigMap and is loaded by the binary at
  # startup. Filenames must end in `.tmpl`.
  files: {}
  # -- Name of an existing ConfigMap to mount at TEMPLATE_DIR
  # instead of rendering one from `templates.files`.
  existingConfigMap: ""

# -- Templating configuration: env-var injection and strict-mode
# validation.
#
# `templating.vars` exposes arbitrary environment variables to the
# binary's `env "VAR"` template helper. Values flow through to the
# Deployment's container env list; they are NOT secrets — use
# `secrets.*` or `extraEnv` (with valueFrom: secretKeyRef) for
# secret material. The chart rejects keys that collide with
# chart-managed env vars (GITHUB_APP_ID, WEBHOOK_SECRET, etc).
#
# `templating.strict` toggles `STRICT_TEMPLATES=true` on the
# Deployment. When enabled the binary validates every compiled PR
# template against a zero-value PRVars context at startup and
# fails fast on missing-field references.
templating:
  # -- Map of env-var key to value. Keys must not collide with
  # chart-managed env vars; the chart fails template rendering on
  # collisions.
  vars: {}
  # -- Enable startup-time strict validation of compiled PR
  # templates (sets STRICT_TEMPLATES=true on the Deployment).
  strict: false

serviceMonitor:
  # -- Create Prometheus ServiceMonitor
  enabled: false
  # -- Scrape interval
  interval: 30s
  # -- Additional labels for ServiceMonitor
  labels: {}

# -- Prometheus PrometheusRule with starter alerts (IMPL-0011 P6).
prometheusRule:
  # -- Create PrometheusRule with starter alerts.
  enabled: false
  # -- Additional labels (e.g., to match Prometheus operator
  # `ruleSelector`).
  labels: {}
  # -- Per-alert overrides: each key under `alerts.<name>` accepts
  # `for`, `severity`, `threshold`, and `enabled`. See the rendered
  # PrometheusRule template for the canonical alert names.
  alerts: {}

migrate:
  # -- Run `repo-guardian migrate` as a hook Job (v2 schema migrations
  # and the one-time v1 backfill): post-install, so a baked Postgres
  # exists to connect to, and pre-upgrade, so the schema lands before
  # new pods roll.
  enabled: true
  # -- The v1 backfill's freshness: a v1 repo checked within this window
  # keeps its due-time; older ones are due immediately after cutover.
  freshness: "24h"
  # -- Job retries before the release fails. On a first install the
  # Job may start before Postgres accepts connections; retries cover it.
  backoffLimit: 6
  # -- Upper bound on the Job's run time, in seconds. The v1 backfill is
  # one transaction; raise this for very large fleets.
  activeDeadlineSeconds: 600
  # -- Resources for the migrate container.
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

# -- Persistent state store (per-repo reconcile state). See
# DESIGN-0012 §Backend modes. The in-memory backend was removed
# in IMPL-0016 (chart 1.0); postgres is the only supported value.
store:
  # -- Backend implementation. Only "postgres" is supported.
  backend: postgres
  # -- Postgres-specific configuration. Ignored when backend != postgres.
  postgres:
    # -- Source of the Postgres deployment. One of:
    # "baked"    — chart renders a single-pod Postgres Deployment;
    # "cnpg"     — chart renders a CloudNativePG `Cluster` CR;
    # "external" — operator provides DSN via existingSecret.
    mode: baked
    # -- Operator-supplied secret holding STORE_DSN. Required when
    # mode=external.
    existingSecret: ""
    # -- Key inside existingSecret holding the DSN. Default: STORE_DSN.
    existingSecretKey: STORE_DSN
    # -- Connection cap for the pgx pool.
    maxConns: 16
    # -- Baked Postgres-only configuration.
    baked:
      # -- Pinned image. Bump intentionally.
      image: postgres:18.4
      # -- Operator-supplied Secret holding the Postgres password. When
      # set, the chart does NOT generate its own password Secret; the
      # baked StatefulSet reads the password from this Secret and the app
      # assembles STORE_DSN at runtime via $(POSTGRES_PASSWORD). Use this
      # for GitOps/ArgoCD: the chart's default `lookup`-based password
      # preservation returns nothing under `helm template`, so the
      # generated password rotates on every sync and drifts from the
      # already-initialised data directory (auth failures). Password must
      # be URL-safe (alphanumeric) — it is interpolated into the DSN URL.
      existingSecret: ""
      # -- Key inside existingSecret holding the password.
      existingSecretKey: POSTGRES_PASSWORD
      # -- Key inside existingSecret holding the api role's read-only
      # password (`repoguardian_ro`). Read only for a split API with no
      # `api.roDsn.existingSecret`. URL-safe, like the admin password.
      existingSecretROKey: RO_PASSWORD
      # -- Persistent volume size.
      storageSize: 10Gi
      # -- StorageClass name. Empty → cluster default.
      storageClassName: ""
      # -- Pod securityContext. Runs Postgres as the image's built-in
      # non-root user (uid/gid 999) so the entrypoint skips its
      # root-only chown of PGDATA (which fails on clusters/storage
      # that forbid chown, e.g. restrictive admission policies or
      # NFS root_squash); fsGroup makes kubelet set volume group
      # ownership instead. Set to `{}` to restore the image default
      # (root entrypoint + chown).
      podSecurityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
      # -- Resource requests/limits for the Postgres container.
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 1000m
          memory: 1Gi
    # -- CloudNativePG-only configuration.
    cnpg:
      # -- Number of CNPG instances.
      instances: 1
      # -- CNPG-managed Postgres image.
      imageName: ghcr.io/cloudnative-pg/postgresql:18.4
      # -- Storage block.
      storage:
        size: 10Gi
        storageClass: ""
      # -- Connection pooler (PgBouncer). Disabled by default.
      pooler:
        enabled: false
        # -- Pooler type: `rw` (primary) or `ro` (read-only replicas).
        type: rw
        # -- Pooler replica count.
        instances: 1
        pgbouncer:
          # -- PgBouncer pool mode: `session`, `transaction`, or `statement`.
          poolMode: transaction
          # -- PgBouncer `default_pool_size`.
          defaultPoolSize: 25
          # -- PgBouncer `max_client_conn`.
          maxClientConnections: 100
          # -- Extra `pgbouncer.ini` parameters (key-value pairs).
          parameters: {}
        monitoring:
          # -- Render a `PodMonitor` for the pooler. Requires the Prometheus Operator CRD.
          enablePodMonitor: false
        # Cilium does not support TCPRoute (cilium/cilium#42016), so external
        # connections use a LoadBalancer Service with BGP advertisement.
        service:
          # -- Enable an external LoadBalancer Service in front of the pooler.
          enabled: false
          # -- Service `type` (usually `LoadBalancer`).
          type: LoadBalancer
          # -- Extra Service annotations.
          annotations: {}
          # -- Service labels. Defaults wire Cilium BGP IP advertisement.
          labels:
            bgp.cilium.io/advertise-service: default
            bgp.cilium.io/ip-pool: default

# -- Repository discovery. The discovery schedule enumerates every
# installation's repositories and starts a RepoWorkflow for each new one.
# Webhooks (`installation_repositories.added`, `repository.created`) are
# the primary on-ramp; this is the safety net for missed deliveries.
discovery:
  # -- Toggle the discovery schedule. When false, webhooks still
  # discover repositories; only the periodic enumeration stops.
  enabled: true
  # -- Cadence between discovery runs. Lower values spend more API
  # budget on list_installation_repos; higher values delay discovery
  # of repositories the webhook path missed.
  interval: "1h"

# -- Compliance history (IMPL-0023 / DESIGN-0022). SnapshotWorkflow
# writes one compliance_history row per org on this cadence.
posture:
  # -- Cadence between compliance-history snapshots, the rows
  # `repo-guardian report --since` reads. This is not the posture
  # gauges: Prometheus already keeps those for its retention window,
  # typically weeks, and this table exists for "how compliant were we
  # last quarter", which no operational metrics store can answer.
  # Daily is already finer than any question the report asks, and the
  # rows are permanent — there is no retention machinery — so
  # shortening it accrues storage forever for resolution nobody
  # requested.
  snapshotInterval: "24h"

# -- HCL policy configuration
policy:
  # -- Inline HCL policy config (creates a ConfigMap)
  config: ""
  # -- Use an existing ConfigMap for policy config
  existingConfigMap: ""
  # -- Auto-close repo-guardian PRs when every file rule is
  # satisfied on the default branch (IMPL-0013 Phase 3). When
  # `true` (default), the PR is closed with a sticky comment and
  # the reconcile branch is deleted. When `false`, the PR stays
  # open until a human closes it.
  autoClosePR: true
  # -- Remove files from repo-guardian's own reconcile branch once the
  # rule that added them is satisfied on the default branch (IMPL-0013
  # Phase 3). When `true` (default), a PR stops proposing files that are
  # no longer needed. When `false`, no file is ever deleted from the
  # reconcile branch and PR bodies may list rules already satisfied on
  # the default branch.
  #
  # This is a kill switch, not a tuning knob: orphan cleanup is the only
  # path that deletes files, and INV-0014 is a fixed defect in it that
  # produced PRs proposing to remove files repositories legitimately
  # owned. Leave it enabled unless you have reason not to.
  orphanCleanup: true

# -- Additional environment variables
extraEnv: []
# -- Additional volumes
extraVolumes: []
# -- Additional volume mounts
extraVolumeMounts: []

# -- Node selector
nodeSelector: {}
# -- Tolerations
tolerations: []
# -- Affinity rules
affinity: {}
