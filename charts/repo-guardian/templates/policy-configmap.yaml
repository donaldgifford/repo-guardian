{{- /* The controls policy directory (IMPL-0029 7.9, OQ11): one key per
policy.files path, put back at its path by the volume's items. */ -}}
{{- if and .Values.policy.files (not .Values.policy.existingConfigMap) }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "repo-guardian.fullname" . }}-policy
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "repo-guardian.labels" . | nindent 4 }}
data:
  {{- range $path, $content := .Values.policy.files }}
  {{ include "repo-guardian.policyKey" $path }}: |
    {{- $content | nindent 4 }}
  {{- end }}
{{- end }}
