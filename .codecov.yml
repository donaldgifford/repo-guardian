---
# $schema=https://www.schemastore.org/codecov.json
coverage:
  status:
    project:
      default:
        target: 60%
        threshold: 40%
ignore:
  - "main.go"
  - "docs"
  - "scripts"
# rgctl (tools/rgctl) uploads under its own flag; see ci.yml.
flags:
  rgctl:
    paths:
      - tools/rgctl/
