# RBAC for the Tailscale sidecar.
# Tailscale needs permission to store state in a Secret when using
# TS_KUBE_SECRET (optional). With TS_STATE_DIR + emptyDir this is not
# strictly required, but included for completeness if we switch to
# Kubernetes-backed state persistence later.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: tailscale-sidecar
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create", "get", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: tailscale-sidecar
subjects:
  - kind: ServiceAccount
    name: repo-guardian
roleRef:
  kind: Role
  name: tailscale-sidecar
  apiGroup: rbac.authorization.k8s.io
