suite: prometheusrule
templates:
  - templates/prometheusrule.yaml
tests:
  - it: should not create prometheusrule by default
    asserts:
      - hasDocuments:
          count: 0

  - it: should create prometheusrule when enabled
    set:
      prometheusRule:
        enabled: true
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: kind
          value: PrometheusRule

  - it: should include the IMPL-0013 StaleOpenPRs alert
    set:
      prometheusRule:
        enabled: true
    asserts:
      - contains:
          path: spec.groups[0].rules
          content:
            alert: RepoGuardianStaleOpenPRs
          any: true

  - it: should include the IMPL-0013 PRDrift alert
    set:
      prometheusRule:
        enabled: true
    asserts:
      - contains:
          path: spec.groups[0].rules
          content:
            alert: RepoGuardianPRDrift
          any: true

  - it: should allow StaleOpenPRs to be disabled
    set:
      prometheusRule:
        enabled: true
        alerts:
          StaleOpenPRs:
            enabled: false
    asserts:
      - notContains:
          path: spec.groups[0].rules
          content:
            alert: RepoGuardianStaleOpenPRs

  - it: should allow PRDrift override of for and severity
    set:
      prometheusRule:
        enabled: true
        alerts:
          PRDrift:
            for: 15m
            severity: critical
    asserts:
      - contains:
          path: spec.groups[0].rules
          content:
            alert: RepoGuardianPRDrift
            for: 15m
            labels:
              severity: critical
          any: true

  # The window must outlive `for` or an isolated schema mismatch can
  # never drive the alert to firing (INV-0011 A7): the mismatch is
  # observed once per repo per sweep, so rate(...[15m]) fell back to
  # zero well before a 30m pending period elapsed.
  - it: should render the PropertySchemaMissing alert with a window longer than for
    set:
      prometheusRule:
        enabled: true
    asserts:
      - contains:
          path: spec.groups[0].rules
          content:
            alert: RepoGuardianPropertySchemaMissing
            expr: increase(repo_guardian_custom_property_missing_schema_total[1h]) > 0
            for: 5m
            labels:
              severity: warning
          any: true

  - it: should allow PropertySchemaMissing to be disabled
    set:
      prometheusRule:
        enabled: true
        alerts:
          PropertySchemaMissing:
            enabled: false
    asserts:
      - notContains:
          path: spec.groups[0].rules
          content:
            alert: RepoGuardianPropertySchemaMissing

  - it: should allow PropertySchemaMissing override of for and severity
    set:
      prometheusRule:
        enabled: true
        alerts:
          PropertySchemaMissing:
            for: 1h
            severity: critical
    asserts:
      - contains:
          path: spec.groups[0].rules
          content:
            alert: RepoGuardianPropertySchemaMissing
            for: 1h
            labels:
              severity: critical
          any: true

  # IMPL-0022 Phase 5: the backpressure alert reads a gauge published
  # by every pod's reaper tick, so there is no rate() window to
  # outlive `for` — the expression must stay a plain gauge threshold.
  - it: should render the QueueBackpressure gauge-threshold expression
    set:
      prometheusRule:
        enabled: true
    asserts:
      - contains:
          path: spec.groups[0].rules
          content:
            alert: RepoGuardianQueueBackpressure
            expr: max(repo_guardian_queue_delayed_depth) > 100
            for: 30m
            labels:
              severity: warning
          any: true

  - it: should apply the QueueBackpressure threshold override
    set:
      prometheusRule:
        enabled: true
        alerts:
          QueueBackpressure:
            threshold: 500
    asserts:
      - contains:
          path: spec.groups[0].rules
          content:
            alert: RepoGuardianQueueBackpressure
            expr: max(repo_guardian_queue_delayed_depth) > 500
          any: true

  - it: should allow QueueBackpressure to be disabled
    set:
      prometheusRule:
        enabled: true
        alerts:
          QueueBackpressure:
            enabled: false
    asserts:
      - notContains:
          path: spec.groups[0].rules
          content:
            alert: RepoGuardianQueueBackpressure

  # IMPL-0022 Phase 5: JobsExhausted must keep both legs — increase()
  # cannot see a brand-new counter series' first increment (INV-0012
  # finding E), so the `unless offset` leg covers the sub-1h window a
  # freshly-born exhausted counter is otherwise invisible in. This
  # locks the exact rendered expression, not just the alert name.
  - it: should render the JobsExhausted two-legged expression
    set:
      prometheusRule:
        enabled: true
    asserts:
      - contains:
          path: spec.groups[0].rules
          content:
            alert: RepoGuardianJobsExhausted
            expr: |
              sum(increase(repo_guardian_queue_attempts_exhausted_total[1h])) > 0
                or sum(repo_guardian_queue_attempts_exhausted_total
                  unless repo_guardian_queue_attempts_exhausted_total offset 1h) > 0
            for: 5m
            labels:
              severity: warning
          any: true

  - it: should allow JobsExhausted to be disabled
    set:
      prometheusRule:
        enabled: true
        alerts:
          JobsExhausted:
            enabled: false
    asserts:
      - notContains:
          path: spec.groups[0].rules
          content:
            alert: RepoGuardianJobsExhausted

  # INV-0015: parking has three reasons (access_denied, archived, fork) but
  # only one is a problem. Archived and fork parks are routine bookkeeping and
  # would page on every normal onboarding sweep, so the reason selector is
  # load-bearing — this locks the expression, not just the alert name.
  - it: should render RepoAccessDenied filtered to reason=access_denied
    set:
      prometheusRule:
        enabled: true
    asserts:
      - contains:
          path: spec.groups[0].rules
          content:
            alert: RepoGuardianRepoAccessDenied
            expr: increase(repo_guardian_repos_parked_total{reason="access_denied"}[1h]) > 0
            for: 15m
            labels:
              severity: warning
          any: true

  - it: should allow RepoAccessDenied to be disabled
    set:
      prometheusRule:
        enabled: true
        alerts:
          RepoAccessDenied:
            enabled: false
    asserts:
      - notContains:
          path: spec.groups[0].rules
          content:
            alert: RepoGuardianRepoAccessDenied
