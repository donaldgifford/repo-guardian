---
groups:
  - name: repo-guardian
    rules:
      - alert: RepoGuardianEvaluationErrorRate
        expr: |-
          (
            sum(rate(repo_guardian_evaluations_total{outcome="error"}[15m]))
            /
            (sum(rate(repo_guardian_evaluations_total[15m])) > 0)
          ) > 0.10
        for: 10m
        labels:
          severity: warning
        annotations:
          description: 'At 100% the evaluator cannot read GitHub or the store at all: usually the Evaluation App''s credentials, connectivity, or a policy that fails to load.'
          summary: More than 10% of evaluations are failing
      - alert: RepoGuardianControlEvaluationErrors
        expr: |-
          increase(repo_guardian_evaluation_errors_total[1h]) > 0
          or
          (repo_guardian_evaluation_errors_total unless repo_guardian_evaluation_errors_total offset 1h) > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          description: 'The control could not evaluate: a GitHub read it needs failed or was refused. One control erroring across an org is usually a missing App permission; the E4 logs name the repositories.'
          summary: A control is returning an error status
      - alert: RepoGuardianEvaluationFreshness
        expr: histogram_quantile(0.95, sum by (le) (rate(repo_guardian_evaluation_freshness_seconds_bucket[6h]))) > 172800
        for: 1h
        labels:
          severity: warning
        annotations:
          description: 'Evaluation is not keeping up with the fleet: check the evaluation queue''s schedule-to-start latency and budget waits before raising EVALUATOR_CONCURRENCY.'
          summary: Controls are re-evaluated more than two days apart (p95)
      - alert: RepoGuardianStaleEpochDiscards
        expr: sum(increase(repo_guardian_results_discarded_total{reason="stale_epoch"}[2h])) > 100
        for: 1h
        labels:
          severity: warning
        annotations:
          description: Assignments change between evaluation and record faster than evaluations finish — usually a policy being re-activated repeatedly. Evaluation work is being thrown away.
          summary: Evaluations keep being discarded for a moved assignment epoch
      - alert: RepoGuardianNoWebhooks
        expr: increase(repo_guardian_webhook_received_total[24h]) == 0
        for: 1h
        labels:
          severity: warning
        annotations:
          description: Either the App's webhook delivery is broken or the endpoint is unreachable. Check the App's recent deliveries in GitHub.
          summary: No webhook has been received in 24 hours
      - alert: RepoGuardianWebhookRejectionsHigh
        expr: sum by (reason) (rate(repo_guardian_webhook_rejected_total[30m])) > 0.1
        for: 30m
        labels:
          severity: warning
        annotations:
          description: Signature validation failures (401s) — usually a wrong or rotated webhook secret. Source-IP rejections happen at the operator's edge layer, not here (DESIGN-0023).
          summary: Webhook requests are being rejected
  - name: repo-guardian.remediation
    rules:
      - alert: RepoGuardianRemediationAppUnreachable
        expr: |-
          increase(repo_guardian_remediation_blocked_total{reason=~"remediation_app_no_access|remediation_app_suspended"}[1h]) > 0
          or
          (repo_guardian_remediation_blocked_total{reason=~"remediation_app_no_access|remediation_app_suspended"} unless repo_guardian_remediation_blocked_total{reason=~"remediation_app_no_access|remediation_app_suspended"} offset 1h) > 0
        labels:
          severity: warning
        annotations:
          description: Assignments in remediate mode were downgraded to evaluate because the Remediation App is not installed on the repository or its installation is suspended. Install or unsuspend the App, or set the org's mode to evaluate.
          summary: The Remediation App cannot reach repositories it is assigned to remediate
      - alert: RepoGuardianRemediationBlocked
        expr: |-
          increase(repo_guardian_remediation_blocked_total{reason=~"foreign_branch|permission"}[1h]) > 0
          or
          (repo_guardian_remediation_blocked_total{reason=~"foreign_branch|permission"} unless repo_guardian_remediation_blocked_total{reason=~"foreign_branch|permission"} offset 1h) > 0
        labels:
          severity: warning
        annotations:
          description: 'foreign_branch: someone else pushed to the remediation branch, so repo-guardian will not touch it until the branch is restored or deleted. permission: GitHub refused the Remediation App''s write; the App lacks a permission the control needs. The E4 logs name the repositories.'
          summary: A remediation is held on a foreign branch or a missing permission
      - alert: RepoGuardianRemediationConflictHeld
        expr: max by (org) (repo_guardian_remediation_holds{reason="conflict",age_bucket=~"7-30d|30d[+]"}) > 0
        for: 1h
        labels:
          severity: warning
        annotations:
          description: Two controls own one resource, or a human change keeps conflicting with the remediation. A short conflict resolves itself; a week means the policy needs an owner decision.
          summary: A remediation has been held on a conflict for over a week
  - name: repo-guardian.multi-replica
    rules:
      - alert: RepoGuardianStoreErrors
        expr: |-
          sum(rate(repo_guardian_store_query_seconds_count{outcome="error"}[10m]))
          /
          (sum(rate(repo_guardian_store_query_seconds_count[10m])) > 0) > 0.1
        for: 10m
        labels:
          severity: warning
        annotations:
          description: Postgres is unreachable, saturated, or the schema is behind the binary.
          summary: More than 10% of store queries are failing
      - alert: RepoGuardianRateLimitNearExhaustion
        expr: min(repo_guardian_rate_limit_remaining) < 200
        for: 5m
        labels:
          severity: warning
        annotations:
          description: Set by every evaluation from the response headers. The installation budget defers evaluations until the reset, so work waits rather than fails.
          summary: GitHub API budget is nearly exhausted
  - name: repo-guardian.temporal
    rules:
      - alert: RepoGuardianTemporalActivityBacklog
        expr: histogram_quantile(0.99, sum by (le, task_queue) (rate(temporal_activity_schedule_to_start_latency_seconds_bucket[30m]))) > 60
        for: 30m
        labels:
          severity: warning
        annotations:
          description: 'Far above Temporal''s generic 200ms on purpose: evaluations are GitHub rate-limit bound and a policy rollout queues work by design. Minutes of sustained wait mean the fleet cannot keep up; add evaluator replicas (or KEDA maxReplicas) or EVALUATOR_CONCURRENCY, within the GitHub budget.'
          summary: Activities wait more than a minute (p99) for a worker slot
      - alert: RepoGuardianTemporalStickyCacheEvictions
        expr: sum(rate(temporal_sticky_cache_total_forced_eviction[30m])) > 1
        for: 30m
        labels:
          severity: warning
        annotations:
          description: More long-lived workflows are active than the sticky cache holds (one EvaluationWorkflow per repository), so evicted workflows replay their history on every task. Add worker replicas; each has its own cache.
          summary: Workers are force-evicting cached workflows
      - alert: RepoGuardianTemporalWorkerSlotsExhausted
        expr: max by (task_queue, worker_type) (temporal_worker_task_slots_available{worker_type=~"WorkflowWorker|ActivityWorker"}) == 0
        for: 15m
        labels:
          severity: warning
        annotations:
          description: Every worker's slots are in use, so new tasks queue. Add worker replicas, or raise EVALUATOR_CONCURRENCY within the GitHub budget.
          summary: No worker has a free task slot
      - alert: RepoGuardianTemporalWorkflowTaskLatency
        expr: histogram_quantile(0.99, sum by (le, task_queue) (rate(temporal_workflow_task_schedule_to_start_latency_seconds_bucket[15m]))) > 0.2
        for: 15m
        labels:
          severity: warning
        annotations:
          description: Temporal's recommended threshold. Workflow tasks are short, so waiting means workers are saturated, down, or their build is not the deployment's current version (check the worker's deployment readiness check).
          summary: Workflow tasks wait more than 200ms (p99) to start
      - alert: RepoGuardianTemporalWorkflowTaskFailures
        expr: sum by (task_queue) (rate(temporal_workflow_task_execution_failed[15m])) > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          description: 'A failing workflow task retries forever and its workflow makes no progress. Almost always nondeterminism: a workflow change shipped without workflow.GetVersion. The worker log names the workflow id.'
          summary: Workflow tasks are failing
      - alert: RepoGuardianTemporalNoWorkerPollers
        expr: max by (task_queue, poller_type) (temporal_num_pollers{poller_type=~"workflow_task|activity_task"}) == 0
        for: 10m
        labels:
          severity: critical
        annotations:
          description: 'The process is up but takes no tasks: usually lost connectivity to the frontend or a build that is not the deployment''s current version.'
          summary: A worker has stopped polling its task queue
      - alert: RepoGuardianTemporalUnreachable
        expr: |-
          sum(rate(temporal_long_request_failure[10m]))
          /
          (sum(rate(temporal_long_request[10m])) > 0) > 0.5
        for: 10m
        labels:
          severity: critical
        annotations:
          description: 'Workers cannot reach the Temporal frontend: check the address, mTLS material and the frontend''s own health. Nothing evaluates until it recovers.'
          summary: Most Temporal polls are failing
