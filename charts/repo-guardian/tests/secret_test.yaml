suite: secret
templates:
  - templates/secret.yaml
tests:
  - it: should create secret when secrets.create is true
    set:
      config:
        appId: "12345"
      secrets:
        create: true
        webhookSecret: "my-secret"
        privateKey: "my-key"
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: kind
          value: Secret

  - it: should not create secret when secrets.create is false
    set:
      secrets:
        create: false
        existingSecret: "my-existing-secret"
    asserts:
      - hasDocuments:
          count: 0

  - it: should set app-id from config.appId
    set:
      config:
        appId: "99999"
      secrets:
        webhookSecret: "test"
        privateKey: "test"
    asserts:
      - equal:
          path: stringData.app-id
          value: "99999"

  - it: should set webhook-secret
    set:
      config:
        appId: "12345"
      secrets:
        webhookSecret: "super-secret"
        privateKey: "test"
    asserts:
      - equal:
          path: stringData.webhook-secret
          value: "super-secret"

  - it: should include private key when set
    set:
      config:
        appId: "12345"
      secrets:
        webhookSecret: "test"
        privateKey: "my-pem-key"
    asserts:
      - isNotNull:
          path: stringData.private-key
