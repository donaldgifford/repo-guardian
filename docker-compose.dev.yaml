# yaml-language-server: $schema=https://raw.githubusercontent.com/compose-spec/compose-spec/master/schema/compose-spec.json
#
# Local dev backing services for repo-guardian: Postgres and a Temporal
# dev server (IMPL-0025 Phase 9, OQ11). The v1 runtime's Valkey went
# with it (IMPL-0028 Phase 1).
#
# Bring up:  make dev-services        (Postgres + Temporal)
#            make run-local           (also migrates, then runs every role)
# Tear down: make dev-stop
#
# Endpoints:
#   STORE_DSN=postgres://repoguardian:repoguardian@localhost:5432/repoguardian?sslmode=disable
#   TEMPORAL_ADDRESS=localhost:7233   (plaintext; UI on http://localhost:8233)
---
services:
  postgres:
    image: postgres:18.4-alpine
    container_name: repo-guardian-dev-postgres
    environment:
      POSTGRES_USER: repoguardian
      POSTGRES_PASSWORD: repoguardian
      POSTGRES_DB: repoguardian
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "repoguardian", "-d", "repoguardian"]
      interval: 5s
      timeout: 3s
      retries: 5

  temporal:
    # The Temporal CLI's dev server: an in-memory cluster with the UI,
    # the repo-guardian namespace pre-registered. Pinned with the
    # temporaltest harness's CLI (OQ10).
    image: temporalio/temporal:1.9.1
    container_name: repo-guardian-dev-temporal
    command: ["server", "start-dev", "--ip", "0.0.0.0", "--namespace", "repo-guardian"]
    ports:
      - "7233:7233"
      - "8233:8233"
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health", "--address", "127.0.0.1:7233"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
      - valkey-data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres-data:
