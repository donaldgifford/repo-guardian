{{- /*
One Secret per enabled controls App without an existingSecret
(IMPL-0028 task 3.5): private-key and webhook-secret.
*/ -}}
{{- range $app := list "eval" "remediate" }}
{{- $a := index $.Values.github $app }}
{{- if and $a.appId (not $a.existingSecret) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "repo-guardian.appSecretName" (dict "ctx" $ "app" $app) }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "repo-guardian.labels" $ | nindent 4 }}
type: Opaque
stringData:
  webhook-secret: {{ required (printf "github.%s.webhookSecret is required unless github.%s.existingSecret is set" $app $app) $a.webhookSecret | quote }}
  private-key: |
    {{- required (printf "github.%s.privateKey is required unless github.%s.existingSecret is set" $app $app) $a.privateKey | nindent 4 }}
{{- end }}
{{- end }}
