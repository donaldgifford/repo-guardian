---
# -- Number of replicas
replicaCount: 1

image:
  # -- Container image repository
  repository: ghcr.io/donaldgifford/repo-guardian
  # -- Image pull policy
  pullPolicy: IfNotPresent
  # -- Overrides the image tag (default: appVersion)
  tag: ""

# -- Image pull secrets
imagePullSecrets: []
# -- Override the chart name
nameOverride: ""
# -- Override the full release name
fullnameOverride: ""

serviceAccount:
  # -- Create a ServiceAccount
  create: true
  # -- Annotations for the ServiceAccount
  annotations: {}
  # -- Override the ServiceAccount name
  name: ""

# -- Pod annotations
podAnnotations: {}
# -- Pod labels
podLabels: {}

# -- Pod security context
podSecurityContext: {}

# -- Container security context
securityContext:
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 65534

service:
  # -- Service type
  type: ClusterIP
  # -- Webhook HTTP port
  httpPort: 80
  # -- Metrics port
  metricsPort: 9090

# -- Container resource requests and limits
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

livenessProbe:
  # @default -- See values.yaml
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 5
  periodSeconds: 15

readinessProbe:
  # @default -- See values.yaml
  httpGet:
    path: /readyz
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10

# -- repo-guardian application configuration (env vars)
config:
  # -- GitHub App ID
  appId: ""
  # -- GitHub organization name
  org: ""
  # -- Webhook listen port
  port: 8080
  # -- Metrics listen port
  metricsPort: 9090
  # -- Log level (debug, info, warn, error)
  logLevel: "info"
  # -- Dry run mode
  dryRun: false
  # -- Worker count for check queue
  workerCount: 5
  # -- Queue size for check queue
  queueSize: 100
  # -- Reconciliation schedule interval (Go duration)
  scheduleInterval: "168h"
  # -- Skip forked repositories
  skipForks: true
  # -- Skip archived repositories
  skipArchived: true

# -- GitHub App secrets
secrets:
  # -- Create secret resource (false = use existing secret)
  create: true
  # -- Name of existing secret (when create=false)
  existingSecret: ""
  # -- GitHub webhook secret
  webhookSecret: ""
  # -- GitHub App private key (PEM format)
  privateKey: ""
  # -- Mount private key as file (true) or env var (false)
  privateKeyAsFile: true

# -- File-template overrides for the binary's TemplateStore.
#
# Breaking change in chart 0.4.0: the legacy `templates.codeowners`,
# `templates.dependabot`, and `templates.renovate` slots have been
# removed. Move existing values into `templates.files` keyed by
# filename (with `.tmpl` suffix), e.g.:
#
#   templates:
#     files:
#       codeowners.tmpl: |
#         * @platform-team
#       dependabot.tmpl: |
#         version: 2
#         updates: ...
#
# When `templates.existingConfigMap` is non-empty the chart skips
# rendering its own ConfigMap and the Deployment mounts the named
# ConfigMap at TEMPLATE_DIR. This is the escape hatch for operators
# who manage templates out-of-band (GitOps, Argo ApplicationSet, etc).
templates:
  # -- Map of filename to template content. Each entry becomes a
  # key in the rendered ConfigMap and is loaded by the binary at
  # startup. Filenames must end in `.tmpl`.
  files: {}
  # -- Name of an existing ConfigMap to mount at TEMPLATE_DIR
  # instead of rendering one from `templates.files`.
  existingConfigMap: ""

# -- Templating configuration: env-var injection and strict-mode
# validation.
#
# `templating.vars` exposes arbitrary environment variables to the
# binary's `env "VAR"` template helper. Values flow through to the
# Deployment's container env list; they are NOT secrets — use
# `secrets.*` or `extraEnv` (with valueFrom: secretKeyRef) for
# secret material. The chart rejects keys that collide with
# chart-managed env vars (GITHUB_APP_ID, WEBHOOK_SECRET, etc).
#
# `templating.strict` toggles `STRICT_TEMPLATES=true` on the
# Deployment. When enabled the binary validates every compiled PR
# template against a zero-value PRVars context at startup and
# fails fast on missing-field references.
templating:
  # -- Map of env-var key to value. Keys must not collide with
  # chart-managed env vars; the chart fails template rendering on
  # collisions.
  vars: {}
  # -- Enable startup-time strict validation of compiled PR
  # templates (sets STRICT_TEMPLATES=true on the Deployment).
  strict: false

# -- Webhook IP allowlist configuration
webhookIPAllowlist:
  # -- Enable GitHub IP allowlist middleware
  enabled: true
  # -- Allow requests when allowlist unavailable
  failOpen: false
  # -- Trust X-Forwarded-For proxy headers
  trustProxyHeaders: false

# -- Tailscale Funnel sidecar
tailscale:
  # -- Enable Tailscale sidecar container
  enabled: false
  # -- Tailscale container image
  image: ghcr.io/tailscale/tailscale:latest
  # -- Tailscale hostname (becomes <hostname>.<tailnet>.ts.net)
  hostname: repo-guardian
  # -- Use userspace networking (no CAP_NET_ADMIN needed)
  userspace: true
  # -- Name of existing secret containing 'authkey'
  authKeySecret: tailscale-auth
  # -- Create RBAC for Tailscale state management
  rbac:
    create: true

serviceMonitor:
  # -- Create Prometheus ServiceMonitor
  enabled: false
  # -- Scrape interval
  interval: 30s
  # -- Additional labels for ServiceMonitor
  labels: {}

# -- HCL policy configuration
policy:
  # -- Inline HCL policy config (creates a ConfigMap)
  config: ""
  # -- Use an existing ConfigMap for policy config
  existingConfigMap: ""

# -- Additional environment variables
extraEnv: []
# -- Additional volumes
extraVolumes: []
# -- Additional volume mounts
extraVolumeMounts: []

# -- Node selector
nodeSelector: {}
# -- Tolerations
tolerations: []
# -- Affinity rules
affinity: {}
