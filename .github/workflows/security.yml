---
# $schema=https://www.schemastore.org/github-action.json
name: Determine known CVEs through `govulncheck`
on:
  push:
    branches:
      - main
      - v2
  pull_request:
    branches:
      - main
      - v2
  schedule:
    # Mondays at 0000
    - cron: "0 0 * * 1"
jobs:
  check-for-vulnerabilities:
    name: Check for vulnerabilities using `govulncheck`
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      # Pinned in mise.toml (IMPL-0034 5.6); only this tool is installed.
      - name: Install govulncheck
        uses: jdx/mise-action@v3
        with:
          install_args: "go:golang.org/x/vuln/cmd/govulncheck"

      # NOTE that we want to produce the SARIF-formatted report, which can then be consumed by other tools ...
      - name: Run govulncheck
        run: govulncheck -format sarif ./... > govulncheck.sarif

      # ... such as the Code Scanning tab (https://github.com/oapi-codegen/oapi-codegen/security/code-scanning?query=is%3Aopen+branch%3Amain+tool%3Agovulncheck)
      - name: Upload SARIF file
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: govulncheck.sarif
          category: govulncheck
