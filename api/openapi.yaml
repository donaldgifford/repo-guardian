openapi: 3.1.0
info:
  title: repo-guardian API
  version: 1.1.0
  summary: Read-only compliance API for repo-guardian v2.
  description: |
    The read-only API behind the repo-guardian UI and status page
    (DESIGN-0027). Every endpoint is a GET. Responses are JSON, times
    are RFC 3339 UTC, and errors are RFC 9457 problem details.

    Results are scoped to the orgs the caller may see. An org the
    caller cannot see answers 404, the same as an unknown one; a caller
    who can see no org gets 403 everywhere except `/me`.

    Enums documented as open may gain values within `/api/v1`. Clients
    must treat an unknown value as opaque rather than fail.
  license:
    name: Apache-2.0
    identifier: Apache-2.0
servers:
  - url: /api/v1
security:
  - bearerAuth: []
tags:
  - name: identity
    description: Who the caller is.
  - name: fleet
    description: Aggregates over the visible orgs.
  - name: repositories
    description: Repositories and their history.
  - name: meta
    description: The service and its contract.
paths:
  /me:
    get:
      operationId: getMe
      summary: The caller's identity and visible orgs.
      description: Answers even when the caller can see no org, so the UI can show an "ask for access" page.
      tags: [identity]
      responses:
        "200":
          description: The caller.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          $ref: "#/components/responses/Unauthorized"
        default:
          $ref: "#/components/responses/Error"
  /orgs:
    get:
      operationId: listOrgs
      summary: Compliance by org over the visible orgs.
      tags: [fleet]
      responses:
        "200":
          description: Every visible org with repositories.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrgList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        default:
          $ref: "#/components/responses/Error"
  /repositories:
    get:
      operationId: listRepositories
      summary: Repositories in the visible orgs, filtered.
      tags: [repositories]
      parameters:
        - name: org
          in: query
          description: An org login, case-insensitive.
          schema:
            type: string
        - name: active
          in: query
          description: Only active (true) or parked (false) repositories.
          schema:
            type: boolean
        - name: park_reason
          in: query
          description: Only repositories parked for this reason.
          schema:
            $ref: "#/components/schemas/ParkReason"
        - name: q
          in: query
          description: A repository-name prefix, case-insensitive.
          schema:
            type: string
            maxLength: 100
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: A page of repositories.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RepositoryPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        default:
          $ref: "#/components/responses/Error"
  /repositories/{id}:
    get:
      operationId: getRepository
      summary: One repository with its last check.
      tags: [repositories]
      parameters:
        - $ref: "#/components/parameters/RepositoryID"
      responses:
        "200":
          description: The repository.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RepositoryDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"
  /repositories/{id}/events:
    get:
      operationId: listRepositoryEvents
      summary: The repository's timeline, result and repository events merged, newest first.
      tags: [repositories]
      parameters:
        - $ref: "#/components/parameters/RepositoryID"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: A page of events.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"
  /repositories/{id}/checks:
    get:
      operationId: listRepositoryChecks
      summary: The repository's recent checks, newest first.
      tags: [repositories]
      parameters:
        - $ref: "#/components/parameters/RepositoryID"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: A page of checks.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"
  /status:
    get:
      operationId: getStatus
      summary: Public service status.
      description: |
        Served from a cache refreshed every 30s. It never names an org,
        repository, rule or installation, and carries no error text.
      tags: [meta]
      security: []
      responses:
        "200":
          description: The status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
        default:
          $ref: "#/components/responses/Error"
  /openapi.yaml:
    get:
      operationId: getOpenAPI
      summary: This contract.
      tags: [meta]
      security: []
      responses:
        "200":
          description: The OpenAPI document.
          content:
            application/yaml: {}
        default:
          $ref: "#/components/responses/Error"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: An OIDC access token issued for the API's audience. ID tokens are refused.
  parameters:
    Cursor:
      name: cursor
      in: query
      description: The next_cursor of the previous page.
      schema:
        $ref: "#/components/schemas/Cursor"
    Limit:
      name: limit
      in: query
      description: Page size.
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    RepositoryID:
      name: id
      in: path
      description: A repository id.
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
  responses:
    BadRequest:
      description: The request is malformed.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unauthorized:
      description: The bearer token is missing or invalid.
      headers:
        WWW-Authenticate:
          description: Bearer challenge, per RFC 6750.
          schema:
            type: string
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Forbidden:
      description: The caller can see no org.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: No such resource, or one in an org the caller cannot see.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Error:
      description: An unexpected error.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    Problem:
      description: RFC 9457 problem details.
      type: object
      required: [type, title, status]
      properties:
        type:
          type: string
          description: A URI reference identifying the problem type; "about:blank" when only the status applies.
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        instance:
          type: string
        request_id:
          type: string
          description: The request ID, for matching server logs.
    Cursor:
      description: |
        An opaque keyset cursor. Pass it back unchanged as `?cursor=` to
        fetch the next page; a cursor from different filters is refused.
      type: string
    ParkReason:
      description: "Open enum: access_denied, archived, fork, removed, installation_removed, unknown."
      type: string
      examples: [archived]
    ComponentState:
      description: "Open enum: operational, degraded, down, unknown."
      type: string
      examples: [operational]
    Me:
      description: The caller and the orgs it may see.
      type: object
      required: [subject, name, all_orgs, orgs]
      properties:
        subject:
          type: string
          description: The token's `sub`.
        name:
          type: string
          description: The display-name claim; empty when the token has none.
        client:
          type: [string, "null"]
          description: The `azp` of a machine client; null for a user.
        all_orgs:
          type: boolean
          description: The caller may see every org.
        orgs:
          type: array
          description: The orgs the caller may see; empty when all_orgs is set.
          items:
            type: string
    StatusCounts:
      description: Result counts by status.
      type: object
      required: [compliant, non_compliant, not_applicable, unknown]
      properties:
        compliant:
          type: integer
          minimum: 0
        non_compliant:
          type: integer
          minimum: 0
        not_applicable:
          type: integer
          minimum: 0
        unknown:
          type: integer
          minimum: 0
    Component:
      description: One status-page component.
      type: object
      required: [name, state, detail]
      properties:
        name:
          description: "Open enum: checks, webhooks, discovery, snapshots, github_budget, backlog, backlog_evaluation, backlog_remediation."
          type: string
        state:
          $ref: "#/components/schemas/ComponentState"
        detail:
          type: string
          description: A fixed template with a relative time, such as "last success 3m ago". Never error text.
    Compliance:
      description: Fleet-wide compliance for the status page.
      type: object
      required: [percent, measured, history]
      properties:
        percent:
          type: [number, "null"]
          format: double
        measured:
          type: boolean
        history:
          description: Fleet compliance at each UTC day's last snapshot over the last 30 days, oldest first.
          type: array
          items:
            $ref: "#/components/schemas/CompliancePoint"
    CompliancePoint:
      description: Fleet compliance at one snapshot; percent is null when nothing was measured.
      type: object
      required: [at, percent]
      properties:
        at:
          type: string
          format: date-time
        percent:
          type: [number, "null"]
          format: double
    StatusOperations:
      description: The status page's operations strip. Counts and times only.
      type: object
      required: [checked_24h, tracked, rollout_state]
      properties:
        checked_24h:
          description: Repositories with a finished check in the last 24 hours.
          type: integer
        tracked:
          description: Active repositories.
          type: integer
        rollout_state:
          description: The newest policy version's rollout; none before any version is recorded.
          type: string
          enum: [none, in_progress, complete]
        rollout_completed_at:
          type: string
          format: date-time
        last_snapshot_at:
          type: string
          format: date-time
    Status:
      description: The public service status.
      type: object
      required: [state, updated_at, components, compliance, operations]
      properties:
        state:
          $ref: "#/components/schemas/ComponentState"
        updated_at:
          type: string
          format: date-time
        components:
          type: array
          items:
            $ref: "#/components/schemas/Component"
        compliance:
          $ref: "#/components/schemas/Compliance"
        operations:
          $ref: "#/components/schemas/StatusOperations"
    OrgSummary:
      description: One org's repositories and compliance.
      type: object
      required: [org, tracked, parked, counts, compliant_percent, open_prs]
      properties:
        org:
          type: string
        tracked:
          type: integer
          minimum: 0
        parked:
          type: integer
          minimum: 0
        counts:
          $ref: "#/components/schemas/StatusCounts"
        compliant_percent:
          type: [number, "null"]
          format: double
        open_prs:
          description: Open repo-guardian pull requests on the org's active repositories.
          type: integer
          minimum: 0
    OrgList:
      description: Every visible org.
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrgSummary"
    Repository:
      description: One repository.
      type: object
      required: [id, org, name, active, discovered_at]
      properties:
        id:
          type: integer
          format: int64
        org:
          type: string
        name:
          type: string
        provider_repo_id:
          type: integer
          format: int64
        active:
          type: boolean
        park_reason:
          $ref: "#/components/schemas/ParkReason"
        parked_at:
          type: string
          format: date-time
        discovered_at:
          type: string
          format: date-time
        next_due_at:
          type: string
          format: date-time
        last_checked_at:
          type: string
          format: date-time
    RepositoryPage:
      description: A page of repositories.
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Repository"
        next_cursor:
          $ref: "#/components/schemas/Cursor"
    Check:
      description: One check of a repository.
      type: object
      required: [id, trigger, outcome, policy_version, started_at]
      properties:
        id:
          type: integer
          format: int64
        trigger:
          description: "Open enum: schedule, webhook, push, discovery, policy_rollout, bootstrap."
          type: string
        outcome:
          description: "Open enum: pending, success, error, skipped."
          type: string
        policy_version:
          type: string
        started_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time
        duration_seconds:
          type: number
          format: double
        error:
          type: string
    CheckPage:
      description: A page of checks.
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Check"
        next_cursor:
          $ref: "#/components/schemas/Cursor"
    RepositoryDetail:
      description: A repository with its last check.
      type: object
      required: [repository]
      properties:
        repository:
          $ref: "#/components/schemas/Repository"
        last_check:
          $ref: "#/components/schemas/Check"
    Event:
      description: |
        One timeline entry. A result event carries the control and its status
        transition (to_status is absent when the result was withdrawn); a
        repository event carries kind and detail.
      type: object
      required: [source, id, occurred_at]
      properties:
        source:
          description: "Open enum: result, repository."
          type: string
        id:
          type: integer
          format: int64
        occurred_at:
          type: string
          format: date-time
        control_id:
          type: string
        from_status:
          description: "Open enum: compliant, non_compliant, unknown, not_applicable."
          type: string
        to_status:
          description: "Open enum: compliant, non_compliant, unknown, not_applicable."
          type: string
        kind:
          description: "Open enum, repository events: discovered, renamed, transferred, parked, unparked, removed, suspended, unsuspended."
          type: string
        detail:
          type: object
          description: A repository event's detail, such as the names around a rename.
    EventPage:
      description: A page of timeline events.
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Event"
        next_cursor:
          $ref: "#/components/schemas/Cursor"
