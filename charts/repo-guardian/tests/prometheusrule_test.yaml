suite: prometheusrule
templates:
  - templates/prometheusrule.yaml
tests:
  - it: should not create prometheusrule by default
    asserts:
      - hasDocuments:
          count: 0

  - it: should create prometheusrule when enabled
    set:
      prometheusRule:
        enabled: true
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: kind
          value: PrometheusRule

  - it: should include the IMPL-0013 StaleOpenPRs alert
    set:
      prometheusRule:
        enabled: true
    asserts:
      - contains:
          path: spec.groups[0].rules
          content:
            alert: RepoGuardianStaleOpenPRs
          any: true

  - it: should include the IMPL-0013 PRDrift alert
    set:
      prometheusRule:
        enabled: true
    asserts:
      - contains:
          path: spec.groups[0].rules
          content:
            alert: RepoGuardianPRDrift
          any: true

  - it: should allow StaleOpenPRs to be disabled
    set:
      prometheusRule:
        enabled: true
        alerts:
          StaleOpenPRs:
            enabled: false
    asserts:
      - notContains:
          path: spec.groups[0].rules
          content:
            alert: RepoGuardianStaleOpenPRs

  - it: should allow PRDrift override of for and severity
    set:
      prometheusRule:
        enabled: true
        alerts:
          PRDrift:
            for: 15m
            severity: critical
    asserts:
      - contains:
          path: spec.groups[0].rules
          content:
            alert: RepoGuardianPRDrift
            for: 15m
            labels:
              severity: critical
          any: true

  - it: should render the BudgetGated alert by default
    set:
      prometheusRule:
        enabled: true
    asserts:
      - contains:
          path: spec.groups[0].rules
          content:
            alert: RepoGuardianBudgetGated
          any: true

  - it: should allow BudgetGated to be disabled
    set:
      prometheusRule:
        enabled: true
        alerts:
          BudgetGated:
            enabled: false
    asserts:
      - notContains:
          path: spec.groups[0].rules
          content:
            alert: RepoGuardianBudgetGated

  # The window must outlive `for` or an isolated schema mismatch can
  # never drive the alert to firing (INV-0011 A7): the mismatch is
  # observed once per repo per sweep, so rate(...[15m]) fell back to
  # zero well before a 30m pending period elapsed.
  - it: should render the PropertySchemaMissing alert with a window longer than for
    set:
      prometheusRule:
        enabled: true
    asserts:
      - contains:
          path: spec.groups[0].rules
          content:
            alert: RepoGuardianPropertySchemaMissing
            expr: increase(repo_guardian_custom_property_missing_schema_total[1h]) > 0
            for: 5m
            labels:
              severity: warning
          any: true

  - it: should allow PropertySchemaMissing to be disabled
    set:
      prometheusRule:
        enabled: true
        alerts:
          PropertySchemaMissing:
            enabled: false
    asserts:
      - notContains:
          path: spec.groups[0].rules
          content:
            alert: RepoGuardianPropertySchemaMissing

  - it: should allow PropertySchemaMissing override of for and severity
    set:
      prometheusRule:
        enabled: true
        alerts:
          PropertySchemaMissing:
            for: 1h
            severity: critical
    asserts:
      - contains:
          path: spec.groups[0].rules
          content:
            alert: RepoGuardianPropertySchemaMissing
            for: 1h
            labels:
              severity: critical
          any: true
