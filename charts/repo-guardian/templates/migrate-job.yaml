{{- if .Values.migrate.enabled }}
# `repo-guardian migrate` as a Helm hook (IMPL-0025 Phase 7): applies the
# v2 goose migrations, and on an adopted v1 database the one-time
# backfill, before the new pods start. before-hook-creation replaces a
# failed Job on the next attempt; hook-succeeded removes a finished one.
#
# WARN: pre-install hooks run before the release's own resources exist,
# so on a first install with baked Postgres (or a chart-rendered store
# Secret) the Job has nothing to connect to yet. Phase 17 settles the
# install ordering when it enables this by default.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "repo-guardian.fullname" . }}-migrate
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "repo-guardian.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrate
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
    helm.sh/hook-weight: "0"
spec:
  backoffLimit: {{ .Values.migrate.backoffLimit }}
  {{- with .Values.migrate.activeDeadlineSeconds }}
  activeDeadlineSeconds: {{ . }}
  {{- end }}
  template:
    metadata:
      labels:
        {{- include "repo-guardian.labels" . | nindent 8 }}
        app.kubernetes.io/component: migrate
    spec:
      restartPolicy: Never
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "repo-guardian.serviceAccountName" . }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: migrate
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["migrate"]
          env:
            {{- include "repo-guardian.storeDSNEnv" . | nindent 12 }}
            - name: RECONCILE_FRESHNESS
              value: {{ .Values.staleSweep.freshness | quote }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.migrate.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
{{- end }}
