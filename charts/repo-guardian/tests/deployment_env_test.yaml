suite: deployment-templating
templates:
  - templates/deployment.yaml
set:
  # One Deployment (topology: all) keeps these single-document; the
  # split shape is covered by topology_test.yaml.
  topology: all
  temporal:
    address: temporal:7233
  policy:
    files:
      enterprise.hcl: "enterprise {}"
  # The schedule env rides on the evaluator, in all only with its App.
  github:
    eval: {appId: "11", existingSecret: eval-app}

tests:
  - it: emits templating.vars entries onto the container env list
    set:
      templating:
        vars:
          JIRA_PROJECT: "PLAT"
          OWNING_TEAM: "platform"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: JIRA_PROJECT
            value: "PLAT"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: OWNING_TEAM
            value: "platform"

  - it: rejects templating.vars keys that collide with chart-managed env vars
    set:
      templating:
        vars:
          EVAL_INTERVAL: "anything"
    asserts:
      - failedTemplate:
          errorMessage: "templating.vars keys collide with chart-managed env vars: EVAL_INTERVAL"

  - it: emits IMPL-0015 Phase 1 discovery env vars with defaults
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DISCOVERY_ENABLED
            value: "true"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DISCOVERY_INTERVAL
            value: "1h"

  # IMPL-0023 task 2.5. The default is asserted as well as the
  # override: the binary defaults POSTURE_EXPORT_INTERVAL on its own,
  # so a chart that stopped emitting the var would keep working and
  # the drift would only surface when an operator set the value and
  # nothing happened.
  # IMPL-0023 task 7.3: the compliance-history rows are permanent, so an
  # operator who sets this expecting a slower cadence and silently gets
  # the 24h default is accruing rows they did not ask for.
  - it: emits the compliance snapshot interval with its default
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: COMPLIANCE_SNAPSHOT_INTERVAL
            value: "24h"

  - it: respects posture.snapshotInterval override
    set:
      posture:
        snapshotInterval: 168h
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: COMPLIANCE_SNAPSHOT_INTERVAL
            value: "168h"

  - it: does not render the removed reserve knobs
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: RATE_LIMIT_RESERVE
          any: true
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: DISCOVERY_RESERVE_FRACTION
          any: true
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: DISCOVERY_ESTIMATED_COST_PER_REPO
          any: true

  - it: respects discovery.enabled=false override
    set:
      discovery:
        enabled: false
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DISCOVERY_ENABLED
            value: "false"
