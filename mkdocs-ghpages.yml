---
# $schema=https://json.schemastore.org/mkdocs-1.6.json
# The public GitHub Pages site (gh-pages.yml). It inherits mkdocs.yml, so
# the nav has one source and cannot drift, and overrides only what Pages
# needs: the material theme, and the search plugin in place of
# techdocs-core, which is installed for TechDocs only. Mermaid blocks
# render as code here until IMPL-0035's Starlight site.
INHERIT: mkdocs.yml
theme:
  name: material
plugins:
  - search
