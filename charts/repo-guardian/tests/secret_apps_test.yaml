suite: secret-apps
# IMPL-0028 task 3.5: one Secret per enabled controls App without an
# existingSecret.
templates:
  - templates/secret-apps.yaml
release:
  name: rg
tests:
  - it: renders nothing while both blocks are off
    asserts:
      - hasDocuments: {count: 0}

  - it: creates a Secret per App from its values
    set:
      github:
        eval: {appId: "11", privateKey: EK, webhookSecret: EW}
        remediate: {appId: "22", privateKey: RK, webhookSecret: RW}
    asserts:
      - hasDocuments: {count: 2}
      - equal: {path: metadata.name, value: rg-repo-guardian-eval}
        documentIndex: 0
      - equal: {path: stringData.webhook-secret, value: EW}
        documentIndex: 0
      - equal: {path: metadata.name, value: rg-repo-guardian-remediate}
        documentIndex: 1

  - it: creates none for an App with an existingSecret
    set:
      github:
        eval: {appId: "11", existingSecret: mine}
    asserts:
      - hasDocuments: {count: 0}

  - it: fails without the private key
    set:
      github:
        remediate: {appId: "22", webhookSecret: RW}
    asserts:
      - failedTemplate:
          errorMessage: github.remediate.privateKey is required unless github.remediate.existingSecret is set
