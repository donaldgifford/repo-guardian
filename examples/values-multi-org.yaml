# Example Helm values for repo-guardian: a shared baseline across two
# orgs with per-org additions and an evaluate-only org
# (examples/policy/multi-org).
#
# Install:
#   helm install repo-guardian oci://ghcr.io/donaldgifford/charts/repo-guardian \
#     --namespace platform-tools --create-namespace \
#     -f examples/values-multi-org.yaml

temporal:
  address: temporal-frontend.temporal.svc.cluster.local:7233

# The Evaluation App (read-only). Add github.remediate.* to run the
# remediator and open pull requests.
github:
  eval:
    appId: "123456"
    # Secret with keys `private-key` and `webhook-secret`.
    existingSecret: repo-guardian-eval

# The policy root as a nested map by directory (a string is a file, a
# map is a directory). Byte-identical to examples/policy/multi-org —
# examples_test.go fails if the two drift.
policy:
  files:
    catalogue:
      catalog_info.hcl: |
        control "catalog_info" {
          version  = 1
          type     = "catalog_info"
          title    = "Backstage catalog entry"
          template = "catalog-info"

          rule "exists" {
            remediate = true
          }

          rule "kind" {
            remediate = true
          }
        }
      codeowners.hcl: |
        control "codeowners" {
          version     = 1
          type        = "codeowners"
          title       = "CODEOWNERS"
          description = "A CODEOWNERS file exists in one of GitHub's locations"
          template    = "codeowners"

          rule "exists" {
            title     = "A CODEOWNERS file exists"
            remediate = true
          }
        }
      dependabot.hcl: |
        control "dependabot" {
          version     = 1
          type        = "dependency_updates"
          title       = "Dependabot"
          description = "Dependabot version updates are configured"
          template    = "dependabot"
          tool        = "dependabot"

          rule "configured" {
            title     = "A Dependabot config exists"
            remediate = true
          }
        }
      protect_main.hcl: |
        control "protect_main" {
          version     = 1
          type        = "branch_ruleset"
          title       = "Default branch ruleset"
          description = "The default branch needs a reviewed pull request and linear history"
          name        = "protect-main"

          ruleset = {
            conditions = {
              ref_name = {
                include = ["~DEFAULT_BRANCH"]
                exclude = []
              }
            }
            rules = [
              {
                type = "pull_request"
                parameters = {
                  required_approving_review_count = 1
                  dismiss_stale_reviews_on_push   = true
                }
              },
              { type = "required_linear_history" },
              { type = "deletion" },
            ]
          }

          rule "exists" {
            remediate = true
          }

          rule "matches" {
            title     = "The ruleset matches the declaration"
            remediate = true
          }

          remediation {
            apply = "direct"
          }
        }
      protect_main_strict.hcl: |
        control "protect_main_strict" {
          version     = 1
          type        = "branch_ruleset"
          title       = "Default branch ruleset (production)"
          description = "Two approvals, stale reviews dismissed, linear history"
          name        = "protect-main"

          ruleset = {
            conditions = {
              ref_name = {
                include = ["~DEFAULT_BRANCH"]
                exclude = []
              }
            }
            rules = [
              {
                type = "pull_request"
                parameters = {
                  required_approving_review_count = 2
                  dismiss_stale_reviews_on_push   = true
                }
              },
              { type = "required_linear_history" },
              { type = "deletion" },
            ]
          }

          rule "exists" {
            remediate = true
          }

          rule "matches" {
            remediate = true
          }

          remediation {
            apply = "direct"
          }
        }
    enterprise.hcl: |
      # multi-org: what v1's strict scope mode did.
      # The enterprise list is the onboarding list; the baseline applies to
      # both orgs, and each org adds its own default-branch ruleset: two
      # approvals in production, one in staging, which is only evaluated.
      enterprise {
        orgs     = ["myorg-prod", "myorg-staging"]
        mode     = "remediate"
        controls = ["codeowners@1", "dependabot@1"]
      }
    orgs:
      myorg-prod.hcl: |
        org "myorg-prod" {
          controls = ["protect_main_strict@1", "catalog_info@1"]
        }
      myorg-staging.hcl: |
        org "myorg-staging" {
          mode     = "evaluate"
          controls = ["protect_main@1"]
        }
